type Query {
  Address(where: AddressWhere, orderBy: [AddressOrderBy!], limit: Int, offset: Int): [Address!]!
  AddressAggregate(where: AddressWhere): AddressAggregate!
  AddressGroups(where: AddressWhere, having: AddressGroupHaving, orderBy: [AddressGroupOrderBy!], limit: Int, offset: Int): [AddressGroup!]!
  Employee(where: EmployeeWhere, orderBy: [EmployeeOrderBy!], limit: Int, offset: Int): [EmployeeInterface!]!
  EmployeeAggregate(where: EmployeeWhere): EmployeeAggregate!
  EmployeeGroups(where: EmployeeWhere, having: EmployeeGroupHaving, orderBy: [EmployeeGroupOrderBy!], limit: Int, offset: Int): [EmployeeGroup!]!
  Firm(where: FirmWhere, orderBy: [FirmOrderBy!], limit: Int, offset: Int): [Firm!]!
  FirmAggregate(where: FirmWhere): FirmAggregate!
  FirmGroups(where: FirmWhere, having: FirmGroupHaving, orderBy: [FirmGroupOrderBy!], limit: Int, offset: Int): [FirmGroup!]!
  Manager(where: ManagerWhere, orderBy: [ManagerOrderBy!], limit: Int, offset: Int): [Manager!]!
  ManagerAggregate(where: ManagerWhere): ManagerAggregate!
  ManagerGroups(where: ManagerWhere, having: ManagerGroupHaving, orderBy: [ManagerGroupOrderBy!], limit: Int, offset: Int): [ManagerGroup!]!
  Person(where: PersonWhere, orderBy: [PersonOrderBy!], limit: Int, offset: Int): [PersonInterface!]!
  PersonAggregate(where: PersonWhere): PersonAggregate!
  PersonGroups(where: PersonWhere, having: PersonGroupHaving, orderBy: [PersonGroupOrderBy!], limit: Int, offset: Int): [PersonGroup!]!
}

type Address {
  city: String!
  country: Country!
  residents(where: PersonWhere, orderBy: [PersonOrderBy!], limit: Int, offset: Int): [PersonInterface!]!
  residentsAggregate(where: PersonWhere): PersonAggregate!
  residentsGroups(where: PersonWhere, having: PersonGroupHaving, orderBy: [PersonGroupOrderBy!], limit: Int, offset: Int): [PersonGroup!]!
}

type AddressAggregate {
  count: BigInt!
}

input AddressAggregateOrderBy {
  count: SortDirection
}

type AddressGroup {
  key: AddressGroupKey!
  count: BigInt!
}

input AddressGroupHaving {
  count: BigIntFilter
  AND: [AddressGroupHaving!]
  OR: [AddressGroupHaving!]
  NOT: AddressGroupHaving
}

type AddressGroupKey {
  city: String
  country: Country
}

input AddressGroupOrderBy {
  count: SortDirection
  key: AddressOrderBy
}

input AddressListFilter {
  some: AddressWhere
  every: AddressWhere
  none: AddressWhere
}

input AddressOrderBy {
  city: SortDirection
  country: SortDirection
  residentsAggregate: PersonAggregateOrderBy
}

input AddressWhere {
  city: StringFilter
  country: CountryFilter
  residents: PersonListFilter
  is: AddressWhere
  isNot: AddressWhere
  AND: [AddressWhere!]
  OR: [AddressWhere!]
  NOT: AddressWhere
}

"""
Pure's Integer: a signed 64-bit integer, written as an integer literal, carried as a JSON number (G5).
"""
scalar BigInt

input BigIntFilter {
  equals: BigInt
  not: BigIntFilter
  in: [BigInt!]
  notIn: [BigInt!]
  lt: BigInt
  lte: BigInt
  gt: BigInt
  gte: BigInt
}

enum Country {
  UK
  US
  JP
}

input CountryFilter {
  equals: Country
  not: CountryFilter
  in: [Country!]
  notIn: [Country!]
}

"""
Pure's StrictDate: an ISO-8601 date, "2024-01-01".
"""
scalar Date

input DateFilter {
  equals: Date
  not: DateFilter
  in: [Date!]
  notIn: [Date!]
  lt: Date
  lte: Date
  gt: Date
  gte: Date
}

"""
The unit a date key is truncated to under `key` (G7).
"""
enum DateUnit {
  YEAR
  QUARTER
  MONTH
  WEEK
  DAY
  HOUR
}

