# The GraphQL hardening corpus (docs/GRAPHQL_STUDY_2026_10_18.md §13.7): every case is answered by the product path
# (POST /api/lite/v1/graphql/query on the shop fixture) and by the reference evaluator, and the two must agree.
# A case is a block: `# name` first, then optional `# variables: {json}`, `# operation: Name`, `# error: text`
# (the case must be refused with an error containing the text; the reference is not consulted), then the document.
# Blocks are separated by a blank line.

# scalars: every kind, nulls in every nullable column
{ Customer(orderBy: [{ id: ASC }]) { id name email tier vip joined lastSeen credit score } }

# scalars: a 64-bit integer past 2^53 survives
{ Customer(where: { id: { equals: 4 } }) { id score } }

# scalars: the order rows, enums and nullable floats
{ Order(orderBy: [{ id: ASC }]) { id placed status note discount } }

# scalars: products, a null category and a null weight
{ Product(orderBy: [{ sku: ASC }]) { sku title category price weight } }

# derived: parameterless leaves
{ Customer(orderBy: [{ id: ASC }]) { id handle label loud } }

# derived: a parameterized leaf, a literal argument
{ Customer(orderBy: [{ id: ASC }]) { id idTimes(k: 3) } }

# derived: a parameterized leaf from a variable
# variables: {"k": 7}
query Q($k: BigInt!) { Customer(orderBy: [{ id: ASC }]) { id idTimes(k: $k) } }

# derived: counts over a navigation
{ Customer(orderBy: [{ id: ASC }]) { id orderCount } }

# derived: counts over a navigation, the order's lines
{ Order(orderBy: [{ id: ASC }]) { id lineCount } }

# derived: counts over a many-to-many
{ Product(orderBy: [{ sku: ASC }]) { sku tagCount } }

# derived: arithmetic over the row
{ Line(orderBy: [{ id: ASC }]) { id qty unitPrice amount } }

# derived: a filtered derived collection
{ Customer(orderBy: [{ id: ASC }]) { id liveOrders { id status } } }

# nesting: to-one, absent to-one
{ Order(orderBy: [{ id: ASC }]) { id customer { id name } } }

# nesting: to-many, empty lists
{ Customer(orderBy: [{ id: ASC }]) { id orders { id } } }

# nesting: the self-reference both ways
{ Customer(orderBy: [{ id: ASC }]) { id referrer { id name } referred { id } } }

# nesting: three levels down
{ Customer(orderBy: [{ id: ASC }]) { id orders { id lines { id product { sku title } } } } }

# nesting: four levels, up and down
{ Line(orderBy: [{ id: ASC }]) { id order { id customer { name referrer { name } } } } }

# nesting: a many-to-many each way
{ Product(orderBy: [{ sku: ASC }]) { sku tags { label } } }

# nesting: the other end of the many-to-many
{ Tag(orderBy: [{ id: ASC }]) { id label products { sku } } }

# nesting: derived leaves at depth
{ Line(orderBy: [{ id: ASC }]) { id amount order { lineCount customer { handle orderCount } } product { tagCount } } }

# nesting: a derived count through the many-to-many at depth
{ Tag(orderBy: [{ id: ASC }]) { id products { sku tagCount } } }

# aliases: two views of one field
{ Customer(orderBy: [{ id: ASC }]) { key: id who: name loud: handle shout: loud } }

# aliases: two root fields, filtered differently
{ gold: Customer(where: { tier: { equals: GOLD } }, orderBy: [{ id: ASC }]) { id } silver: Customer(where: { tier: { equals: SILVER } }, orderBy: [{ id: ASC }]) { id } }

# aliases: the same nested field twice with different arguments
{ Customer(orderBy: [{ id: ASC }]) { id open: orders(where: { status: { equals: OPEN } }) { id } shipped: orders(where: { status: { equals: SHIPPED } }) { id } } }

# fragments: a named fragment
fragment C on Customer { id name tier }
{ Customer(orderBy: [{ id: ASC }]) { ...C } }

# fragments: nested fragments and an inline fragment
fragment L on Line { id qty product { ...P } }
fragment P on Product { sku ... on Product { title } }
{ Order(orderBy: [{ id: ASC }]) { id lines { ...L } } }

# directives: include and skip
{ Customer(orderBy: [{ id: ASC }]) { id name @include(if: false) email @skip(if: false) tier @skip(if: true) } }

# directives: include from a variable
# variables: {"withName": true}
query Q($withName: Boolean!) { Customer(orderBy: [{ id: ASC }]) { id name @include(if: $withName) } }

# typename: at the root, nested and on a nested aggregate
{ Customer(orderBy: [{ id: ASC }], limit: 2) { __typename id orders { __typename id } ordersAggregate { __typename count } } }

# typename: inside a nested aggregate's folds
{ Order(orderBy: [{ id: ASC }]) { id linesAggregate { __typename sum { __typename qty } } } }

# typename: on a groups root, its key and its folds
{ CustomerGroups(orderBy: [{ key: { vip: ASC } }]) { __typename key { __typename vip } count sum { __typename score } } }

# typename: on a root aggregate and its folds
{ CustomerAggregate { __typename count min { __typename joined } } }

# aliases: a double underscore inside an alias at the root aggregate
{ CustomerAggregate { all__rows: count sum { s__score: score } } }

# aliases: a double underscore inside a group's alias
{ CustomerGroups(orderBy: [{ key: { tier: ASC } }]) { k__ey: key { t__ier: tier } n__: count } }

# aliases: one fold twice under two aliases
{ CustomerAggregate { a: max { score } b: max { joined } c: count } }

# aliases: a nested aggregate's folds aliased
{ Customer(orderBy: [{ id: ASC }]) { id o: ordersAggregate { n: count first: min { p: placed } } } }

# operations: the named operation chosen
# operation: Second
query First { Customer(orderBy: [{ id: ASC }]) { id } }
query Second { Order(orderBy: [{ id: ASC }]) { id } }

# variables: a where object from a variable
# variables: {"w": {"tier": {"equals": "GOLD"}}}
query Q($w: CustomerWhere) { Customer(where: $w, orderBy: [{ id: ASC }]) { id tier } }

# variables: a list of enum values
# variables: {"ts": ["GOLD", "BRONZE"]}
query Q($ts: [Tier!]) { Customer(where: { tier: { in: $ts } }, orderBy: [{ id: ASC }]) { id tier } }

# variables: limit and offset
# variables: {"n": 2, "m": 1}
query Q($n: Int, $m: Int) { Customer(orderBy: [{ id: ASC }], limit: $n, offset: $m) { id } }

# variables: a default value
query Q($n: Int = 3) { Customer(orderBy: [{ id: ASC }], limit: $n) { id } }

# variables: a string with quotes and a percent
# variables: {"s": "don't"}
query Q($s: String) { Order(where: { note: { equals: $s } }) { id note } }

# filters: a condition three to-one hops deep
{ Customer(where: { referrer: { referrer: { referrer: { handle: { equals: "zed_" } } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: equals on a string with a quote
{ Customer(where: { name: { equals: "Carol O'Neil" } }) { id } }

# filters: contains a literal percent
{ Customer(where: { name: { contains: "%" } }, orderBy: [{ id: ASC }]) { id name } }

# filters: contains a literal underscore
{ Customer(where: { name: { contains: "_" } }, orderBy: [{ id: ASC }]) { id name } }

# filters: startsWith and endsWith
{ Customer(where: { email: { startsWith: "a", endsWith: ".com" } }, orderBy: [{ id: ASC }]) { id email } }

# filters: unicode, case-sensitive
{ Customer(where: { name: { startsWith: "É" } }) { id name } }

# filters: case-insensitive equals
{ Customer(where: { name: { equals: "alice", mode: insensitive } }, orderBy: [{ id: ASC }]) { id name } }

# filters: case-insensitive contains
{ Customer(where: { email: { contains: "EXAMPLE", mode: insensitive } }, orderBy: [{ id: ASC }]) { id } }

# filters: case-insensitive not contains, nulls included
{ Customer(where: { email: { not: { contains: "EXAMPLE" }, mode: insensitive } }, orderBy: [{ id: ASC }]) { id } }

# filters: case-insensitive range
{ Customer(where: { name: { gt: "alice", mode: insensitive } }, orderBy: [{ id: ASC }]) { id } }

# filters: not equals includes the nulls
{ Customer(where: { tier: { not: { equals: GOLD } } }, orderBy: [{ id: ASC }]) { id tier } }

# filters: in and notIn
{ Customer(where: { tier: { in: [GOLD, SILVER] } }, orderBy: [{ id: ASC }]) { id tier } }

# filters: notIn includes the nulls
{ Customer(where: { tier: { notIn: [GOLD] } }, orderBy: [{ id: ASC }]) { id tier } }

# filters: an empty in list
{ Customer(where: { tier: { in: [] } }) { id } }

# filters: an empty notIn list
{ Customer(where: { tier: { notIn: [] } }, orderBy: [{ id: ASC }]) { id } }

# filters: equals null
{ Customer(where: { tier: { equals: null } }, orderBy: [{ id: ASC }]) { id } }

# filters: not equals null
{ Customer(where: { tier: { not: { equals: null } } }, orderBy: [{ id: ASC }]) { id } }

# filters: integer ranges
{ Customer(where: { score: { gte: 0, lt: 100 } }, orderBy: [{ id: ASC }]) { id score } }

# filters: a 64-bit literal
{ Customer(where: { score: { gt: 9007199254740992 } }) { id score } }

# filters: decimals
{ Customer(where: { credit: { gt: 100.0 } }, orderBy: [{ id: ASC }]) { id credit } }

# filters: floats with nulls
{ Order(where: { discount: { lt: 0.2 } }, orderBy: [{ id: ASC }]) { id discount } }

# filters: booleans
{ Customer(where: { vip: { equals: true } }, orderBy: [{ id: ASC }]) { id } }

# filters: dates, a leap day
{ Order(where: { placed: { equals: "2024-02-29" } }) { id placed } }

# filters: date ranges
{ Order(where: { placed: { gte: "2024-02-01", lt: "2024-04-01" } }, orderBy: [{ id: ASC }]) { id placed } }

# filters: date-times
{ Customer(where: { lastSeen: { gte: "2024-06-01T00:00:00" } }, orderBy: [{ id: ASC }]) { id lastSeen } }

# filters: AND of two leaves
{ Customer(where: { AND: [{ vip: { equals: true } }, { tier: { equals: BRONZE } }] }) { id } }

# filters: OR of two leaves
{ Customer(where: { OR: [{ tier: { equals: GOLD } }, { score: { lt: 1 } }] }, orderBy: [{ id: ASC }]) { id } }

# filters: NOT of a comparison holds of the nulls
{ Customer(where: { NOT: { score: { gt: 5 } } }, orderBy: [{ id: ASC }]) { id score } }

# filters: nested AND, OR and NOT
{ Customer(where: { OR: [{ AND: [{ vip: { equals: true } }, { NOT: { tier: { equals: GOLD } } }] }, { email: { equals: null } }] }, orderBy: [{ id: ASC }]) { id } }

# filters: an empty OR matches nothing
{ Customer(where: { OR: [] }) { id } }

# filters: an empty AND matches everything
{ Customer(where: { AND: [] }, orderBy: [{ id: ASC }]) { id } }

# filters: an empty where
{ Customer(where: {}, orderBy: [{ id: ASC }]) { id } }

# filters: a derived leaf
{ Customer(where: { handle: { startsWith: "a" } }, orderBy: [{ id: ASC }]) { id handle } }

# filters: a derived count
{ Customer(where: { orderCount: { gte: 1 } }, orderBy: [{ id: ASC }]) { id orderCount } }

# filters: to-one condition
{ Order(where: { customer: { tier: { equals: GOLD } } }, orderBy: [{ id: ASC }]) { id } }

# filters: to-one is null
{ Order(where: { customer: { is: null } }) { id } }

# filters: to-one isNot null
{ Line(where: { product: { isNot: null } }, orderBy: [{ id: ASC }]) { id } }

# filters: to-one is a condition
{ Customer(where: { referrer: { is: { name: { equals: "Alice" } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: to-one isNot a condition includes the absent
{ Customer(where: { referrer: { isNot: { name: { equals: "Alice" } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: NOT over a to-one condition
{ Customer(where: { referrer: { NOT: { name: { equals: "Alice" } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: a two-hop to-one path
{ Line(where: { order: { customer: { vip: { equals: true } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: some
{ Customer(where: { orders: { some: { status: { equals: OPEN } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: every is true of no orders
{ Customer(where: { orders: { every: { status: { equals: SHIPPED } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: none
{ Customer(where: { orders: { none: { status: { equals: CANCELLED } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: some with an empty condition
{ Customer(where: { orders: { some: {} } }, orderBy: [{ id: ASC }]) { id } }

# filters: some across the many-to-many
{ Product(where: { tags: { some: { label: { equals: "sale" } } } }, orderBy: [{ sku: ASC }]) { sku } }

# filters: none across the many-to-many
{ Tag(where: { products: { none: {} } }) { id label } }

# filters: some over a filtered derived collection
{ Customer(where: { liveOrders: { some: { status: { equals: OPEN } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: some, then a to-one
{ Customer(where: { orders: { some: { lines: { some: { product: { category: { equals: TOYS } } } } } } }, orderBy: [{ id: ASC }]) { id } }

# filters: nested lists
{ Customer(orderBy: [{ id: ASC }]) { id orders(where: { status: { not: { equals: CANCELLED } } }) { id status } } }

# filters: a nested list by a to-one path
{ Customer(orderBy: [{ id: ASC }]) { id referred(where: { referrer: { is: { vip: { equals: true } } } }) { id } } }

# filters: a nested list by a derived leaf that calls another
{ Customer(orderBy: [{ id: ASC }]) { id referred(where: { loud: { equals: "ALICE" } }) { id } } }

# filters: a nested many-to-many list
{ Product(orderBy: [{ sku: ASC }]) { sku tags(where: { label: { in: ["eco", "new"] } }) { label } } }

# filters: a nested list by a quantifier
{ Tag(orderBy: [{ id: ASC }]) { id products(where: { productLines: { some: { qty: { gte: 2 } } } }) { sku } } }

# filters: a nested list by a to-one existence
{ Customer(orderBy: [{ id: ASC }]) { id orders(where: { customer: { is: {} } }) { id } } }

# order: nulls sort largest, ascending
{ Customer(orderBy: [{ score: ASC }, { id: ASC }]) { id score } }

# order: nulls sort largest, descending
{ Customer(orderBy: [{ score: DESC }, { id: ASC }]) { id score } }

# order: strings by code point
{ Customer(orderBy: [{ name: ASC }]) { name } }

# order: enums by name
{ Customer(orderBy: [{ tier: ASC }, { id: ASC }]) { id tier } }

# order: booleans, false first
{ Customer(orderBy: [{ vip: ASC }, { id: DESC }]) { id vip } }

# order: dates and date-times
{ Customer(orderBy: [{ joined: DESC }, { lastSeen: ASC }, { id: ASC }]) { id joined lastSeen } }

# order: decimals
{ Customer(orderBy: [{ credit: DESC }, { id: ASC }]) { id credit } }

# order: by a to-one path
{ Customer(orderBy: [{ referrer: { name: ASC } }, { id: ASC }]) { id } }

# order: by a two-hop path
{ Line(orderBy: [{ order: { customer: { name: DESC } } }, { id: ASC }]) { id } }

# order: by a derived leaf
{ Customer(orderBy: [{ loud: DESC }, { id: ASC }]) { id loud } }

# order: by a derived count
{ Customer(orderBy: [{ orderCount: DESC }, { id: ASC }]) { id orderCount } }

# order: by a derived leaf through a to-one
{ Order(orderBy: [{ customer: { orderCount: ASC } }, { id: ASC }]) { id } }

# order: by a derived leaf three to-one hops deep
{ Customer(orderBy: [{ referrer: { referrer: { referrer: { handle: DESC } } } }, { id: ASC }]) { id } }

# order: by a derived count three to-one hops deep, the path selected too
{ Customer(orderBy: [{ referrer: { referrer: { referrer: { orderCount: DESC } } } }, { id: ASC }]) { id referrer { referrer { referrer { id orderCount } } } } }

# order: by an aggregate three to-one hops deep
{ Line(orderBy: [{ order: { customer: { referrer: { ordersAggregate: { count: DESC } } } } }, { id: ASC }]) { id } }

# order: by a many-to-many count
{ Product(orderBy: [{ tagCount: DESC }, { sku: ASC }]) { sku tagCount } }

# order: limit and offset
{ Customer(orderBy: [{ id: ASC }], limit: 3, offset: 2) { id } }

# order: offset past the end
{ Customer(orderBy: [{ id: ASC }], offset: 100) { id } }

# order: limit zero
{ Customer(orderBy: [{ id: ASC }], limit: 0) { id } }

# order: a nested list ordered and limited
{ Customer(orderBy: [{ id: ASC }]) { id orders(orderBy: [{ placed: DESC }, { id: ASC }], limit: 1) { id placed } } }

# order: a nested list offset
{ Product(orderBy: [{ sku: ASC }]) { sku tags(orderBy: [{ label: ASC }], offset: 1) { label } } }

# order: a nested list by a to-one path through the self-reference
{ Customer(orderBy: [{ id: ASC }]) { id referred(orderBy: [{ referrer: { referrer: { vip: DESC } } }, { id: ASC }]) { id } } }

# order: a nested list by a derived leaf that calls another
{ Customer(orderBy: [{ id: ASC }]) { id referred(orderBy: [{ loud: DESC }, { id: ASC }]) { id } } }

# order: a nested list by a derived count through a to-one
{ Tag(orderBy: [{ id: ASC }]) { id products(orderBy: [{ sku: ASC }]) { sku productLines(orderBy: [{ product: { tagCount: DESC } }, { id: ASC }]) { id } } } }

# order: by a nested count
{ Customer(orderBy: [{ ordersAggregate: { count: DESC } }, { id: ASC }]) { id orderCount } }

# order: by a nested max, nulls largest
{ Customer(orderBy: [{ ordersAggregate: { max: { discount: DESC } } }, { id: ASC }]) { id } }

# order: by a nested min over a date
{ Customer(orderBy: [{ ordersAggregate: { min: { placed: ASC } } }, { id: ASC }]) { id } }

# order: by a nested sum over a derived arithmetic leaf
{ Order(orderBy: [{ linesAggregate: { sum: { amount: DESC } } }, { id: ASC }]) { id } }

# order: by a nested average
{ Order(orderBy: [{ linesAggregate: { avg: { unitPrice: ASC } } }, { id: DESC }]) { id } }

# order: by an aggregate over a derived filtered collection
{ Customer(orderBy: [{ liveOrdersAggregate: { count: ASC } }, { id: ASC }]) { id } }

# order: by an aggregate over the many-to-many
{ Product(orderBy: [{ tagsAggregate: { max: { id: DESC } } }, { sku: ASC }]) { sku } }

# order: by the fold of a derived count
{ Customer(orderBy: [{ ordersAggregate: { max: { lineCount: ASC } } }, { id: ASC }]) { id } }

# order: by the sum of a derived count, each order counted once
{ Customer(orderBy: [{ ordersAggregate: { sum: { lineCount: DESC } } }, { id: ASC }]) { id } }

# order: by the fold of a many-to-many count, a tag with no products
{ Tag(orderBy: [{ productsAggregate: { min: { tagCount: DESC } } }, { id: ASC }]) { id } }

# order: by an aggregate through a to-one hop
{ Line(orderBy: [{ order: { linesAggregate: { min: { qty: DESC } } } }, { id: ASC }]) { id } }

# order: by an aggregate through two to-one hops
{ Order(orderBy: [{ customer: { referrer: { referredAggregate: { max: { joined: ASC } } } } }, { id: ASC }]) { id } }

# order: by a computed fold through a to-one hop
{ Line(orderBy: [{ order: { linesAggregate: { min: { amount: ASC } } } }, { id: DESC }]) { id } }

# order: by a derived filtered collection's aggregate through a to-one hop
{ Customer(orderBy: [{ referrer: { liveOrdersAggregate: { max: { discount: ASC } } } }, { id: ASC }]) { id } }

# order: by the fold of a derived count through a to-one hop
{ Order(orderBy: [{ customer: { ordersAggregate: { min: { lineCount: ASC } } } }, { id: ASC }]) { id } }

# order: by an aggregate through a to-one hop into the many-to-many
{ Line(orderBy: [{ product: { tagsAggregate: { max: { id: ASC } } } }, { id: ASC }]) { id } }

# order: a nested list by an aggregate
{ Customer(orderBy: [{ id: ASC }]) { id orders(orderBy: [{ linesAggregate: { sum: { qty: DESC } } }, { id: ASC }]) { id } } }

# order: by a string fold
{ Customer(orderBy: [{ ordersAggregate: { max: { note: DESC } } }, { id: ASC }]) { id } }

# order: a nested list by an aggregate through a to-one hop
{ Order(orderBy: [{ id: ASC }]) { id lines(orderBy: [{ order: { linesAggregate: { min: { id: DESC } } } }, { id: DESC }]) { id } } }

# aggregates: the root aggregate
{ CustomerAggregate { count sum { score credit } avg { score credit } min { joined lastSeen score } max { joined lastSeen credit } } }

# aggregates: a filtered root aggregate
{ CustomerAggregate(where: { vip: { equals: true } }) { count sum { score } } }

# aggregates: over no rows
{ CustomerAggregate(where: { id: { equals: -1 } }) { count sum { score } avg { score } min { joined } } }

# aggregates: floats and nulls
{ ProductAggregate { count sum { price weight } avg { price } min { price weight } max { weight } } }

# aggregates: nested per object
{ Customer(orderBy: [{ id: ASC }]) { id ordersAggregate { count } } }

# aggregates: nested with a where
{ Customer(orderBy: [{ id: ASC }]) { id ordersAggregate(where: { status: { equals: SHIPPED } }) { count min { placed } } } }

# aggregates: nested over a derived collection
{ Customer(orderBy: [{ id: ASC }]) { id liveOrdersAggregate { count max { placed } } } }

# aggregates: nested over the self-reference
{ Customer(orderBy: [{ id: ASC }]) { id referredAggregate { count min { score } } } }

# aggregates: nested over the many-to-many
{ Product(orderBy: [{ sku: ASC }]) { sku tagsAggregate { count } } }

# aggregates: a fold of a derived count
{ Product(orderBy: [{ sku: ASC }]) { sku tags { productsAggregate { min { tagCount } } } } }

# aggregates: a fold of a derived arithmetic leaf
{ Order(orderBy: [{ id: ASC }]) { id linesAggregate { sum { amount qty } avg { amount } } } }

# aggregates: string folds at the root, by code point
{ CustomerAggregate { min { name email } max { name email } } }

# aggregates: string folds nested, nulls skipped
{ Customer(orderBy: [{ id: ASC }]) { id ordersAggregate { min { note } max { note } } } }

# aggregates: string folds of derived leaves
{ Customer(orderBy: [{ id: ASC }]) { id referredAggregate { min { handle } max { loud label } } } }

# aggregates: string folds over the many-to-many
{ Product(orderBy: [{ sku: ASC }]) { sku tagsAggregate { min { label } max { label } } } }

# groups: by an enum
{ CustomerGroups(orderBy: [{ key: { tier: ASC } }]) { key { tier } count avg { score } } }

# groups: by a boolean, with having
{ CustomerGroups(having: { count: { gte: 2 } }, orderBy: [{ count: DESC }, { key: { vip: ASC } }]) { key { vip } count } }

# groups: by a month
{ OrderGroups(orderBy: [{ key: { placed: ASC } }]) { key { placed(truncate: MONTH) } count } }

# groups: by a to-one path
{ LineGroups(orderBy: [{ key: { product: { category: ASC } } }]) { key { product { category } } count sum { qty } } }

# groups: by two keys
{ OrderGroups(orderBy: [{ key: { status: ASC } }, { key: { customer: { tier: ASC } } }]) { key { status customer { tier } } count } }

# groups: filtered before grouping
{ CustomerGroups(where: { score: { gte: 0 } }, orderBy: [{ key: { tier: ASC } }]) { key { tier } count sum { score } } }

# groups: having on a fold
{ OrderGroups(having: { sum: { discount: { gt: 0.2 } } }, orderBy: [{ key: { status: ASC } }]) { key { status } sum { discount } } }

# groups: limited
{ CustomerGroups(orderBy: [{ count: DESC }, { key: { tier: ASC } }], limit: 2) { key { tier } count } }

# groups: the selection's order kept, folds before the key
{ CustomerGroups(orderBy: [{ key: { tier: ASC } }]) { count max { score } key { tier } } }

# groups: aliases on the key, its fields and the folds
{ OrderGroups(orderBy: [{ key: { status: ASC } }]) { k: key { s: status } n: count hi: max { d: discount } lo: min { d: discount } } }

# groups: a string fold in having
{ CustomerGroups(having: { min: { name: { startsWith: "A" } } }, orderBy: [{ key: { tier: ASC } }]) { key { tier } min { name } } }

# groups: ordered by a string fold
{ CustomerGroups(orderBy: [{ max: { name: ASC } }, { key: { tier: ASC } }]) { key { tier } max { name } } }

# regressions: a nested list filtered by a non-null derived count, zero included
{ Customer(orderBy: [{ id: ASC }]) { id referred(where: { orderCount: { lte: 0 } }) { id tier } } }

# regressions: a root filter by a derived count, zero included
{ Customer(where: { orderCount: { lte: 0 } }, orderBy: [{ id: ASC }]) { id } }

# regressions: a root sort through a to-one hop into a many-to-many count
{ Line(orderBy: [{ product: { tagCount: DESC } }, { id: ASC }]) { id product { sku tagCount } } }

# regressions: a root sort through two to-one hops into a count
{ Line(orderBy: [{ order: { customer: { orderCount: ASC } } }, { id: ASC }]) { id } }

# regressions: a root sort through the self-reference into a count
{ Order(orderBy: [{ customer: { referrer: { orderCount: DESC } } }, { id: ASC }]) { id } }

# regressions: a date key truncated to the day stays a date
{ CustomerGroups(orderBy: [{ key: { joined: ASC } }]) { key { joined(truncate: DAY) } count } }

# regressions: a date-time key truncated to the day
{ CustomerGroups(orderBy: [{ key: { lastSeen: ASC } }]) { key { lastSeen(truncate: DAY) } count } }

# regressions: a count inside a nested quantifier
{ Customer(where: { liveOrders: { some: { lineCount: { gte: 2 } } } }, orderBy: [{ id: ASC }]) { id } }

# regressions: a many-to-many count inside a many-to-many quantifier
{ Tag(where: { products: { every: { tagCount: { lte: 1 } } } }, orderBy: [{ id: ASC }]) { id } }

# regressions: a many-to-many under a many-to-many quantifier, three deep
{ Tag(where: { products: { some: { tags: { some: { products: { none: { price: { lte: 1.0 } } } } } } } }, orderBy: [{ id: ASC }]) { id } }

# features together: fragments, aliases and directives in one document
fragment Who on Customer { key: id who: handle }
{ vip: Customer(where: { vip: { equals: true } }, orderBy: [{ id: ASC }]) { ...Who tier @skip(if: true) ... on Customer { n: orderCount } } rest: Customer(where: { vip: { equals: false } }, orderBy: [{ id: DESC }]) { ...Who } }

# features together: a root aggregate and groups in one document
{ CustomerAggregate(where: { tier: { not: { equals: null } } }) { count min { joined } } CustomerGroups(orderBy: [{ key: { vip: DESC } }]) { key { vip } count avg { score } } }

# inheritance: the base's extent is the union, each object its own type
{ Payment(orderBy: [{ id: ASC }]) { __typename id amount paidAt } }

# inheritance: a subclass's extent is its own rows
{ CardPayment(orderBy: [{ id: ASC }]) { __typename id amount last4 network masked } }

# inheritance: subtype fragments at the root
{ Payment(orderBy: [{ id: ASC }]) { id ... on CardPayment { last4 network } ... on VoucherPayment { code expires } } }

# inheritance: a nested hierarchy under a to-many, with subtype fragments
{ Order(orderBy: [{ id: ASC }]) { id payments(orderBy: [{ id: ASC }]) { __typename id amount ... on CardPayment { last4 } ... on VoucherPayment { code } } } }

# inheritance: membership in where
{ Payment(where: { asCardPayment: { isNot: null } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: a subclass's condition in where
{ Payment(where: { asVoucherPayment: { code: { contains: "_", mode: insensitive } } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: a subclass's key in orderBy, absent on the others
{ Payment(orderBy: [{ asCardPayment: { last4: DESC } }, { id: ASC }]) { id } }

# inheritance: a quantifier over a nested hierarchy
{ Order(where: { payments: { some: { asCardPayment: { network: { equals: "VISA", mode: insensitive } } } } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: none of an order's payments large
{ Order(where: { payments: { none: { large: { equals: true } } } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: an aggregate over a nested hierarchy
{ Order(orderBy: [{ id: ASC }]) { id paymentsAggregate { count sum { amount } max { paidAt } } } }

# inheritance: the root aggregate over the union
{ PaymentAggregate { count sum { amount } avg { amount } min { paidAt } max { amount } } }

# inheritance: groups over the union
{ PaymentGroups(orderBy: [{ key: { large: ASC } }]) { key { large } count sum { amount } } }

# inheritance: the hierarchy's to-one back to its order
{ Payment(orderBy: [{ id: ASC }]) { id order { id status customer { name } } } }

# inheritance: sort by a nested hierarchy's aggregate
{ Order(orderBy: [{ paymentsAggregate: { sum: { amount: DESC } } }, { id: ASC }]) { id } }

# inheritance: a subclass's derived leaf in a fragment
{ Order(orderBy: [{ id: ASC }]) { id payments(where: { asCardPayment: { isNot: null } }) { ... on CardPayment { masked } } } }



# inheritance: a lone fragment under a nested hierarchy keeps every element
{ Order(orderBy: [{ id: ASC }]) { id payments(orderBy: [{ id: ASC }]) { ... on CardPayment { last4 } } } }

# inheritance: a member's keys in the order its fragments select them
{ Order(orderBy: [{ id: ASC }]) { id payments(orderBy: [{ amount: DESC }, { id: ASC }], limit: 2) { __typename ... on VoucherPayment { code expires } ... on PaymentInterface { amount } } } }

# inheritance: a subclass's derived leaf two lists deep
{ Customer(orderBy: [{ id: ASC }]) { id orders(orderBy: [{ id: ASC }]) { id payments(orderBy: [{ id: ASC }]) { id ... on CardPayment { masked } } } } }

# inheritance: a fragment re-selects a base to-one with other fields
{ Payment(orderBy: [{ id: ASC }]) { id ... on CardPayment { order { id } } order { status } } }

# inheritance: an inherited association read through a subclass's condition
{ Payment(where: { asVoucherPayment: { order: { status: { equals: OPEN } } } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: a quantifier inside a quantifier over the hierarchy
{ Customer(where: { orders: { some: { payments: { some: { asCardPayment: { network: { not: { equals: null } } } } } } } }, orderBy: [{ id: ASC }]) { id } }

# inheritance: a nested list filtered through a subclass's association
{ Order(orderBy: [{ id: ASC }]) { id payments(where: { asCardPayment: { order: { lineCount: { gt: 1 } } } }) { id } } }

# inheritance: an empty subclass condition filters nothing
{ Payment(where: { asCardPayment: {} }, orderBy: [{ id: ASC }]) { id } }

# inheritance: a subclass's root, its derived and inherited leaves, its type
{ CardPayment(orderBy: [{ id: ASC }]) { __typename id amount large last4 network masked order { id } } }

# nested groups: each customer's orders by status
{ Customer(orderBy: [{ id: ASC }]) { id ordersGroups(orderBy: [{ key: { status: ASC } }]) { key { status } count } } }

# nested groups: filtered before, having after, sorted by the count
{ Customer(orderBy: [{ id: ASC }]) { id ordersGroups(where: { status: { not: { equals: CANCELLED } } }, having: { count: { gte: 1 } }, orderBy: [{ count: DESC }, { key: { status: ASC } }]) { count key { status } } } }

# nested groups: a key through a to-one hop, two folds
{ Order(orderBy: [{ id: ASC }]) { id linesGroups(orderBy: [{ key: { product: { category: ASC } } }]) { key { product { category } } count sum { qty } avg { unitPrice } } } }

# nested groups: a month key, offset and limited
{ Customer(orderBy: [{ id: ASC }]) { id ordersGroups(orderBy: [{ key: { placed: DESC } }], limit: 1, offset: 1) { key { placed(truncate: MONTH) } count } } }

# nested groups: having on a fold the selection does not carry
{ Customer(orderBy: [{ id: ASC }]) { id ordersGroups(having: { sum: { discount: { gt: 0.05 } } }, orderBy: [{ key: { status: ASC } }]) { key { status } count } } }

# nested groups: aliases and __typename at every level
{ Customer(orderBy: [{ id: ASC }]) { id g: ordersGroups(orderBy: [{ key: { status: ASC } }]) { __typename k: key { __typename s: status } n: count f: max { d: discount } } } }

# nested groups: over a derived collection
{ Customer(orderBy: [{ id: ASC }]) { id liveOrdersGroups(orderBy: [{ key: { status: ASC } }]) { key { status } count } } }

# nested groups: groups of lines under each order under each customer
{ Customer(orderBy: [{ id: ASC }]) { id orders(orderBy: [{ id: ASC }]) { id linesGroups(orderBy: [{ key: { qty: ASC } }]) { key { qty } count } } } }

# nested groups: beside the aggregate and the list of the same collection
{ Customer(orderBy: [{ id: ASC }]) { id ordersAggregate { count } ordersGroups(orderBy: [{ key: { status: ASC } }]) { key { status } count } orders(orderBy: [{ id: ASC }]) { id } } }

# nested groups: over a union hierarchy, by a derived key
{ Order(orderBy: [{ id: ASC }]) { id paymentsGroups(orderBy: [{ key: { large: ASC } }]) { key { large } count sum { amount } } } }

# nested groups: in a fragment, a variable in having
# variables: {"n": 1}
query Q($n: BigInt) { Customer(orderBy: [{ id: ASC }]) { ...F } } fragment F on Customer { id ordersGroups(having: { count: { gte: $n } }, orderBy: [{ key: { status: ASC } }]) { key { status } count } }

# nested groups: under a to-one hop
{ Order(orderBy: [{ id: ASC }]) { id customer { name ordersGroups(orderBy: [{ count: DESC }, { key: { status: ASC } }], limit: 1) { key { status } count } } } }

# nested groups: an empty collection is an empty list
{ Customer(where: { orders: { none: {} } }, orderBy: [{ id: ASC }]) { id ordersGroups(orderBy: [{ key: { status: ASC } }]) { key { status } count } } }

# temporal: the listings on a date, with the date they were read as of
{ Listing(businessDate: "2024-01-01", orderBy: [{ sku: ASC }]) { sku price channel onSale businessDate } }

# temporal: a version holds from its first day (BK-1's new price starts 2024-01-01), not on its last
{ Listing(businessDate: "2023-12-31", orderBy: [{ sku: ASC }]) { sku price } }

# temporal: the leap day's one-day version
{ Listing(businessDate: "2024-02-29", orderBy: [{ sku: ASC }]) { sku price onSale } }

# temporal: a date before every version
{ Listing(businessDate: "2019-06-01") { sku } }

# temporal: a product's listing on a date, null where none holds
{ Product(orderBy: [{ sku: ASC }]) { sku listing(businessDate: "2024-02-15") { price channel } } }

# temporal: one field at two dates under two aliases
{ Product(orderBy: [{ sku: ASC }]) { sku before: listing(businessDate: "2023-12-31") { price } after: listing(businessDate: "2024-01-01") { price onSale } } }

# temporal: a listing's product (a non-temporal target takes no date)
{ Listing(businessDate: "2024-02-15", orderBy: [{ sku: ASC }]) { sku product { title category } } }

# temporal: filtered by its product, sorted by price
{ Listing(businessDate: "2024-03-01", where: { product: { category: { in: [BOOKS, TOYS] } } }, orderBy: [{ price: DESC }]) { sku price } }

# temporal: through two hops (a line's product's listing)
{ Line(orderBy: [{ id: ASC }]) { id product { sku listing(businessDate: "2024-01-01") { price onSale } } } }

# temporal: the aggregate on a date
{ ListingAggregate(businessDate: "2024-03-01") { count sum { price } min { price channel } max { price } } }

# temporal: groups on a date
{ ListingGroups(businessDate: "2024-02-15", orderBy: [{ key: { channel: ASC } }]) { key { channel } count avg { price } } }

# temporal: groups by the product's category on a date, with having
{ ListingGroups(businessDate: "2024-03-01", having: { count: { gte: 1 } }, orderBy: [{ key: { product: { category: ASC } } }]) { key { product { category } } count } }

# temporal: the date from a variable
# variables: {"d": "2024-02-29"}
query Q($d: Date!) { Listing(businessDate: $d, orderBy: [{ sku: ASC }]) { sku price } Product(orderBy: [{ sku: ASC }]) { sku listing(businessDate: $d) { price } } }

# temporal lists: a product's stock on a date, filtered and sorted
{ Product(orderBy: [{ sku: ASC }]) { sku stock(businessDate: "2024-02-15", where: { qty: { gt: 0 } }, orderBy: [{ warehouse: DESC }]) { warehouse qty businessDate } } }

# temporal lists: the same list at two dates, one paged
{ Product(orderBy: [{ sku: ASC }]) { sku jan: stock(businessDate: "2024-01-15", orderBy: [{ qty: DESC }, { bin: ASC }], limit: 1) { bin qty } feb: stock(businessDate: "2024-02-15") { bin qty } } }

# temporal lists: the aggregate on a date
{ Product(orderBy: [{ sku: ASC }]) { sku stockAggregate(businessDate: "2024-02-29") { count sum { qty } min { warehouse } } } }

# temporal lists: the groups on a date, with having
{ Product(orderBy: [{ sku: ASC }]) { sku stockGroups(businessDate: "2024-02-29", having: { sum: { qty: { gte: 1 } } }, orderBy: [{ key: { warehouse: ASC } }]) { key { warehouse } count sum { qty } } } }

# temporal lists: a temporal root's object reaching another temporal list at another date
{ Stock(businessDate: "2024-01-01", orderBy: [{ bin: ASC }]) { bin businessDate stocked { sku stock(businessDate: "2024-02-15", orderBy: [{ bin: ASC }]) { bin qty businessDate } } } }

# temporal lists: groups across products by a to-one key
{ StockGroups(businessDate: "2024-02-29", orderBy: [{ key: { stocked: { category: ASC } } }]) { key { stocked { category } } count sum { qty } } }

# errors: a temporal root without its date
# error: businessDate
{ Listing { sku } }

# errors: a temporal field without its date
# error: businessDate
{ Product { sku listing { price } } }

# errors: a condition through a temporal navigation (it takes a date no input can carry)
# error: listing
{ Product(where: { listing: { onSale: { equals: true } } }) { sku } }

# errors: an unknown field
# error: has no field
{ Customer { id nope } }

# errors: an unknown root
# error: Query
{ Nope { id } }

# errors: an enum value the type does not have
# error: PLATINUM
{ Customer(where: { tier: { equals: PLATINUM } }) { id } }

# errors: a negative limit
# error: limit
{ Customer(limit: -1) { id } }

# errors: a missing non-null variable
# error: k
query Q($k: Int!) { Customer { idTimes(k: $k) } }

# errors: a fragment on the base's own type at a hierarchy's position
# error: PaymentInterface
{ Payment { ... on Payment { id } } }
