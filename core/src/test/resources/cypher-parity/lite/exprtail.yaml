# The #Cypher{...}# island's expression tail (docs/CYPHER_STUDY_2026_10_15.md §12.73): UNION (distinct) over nodes
# and relationships by the identities their values carry; % of floats; a SKIP or LIMIT the database computes, once;
# two paths compared by their elements' identities; range(...) of a computed step or a bound that may be null;
# toString of a list, a map, a node, a relationship or a path, Neo4j's text built by the database.
# Each case is judged by Neo4j's answer in neo4j-answers.jsonl (tools/neo4j-oracle/snap.sh --write --only
# 'lite/exprtail/*'), keyed lite/exprtail/<id>.
tests:
  - id: union_over_nodes
    graph: |
      CREATE (:A {name: 'a1'}), (:A {name: 'a1'}), (:B {name: 'b1'})
    cypher: "MATCH (a:A) RETURN a.name AS n, a AS x UNION MATCH (b:B) RETURN b.name AS n, b AS x UNION MATCH (a:A) RETURN a.name AS n, a AS x"
  - id: union_over_relationships
    graph: |
      CREATE (a:A {name: 'a1'}), (a)-[:T]->(:B {name: 'b1'}), (a)-[:T]->(:B {name: 'b2'})
    cypher: "MATCH (:A)-[r:T]->(:B) RETURN r UNION MATCH (:A)-[r:T]->(:B) RETURN r"
  - id: float_remainders
    graph: |
      CREATE (:A {x: 7.5, y: 2})
    cypher: "MATCH (a:A) RETURN a.x % a.y AS m, a.x % 2.0 AS f, -7.5 % 2 AS n, 7 % 2.5 AS i"
  # (exact as Java's %, on every lane: where the quotient is near an integer, huge or tiny, and a zero's sign)
  - id: float_remainders_exact
    graph: |
      CREATE (:A {x: 0.3, y: 0.1}), (:A {x: 1.0e300, y: 3.0}), (:A {x: -4.0, y: 2.0}),
             (:A {x: 1.7976931348623157e308, y: 2.2250738585072014e-308}), (:A {x: 4.9e-324, y: 3.0}),
             (:A {x: 123456789.125, y: 0.001}), (:A {x: -1.0e-300, y: 7.0e-301}), (:A {x: 2.5, y: 0.0})
    cypher: "MATCH (a:A) RETURN a.x AS x, a.y AS y, a.x % a.y AS r, (a.x % a.y) % 0.25 AS nested ORDER BY x"
  # (by zero, Java's: NaN for a Float divisor or a spelled zero; an Integer zero of the row is Neo4j's error)
  - id: float_remainders_by_zero
    graph: |
      CREATE (:A {x: 2.5, z: 0.0, i: 0})
    cypher: "MATCH (a:A) RETURN a.x % a.z AS f, 5 % a.z AS g, 2.5 % 0 AS h, a.x % 0.0 AS k, a.x % -0.0 AS n"
  - id: a_float_remainder_by_an_integer_zero_of_the_row
    graph: |
      CREATE (:A {x: 2.5, i: 0})
    cypher: "MATCH (a:A) RETURN a.x % a.i AS e"
  - id: a_computed_skip
    graph: |
      UNWIND range(1, 5) AS i CREATE (:A {v: i})
    cypher: "MATCH (a:A) RETURN a.v AS v ORDER BY v SKIP toInteger(1 + 1)"
  - id: a_computed_limit
    graph: |
      UNWIND range(1, 5) AS i CREATE (:A {v: i})
    cypher: "MATCH (a:A) RETURN a.v AS v ORDER BY v DESC LIMIT size([1, 2, 3])"
  - id: a_computed_skip_and_limit
    graph: |
      UNWIND range(1, 5) AS i CREATE (:A {v: i})
    cypher: "MATCH (a:A) WITH a ORDER BY a.v SKIP 1 LIMIT toInteger(ceil(1.5)) RETURN a.v AS v"
  - id: a_negative_computed_limit
    graph: |
      UNWIND range(1, 5) AS i CREATE (:A {v: i})
    cypher: "MATCH (a:A) RETURN a.v AS v LIMIT toInteger(1 - 3)"
  - id: paths_equal_by_elements
    graph: |
      CREATE (a:A {name: 'a'})-[:T]->(b:B {name: 'b'}), (a)-[:T]->(:B {name: 'c'})
    cypher: "MATCH p = (:A)-[:T]->(x) MATCH q = (:A)-[:T]->(y) RETURN x.name AS x, y.name AS y, p = q AS same, p <> q AS differ ORDER BY x, y"
  - id: a_path_against_a_node
    graph: |
      CREATE (a:A {name: 'a'})-[:T]->(:B {name: 'b'})
    cypher: "MATCH p = (a:A)-[:T]->() RETURN p = a AS same"
  - id: range_of_a_computed_step
    graph: |
      CREATE (:A)
    cypher: "UNWIND [-2, -1, 1, 3] AS step RETURN step, range(0, 4, step) AS l, range(4, 0, step) AS r ORDER BY step"
  - id: range_of_a_null_bound
    graph: |
      CREATE (:A {v: 1}), (:A {w: 2})
    cypher: "MATCH (a:A) RETURN range(a.v, 3) AS l"
  - id: range_of_a_bound_that_may_be_null
    graph: |
      CREATE (:A {v: 1}), (:A {v: 2, w: 2})
    cypher: "MATCH (a:A) RETURN a.v AS v, range(a.v, 3) AS l ORDER BY v"
  - id: to_string_of_a_list
    graph: |
      CREATE (:A {v: 1})
    cypher: "RETURN toString([1, 'a', null, true, 1.5, [2]]) AS l, toString([]) AS e"
  - id: to_string_of_a_map
    graph: |
      CREATE (:A {v: 1})
    cypher: "RETURN toString({a: 1, b: 'x', c: [1, 2], d: {e: null}}) AS m, toString({}) AS e"
  - id: to_string_of_a_node
    graph: |
      CREATE (:A {name: 'a', v: 2})
    cypher: "MATCH (n:A) RETURN toString(n) AS n"
  - id: to_string_of_a_relationship_and_a_path
    graph: |
      CREATE (:A {name: 'a'})-[:T]->(:B {name: 'b'})
    cypher: "MATCH p = (a:A)-[r:T]->(b) RETURN toString(r) AS r, toString(p) AS p, toString(a) AS a"
