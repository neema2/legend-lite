# The #Cypher{...}# island's temporal cases (docs/CYPHER_STUDY_2026_10_15.md §12.6-§12.10): a date is Pure's
# StrictDate, a localdatetime Pure's DateTime (the database's DATE and TIMESTAMP, to the microsecond), a localtime
# Pure's StrictTime (the database's TIME), a datetime its instant with the zone carried beside, a duration an
# instance of the model's Duration class, a zoned time of day its instant on the epoch day with the offset beside;
# a value of nanosecond precision (§12.12) is DuckDB's TIMESTAMP_NS, refused by name on Postgres (the nanos_* cases).
# Each case is judged by Neo4j's answer in neo4j-answers.jsonl (tools/neo4j-oracle/snap.sh --write --only 'lite/temporal/*' snaps them), keyed
# lite/temporal/<id>.
tests:
  - id: date_from_components
    cypher: "RETURN date({year: 1984, month: 10, day: 11}) AS a, date({year: 1984, month: 10}) AS b, date({year: 1984}) AS c, date({year: 1984, week: 10, dayOfWeek: 3}) AS d, date({year: 1816, week: 1}) AS e, date({year: 1816, week: 52}) AS f, date({year: 1984, quarter: 3, dayOfQuarter: 45}) AS g, date({year: 1984, ordinalDay: 202}) AS h, date({year: 2015, week: 53}) AS i"
  - id: date_from_text
    cypher: "RETURN date('1984-10-11') AS a, date('2015-07-21') < date('2015-07-22') AS b, date('1984-10-11') = date({year: 1984, month: 10, day: 11}) AS c"
  - id: localdatetime_from_components
    cypher: "RETURN localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14}) AS a, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS b, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, microsecond: 645876}) AS c, localdatetime({year: 1984, week: 10, dayOfWeek: 3, hour: 12, minute: 31, second: 14, millisecond: 645}) AS d, localdatetime({year: 1912}) AS e, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, nanosecond: 645000, millisecond: 1}) AS f"
  - id: localdatetime_from_text
    cypher: "RETURN localdatetime('2015-07-21T21:40:32.142') AS a, localdatetime('2015-07-21T21:40:32') AS b, localdatetime('2015-07-21T21:40') AS c, localdatetime('2015-07-21T21:40:32.142000') AS d"
  - id: temporal_selection
    cypher: "WITH date({year: 1984, month: 10, day: 11}) AS d, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS dt RETURN date(d) AS a, date({date: d}) AS b, date(dt) AS c, date({date: dt, day: 28}) AS e, localdatetime({date: d, hour: 10, minute: 10, second: 10}) AS f, localdatetime({date: d, day: 28, hour: 10, minute: 10, second: 10}) AS g, localdatetime(dt) AS h, localdatetime({datetime: dt}) AS i, localdatetime({datetime: dt, year: 2000, minute: 5}) AS j, date({date: d, year: 1990, month: 2}) AS k"
  - id: temporal_fields
    cypher: "WITH date({year: 1984, month: 10, day: 11}) AS d, localdatetime({year: 1984, month: 11, day: 11, hour: 12, minute: 31, second: 14}) AS dt, date({year: 1984, month: 1, day: 1}) AS ny RETURN d.year, d.quarter, d.month, d.week, d.weekYear, d.day, d.ordinalDay, d.weekDay, d.dayOfQuarter, dt.year, dt.quarter, dt.month, dt.week, dt.weekYear, dt.day, dt.ordinalDay, dt.weekDay, dt.dayOfQuarter, dt.hour, dt.minute, dt.second, ny.year, ny.weekYear, ny.week, ny.weekDay"
  - id: temporal_comparison_and_text
    cypher: "WITH date({year: 1980, month: 12, day: 24}) AS x, date({year: 1984, month: 10, day: 11}) AS d, localdatetime({year: 1980, month: 12, day: 11, hour: 12, minute: 31, second: 14}) AS lx, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS ld RETURN x > d, x < d, x >= d, x <= d, x = d, d = d, lx > ld, lx < ld, ld = ld, toString(d) AS t, date(toString(d)) = d AS back"
  - id: date_truncate
    cypher: "WITH date({year: 2017, month: 10, day: 11}) AS d, localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS dt RETURN date.truncate('millennium', d) AS a, date.truncate('millennium', d, {day: 2}) AS b, date.truncate('century', d) AS c, date.truncate('decade', d) AS e, date.truncate('year', d) AS f, date.truncate('weekYear', d) AS g, date.truncate('weekYear', d, {day: 5}) AS h, date.truncate('quarter', d) AS i, date.truncate('month', d) AS j, date.truncate('month', d, {day: 2}) AS k, date.truncate('week', d) AS l, date.truncate('week', d, {day: 2}) AS m, date.truncate('day', d) AS n, date.truncate('day', dt) AS o, date.truncate('year', dt, {month: 2}) AS p, date.truncate('weekYear', date({year: 2017, month: 1, day: 1})) AS q"
  - id: localdatetime_truncate
    cypher: "WITH localdatetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS dt, date({year: 2017, month: 10, day: 11}) AS d RETURN localdatetime.truncate('millennium', dt) AS a, localdatetime.truncate('year', dt, {month: 3}) AS b, localdatetime.truncate('month', dt, {day: 2, hour: 5}) AS c, localdatetime.truncate('week', dt) AS e, localdatetime.truncate('day', dt, {hour: 10, minute: 20}) AS f, localdatetime.truncate('hour', dt) AS g, localdatetime.truncate('hour', dt, {minute: 7}) AS h, localdatetime.truncate('minute', dt) AS i, localdatetime.truncate('second', dt) AS j, localdatetime.truncate('day', d) AS k, localdatetime.truncate('month', d, {day: 2}) AS l"
  - id: temporal_null_propagation
    cypher: "RETURN date(null) AS a, localdatetime(null) AS b, date({year: 1984, month: 1, day: 1}).year + 1 AS e"
  - id: truncate_of_a_written_null_is_neo4js_error
    cypher: "RETURN date.truncate('year', null) AS d"
  - id: stored_dates
    graph: |
      CREATE (:Val {name: 'a', d: date('1984-10-11'), dt: localdatetime('1984-10-11T12:31:14.645')}),
             (:Val {name: 'b', d: date('2015-06-24'), dt: localdatetime('2016-07-21T21:45:22.142')})
    cypher: "MATCH (v:Val) RETURN v.name AS name, v.d AS d, v.d.year AS y, v.dt AS dt, v.dt.month AS m, v.d < date('2000-01-01') AS early, date.truncate('month', v.dt) AS t ORDER BY name"
  - id: datetime_from_a_date_alone
    cypher: "RETURN datetime({year: 1984, month: 10, day: 11}) AS a"
  - id: duration_from_components
    cypher: "RETURN duration({days: 14, hours: 16, minutes: 12}) AS a, duration({years: 12, months: 5, days: 14, hours: 16, minutes: 12, seconds: 70}) AS b, duration({days: 14, seconds: 70, milliseconds: 1}) AS c, duration({days: 14, seconds: 70, microseconds: 1}) AS d, duration({seconds: 1, nanoseconds: -1000}) AS e, duration({months: -1, days: 2}) AS f, duration({weeks: 2, days: 1}) AS g"
  - id: duration_from_text
    cypher: "RETURN duration('P14DT16H12M') AS a, duration('P12Y5M14DT16H12M70S') AS b, duration('PT1M10.001S') AS c, duration('-P1D') AS d, duration('P-1M2DT-3H') AS e, duration('PT-0.5S') AS f"
  - id: duration_fields
    cypher: "WITH duration({years: 1, months: 4, days: 10, hours: 1, minutes: 1, seconds: 1, nanoseconds: 111111000}) AS d RETURN d.years, d.quarters, d.months, d.weeks, d.days, d.hours, d.minutes, d.seconds, d.milliseconds, d.microseconds, d.nanoseconds, d.quartersOfYear, d.monthsOfQuarter, d.monthsOfYear, d.daysOfWeek, d.minutesOfHour, d.secondsOfMinute, d.millisecondsOfSecond, d.microsecondsOfSecond, d.nanosecondsOfSecond"
  - id: duration_arithmetic
    cypher: "WITH duration({months: 1, days: -14, hours: 16, minutes: -12, seconds: 70}) AS dur, date('1984-10-11') AS d, localdatetime('1984-10-11T12:31:14.645') AS ldt, localtime('12:31:14.645') AS t, datetime('1984-10-11T12:31:14.645+01:00') AS zd RETURN d + dur AS a, d - dur AS b, ldt + dur AS c, ldt - dur AS e, t + dur AS f, t - dur AS g, zd + dur AS h, zd - dur AS i, dur + dur AS j, dur - duration({days: 1}) AS k, dur * 2 AS l, 3 * dur AS m"
  - id: duration_between
    cypher: "WITH date('1984-10-11') AS d1, date('2015-06-24') AS d2, localdatetime('2016-07-21T21:45:22.142') AS ldt, localdatetime('2018-01-01T12:00') AS x, localdatetime('2018-01-02T10:00') AS y, localdatetime('2018-01-01T10:00:00.2') AS p, localdatetime('2018-01-02T10:00:00.1') AS q RETURN duration.between(d1, d2) AS a, duration.between(d1, ldt) AS b, duration.between(d2, d1) AS c, duration.between(x, y) AS e, duration.between(y, x) AS f, duration.between(p, q) AS g, duration.between(q, p) AS h, duration.inMonths(d1, d2) AS i, duration.inDays(d1, d2) AS j, duration.inSeconds(x, y) AS k, duration.between(localtime('14:30'), localtime('16:45')) AS l, duration.between(datetime('2017-10-28T23:00+02:00'), datetime('2017-10-29T04:00+01:00')) AS m"
  - id: duration_equality
    cypher: "WITH duration({years: 12, months: 5, days: 14, hours: 16, minutes: 12, seconds: 70}) AS x RETURN x = duration('P12Y5M14DT16H13M10S') AS a, x = duration({days: 1}) AS b, x = date('1984-10-11') AS c, x <> duration({days: 1}) AS d"
  - id: duration_null_propagation
    cypher: "RETURN duration(null) AS a, date('1984-10-11') + duration(null) AS b, duration(null) = duration({days: 1}) AS c"
  - id: stored_dates_with_durations
    graph: |
      CREATE (:Val {name: 'a', d: date('1984-10-11')}),
             (:Val {name: 'b', d: date('2015-06-24')})
    cypher: "MATCH (v:Val) RETURN v.name AS name, v.d + duration({months: 1}) AS m, duration.between(v.d, date('2020-01-01')).months AS mo, duration.between(v.d, date('2020-01-01')) AS dur ORDER BY name"
  - id: duration_fraction_cascades
    cypher: "RETURN duration({days: 1.5}) AS d"
  - id: duration_of_a_date_is_neo4js_error
    cypher: "RETURN duration(date('1984-10-11')) AS d"
  - id: duration_unknown_field_is_neo4js_error
    cypher: "RETURN duration({foo: 1}) AS d"
  - id: duration_bad_text_is_neo4js_error
    cypher: "RETURN duration('nope') AS d"
  - id: duration_order_refused_by_name
    cypher: "RETURN duration({days: 1}) < duration({days: 2}) AS lt"
  - id: duration_to_string
    cypher: "RETURN toString(duration({days: 1})) AS s"
  - id: duration_date_time_text_form
    cypher: "RETURN duration('P2012-02-02T14:37:21.545') AS d"
  - id: duration_divided
    cypher: "RETURN duration({days: 3}) / 2 AS d"
  - id: time_from_text
    cypher: "RETURN time('12:31:14+01:00') AS a, time('21:40:32.142+0100') AS b, time('214032.142Z') AS c, time('214032-0100') AS d, time('21:40-01:30') AS e, time('2140-00:00') AS f, time('2140-02') AS g, time('22+18:00') AS h, time('12:31:14.645876') AS i, time('00:30+01:00') AS j, time('23:30-01:00') AS k"
  - id: datetime_from_components
    cypher: "RETURN datetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, millisecond: 645}) AS a, datetime({year: 1984, month: 10, day: 11, hour: 12, minute: 31, second: 14, timezone: '+01:00'}) AS b, datetime({year: 1984, month: 10, day: 11, hour: 12, timezone: '-01:30'}) AS c, datetime({year: 1984, week: 10, dayOfWeek: 3, hour: 12, minute: 31, timezone: '+01:00'}) AS d, datetime({year: 1984, month: 10, day: 11, timezone: 'Europe/Stockholm'}) AS e, datetime({year: 1984, month: 7, day: 11, hour: 12, timezone: 'Europe/Stockholm'}) AS f, datetime({year: 1984, month: 10, day: 11, hour: 12, minute: 34, second: 56, timezone: '+02:05:59'}) AS g"
  - id: datetime_from_text
    cypher: "RETURN datetime('1984-10-11T12:31:14.645Z') AS a, datetime('1984-10-11T12:31:14+01:00') AS b, datetime('1984-10-11T12:31:14.645876+0100') AS c, datetime('1984-10-11T12:31-01:30') AS d, datetime('1984-10-11T12:31:14') AS e, datetime('2015-07-21T21:40:32.142+01:00') AS f"
  - id: datetime_selection
    cypher: "WITH localdatetime('1984-10-11T12:31:14.645') AS ldt, datetime('1984-10-11T12:31:14.645+01:00') AS zd, date('1984-10-11') AS d, localtime('12:31:14.645') AS t RETURN datetime(ldt) AS a, datetime({datetime: ldt}) AS b, datetime({datetime: ldt, timezone: '+05:00'}) AS c, datetime({datetime: ldt, day: 28, second: 42}) AS e, datetime(zd) AS f, datetime({datetime: zd}) AS g, datetime({datetime: zd, timezone: '+05:00'}) AS h, datetime({datetime: zd, day: 28, second: 42}) AS i, datetime({date: d, time: t}) AS j, datetime({date: d, time: t, timezone: '+05:00'}) AS k, datetime({date: d, hour: 10, timezone: 'Europe/Stockholm'}) AS l, datetime({datetime: zd, timezone: 'Europe/Stockholm'}) AS m"
  - id: datetime_to_local
    cypher: "WITH datetime('1984-10-11T12:31:14.645+01:00') AS zd, datetime({year: 1984, month: 7, day: 11, hour: 12, timezone: 'Europe/Stockholm'}) AS nz RETURN localdatetime(zd) AS a, date(zd) AS b, localtime(zd) AS c, localdatetime({datetime: zd, year: 2000}) AS d, localdatetime(nz) AS e, date({date: zd}) AS f, localtime({time: zd}) AS g"
  - id: datetime_fields
    cypher: "WITH datetime({year: 1984, month: 11, day: 11, hour: 12, minute: 31, second: 14, microsecond: 645876, timezone: '+01:00'}) AS d, datetime({year: 1984, month: 11, day: 11, hour: 12, minute: 31, second: 14, timezone: 'Europe/Stockholm'}) AS n RETURN d.year, d.quarter, d.month, d.week, d.weekYear, d.day, d.ordinalDay, d.weekDay, d.dayOfQuarter, d.hour, d.minute, d.second, d.millisecond, d.microsecond, d.nanosecond, d.timezone, d.offset, d.offsetMinutes, d.offsetSeconds, d.epochSeconds, d.epochMillis, n.hour, n.timezone, n.offsetMinutes, n.epochSeconds"
  - id: datetime_comparison
    cypher: "WITH datetime('1984-10-11T12:31:14+01:00') AS a, datetime('1984-10-11T12:31:14Z') AS b, datetime('1984-10-11T11:31:14Z') AS c RETURN a < b, a > b, a = c, a <> b, a <= c, b >= a"
  - id: datetime_truncate
    cypher: "WITH datetime('2017-10-11T12:31:14.645876+01:00') AS zd, localdatetime('2017-10-11T12:31:14.645876') AS ldt, date('2017-10-11') AS d RETURN datetime.truncate('millennium', zd) AS a, datetime.truncate('millennium', zd, {day: 2}) AS b, datetime.truncate('year', ldt) AS c, datetime.truncate('month', d) AS e, datetime.truncate('day', zd, {timezone: 'Europe/Stockholm'}) AS f, datetime.truncate('hour', zd) AS g, datetime.truncate('minute', zd, {second: 5}) AS h, datetime.truncate('week', zd, {dayOfWeek: 2}) AS i, datetime.truncate('day', ldt, {timezone: '+05:00'}) AS j"
  - id: datetime_epoch
    cypher: "RETURN datetime.fromepoch(416779, 999999000) AS a, datetime.fromepochmillis(237821673987) AS b, datetime({year: 1970, month: 1, day: 1, timezone: '+01:00'}).epochSeconds AS c"
  - id: datetime_null_propagation
    cypher: "RETURN datetime(null) AS a, datetime('1984-10-11T12:31:14Z') = null AS b"
  - id: datetime_ordering
    cypher: "UNWIND [datetime('1984-10-11T12:31:14+01:00'), datetime('1984-10-11T12:31:14Z'), datetime('1984-10-11T10:00:00-02:00')] AS d RETURN d ORDER BY d"
  - id: stored_datetimes_zoned
    graph: |
      CREATE (:Val {name: 'a', dt: localdatetime('1984-10-11T12:31:14.645')}),
             (:Val {name: 'b', dt: localdatetime('2016-07-21T21:45:22.142')})
    cypher: "MATCH (v:Val) RETURN v.name AS name, datetime(v.dt) AS z, datetime({datetime: v.dt, timezone: '+02:00'}) AS z2, datetime({datetime: v.dt, timezone: '+02:00'}).hour AS h, datetime({datetime: v.dt, timezone: 'Europe/Stockholm'}).offsetMinutes AS om ORDER BY name"
  - id: datetime_of_a_date_is_neo4js_error
    cypher: "RETURN datetime(date('1984-10-11')) AS d"
  - id: datetime_of_a_localtime_is_neo4js_error
    cypher: "RETURN datetime(localtime('12:00')) AS d"
  - id: datetime_component_offset_without_colon_is_neo4js_error
    cypher: "RETURN datetime({year: 1984, month: 10, day: 11, timezone: '+0100'}) AS d"
  - id: datetime_bad_zone_is_neo4js_error
    cypher: "RETURN datetime({year: 1984, timezone: 'Mars/Olympus'}) AS d"
  - id: datetime_zone_field_of_a_local_is_neo4js_error
    cypher: "RETURN localdatetime('1984-10-11T12:00').timezone AS z"
  - id: localdatetime_with_timezone_component
    cypher: "RETURN localdatetime({year: 1984, month: 1, day: 1, timezone: '+01:00'}) AS d"
  - id: datetime_text_named_zone
    cypher: "RETURN datetime('1984-10-11T12:31:14+01:00[Europe/Stockholm]') AS d"
  - id: datetime_to_string
    cypher: "RETURN toString(datetime('1984-10-11T12:31:14Z')) AS s"
  - id: localtime_from_text
    cypher: "RETURN localtime('12:31:14.645') AS a, localtime('12:31:14') AS b, localtime('12:31') AS c, localtime('12:31:14.645876') AS d, localtime('12:31:14.645000') AS e"
  - id: localtime_from_components
    cypher: "RETURN localtime({hour: 12, minute: 31, second: 14}) AS a, localtime({hour: 12, minute: 31, second: 14, millisecond: 645}) AS b, localtime({hour: 12, minute: 31, second: 14, microsecond: 645876}) AS c, localtime({hour: 12}) AS d, localtime({hour: 12, minute: 31}) AS e, localtime({hour: 12, minute: 31, second: 14, nanosecond: 645000, millisecond: 1}) AS f"
  - id: localtime_selection
    cypher: "WITH localtime('12:31:14.645876') AS t, localdatetime('1984-10-11T12:31:14.645') AS dt RETURN localtime(t) AS a, localtime({time: t}) AS b, localtime(dt) AS c, localtime({time: dt}) AS d, localtime({time: t, second: 42}) AS e, localtime({time: t, hour: 5, millisecond: 1}) AS f, localdatetime({date: date('1984-10-11'), time: t}) AS g, localdatetime({date: date('1984-10-11'), time: t, second: 5}) AS h, localdatetime({date: dt, time: t}) AS i"
  - id: localtime_fields
    cypher: "WITH localtime('12:31:14.645876') AS t, localdatetime('1984-10-11T12:31:14.645876') AS dt RETURN t.hour, t.minute, t.second, t.millisecond, t.microsecond, t.nanosecond, dt.millisecond, dt.microsecond, dt.nanosecond"
  - id: localtime_comparison
    cypher: "WITH localtime('12:31:14.645') AS a, localtime('12:31:15') AS b RETURN a < b, a > b, a <= b, a >= b, a = b, a = localtime('12:31:14.645') AS same, a <> b"
  - id: localtime_truncate
    cypher: "WITH localtime('12:31:14.645876') AS t, localdatetime('1984-10-11T12:31:14.645876') AS dt RETURN localtime.truncate('day', t) AS a, localtime.truncate('hour', t) AS b, localtime.truncate('minute', t) AS c, localtime.truncate('second', t) AS d, localtime.truncate('hour', t, {minute: 7}) AS e, localtime.truncate('minute', dt) AS f, localtime.truncate('second', t, {hour: 2}) AS g"
  - id: localtime_null_propagation
    cypher: "RETURN localtime(null) AS a, localtime('12:00') = null AS b"
  - id: localtime_of_a_null_time_component_is_neo4js_error
    cypher: "RETURN localtime({time: null}) AS c"
  - id: localtime_ordering
    cypher: "UNWIND [localtime('12:31:15'), localtime('01:00'), localtime('12:31:14.645')] AS t RETURN t ORDER BY t"
  - id: stored_datetimes_times
    graph: |
      CREATE (:Val {name: 'a', dt: localdatetime('1984-10-11T12:31:14.645')}),
             (:Val {name: 'b', dt: localdatetime('2016-07-21T21:45:22.142')})
    cypher: "MATCH (v:Val) RETURN v.name AS name, localtime(v.dt) AS t, localtime(v.dt).hour AS h, localtime(v.dt) < localtime('13:00') AS early, localtime.truncate('hour', v.dt) AS th ORDER BY name"
  - id: localtime_of_a_date_is_neo4js_error
    cypher: "RETURN localtime(date('1984-10-11')) AS t"
  - id: localtime_date_field_is_neo4js_error
    cypher: "RETURN localtime('12:00').year AS y"
  - id: localtime_without_hour_is_neo4js_error
    cypher: "RETURN localtime({minute: 5}) AS t"
  - id: localtime_truncate_to_month_is_neo4js_error
    cypher: "RETURN localtime.truncate('month', localtime('12:00')) AS t"
  - id: localtime_with_date_component
    cypher: "RETURN localtime({date: date('1984-10-11'), hour: 5}) AS t"
  - id: date_with_time_component
    cypher: "RETURN date({date: date('1984-10-11'), time: localtime('12:00')}) AS d"
  - id: localdatetime_from_time_only
    cypher: "RETURN localdatetime({time: localtime('12:00')}) AS t"
  - id: localtime_compact_text
    cypher: "RETURN localtime('123114') AS t"
  - id: localtime_to_string
    cypher: "RETURN toString(localtime('12:31')) AS s"
  - id: localtime_list
    cypher: "RETURN [localtime('12:31'), localtime('13:00')] AS l"
  - id: temporal_errors_are_cyphers
    cypher: "RETURN date({year: 1984, month: 13, day: 1}) AS a"
  - id: date_from_compact_and_partial_text
    cypher: "RETURN date('20150721') AS a, date('2015-07') AS b, date('201507') AS c, date('2015') AS d, date('2015-W30-2') AS e, date('2015W302') AS f, date('2015-W30') AS g, date('2015W30') AS h, date('2015-202') AS i, date('2015202') AS j, date('2015-Q2-60') AS k, date('2015Q260') AS l, date('2015-Q2') AS m, date('2015Q2') AS n"
  - id: date_text_week_53_and_leap_ordinal
    cypher: "RETURN date('2015-W53-5') AS a, date('2016-366') AS b, date('2016-W52-7') AS c, date('2017-W01-1') AS d, date('2015-W53-5').week AS w, date('2015-W53-5').weekYear AS wy"
  - id: date_text_month_13_is_neo4js_error
    cypher: "RETURN date('2015-13') AS d"
  - id: date_junk_text_is_neo4js_error
    cypher: "RETURN date('yesterday') AS d"
  - id: localtime_from_compact_text
    cypher: "RETURN localtime('214032.142') AS a, localtime('214032') AS b, localtime('2140') AS c, localtime('21') AS d, localtime('21:40:32.142876') AS e, localtime('123114') AS f"
  - id: localtime_from_text_with_a_comma_fraction
    cypher: "RETURN localtime('21:40:32,142') AS a"
  - id: localtime_bad_text_is_neo4js_error
    cypher: "RETURN localtime('25:00') AS t"
  - id: localdatetime_from_compact_text
