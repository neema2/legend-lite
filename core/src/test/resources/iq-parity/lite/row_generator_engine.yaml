# sa_rowgenerator anywhere in a statement (the IQ scale program, 2026-10-26; the Mac's seven probes on IQ 17.1): the
# whole statement runs in SQL Anywhere's front end beside IQ's tables -- its INTEGER sum overflows (-158) where IQ's
# engine widens, its DATEADD of a DATE is a TIMESTAMP where IQ's engine keeps the DATE -- the generator in the FROM or
# only in a WHERE's IN subquery alike; the same statements without it are IQ's engine's. Judged by the live IQ.
tests:
  - id: generator_in_from_overflows_on_the_front_end
    sql: "SELECT t.id, t.it + 2147483647 AS x FROM t, sa_rowgenerator(1, 1) g WHERE t.id = 7"
    profile: iq17-default
  - id: without_a_generator_iqs_engine_widens
    sql: "SELECT t.id, t.it + 2147483647 AS x FROM t WHERE t.id = 7"
    profile: iq17-default
  - id: generator_in_an_in_subquery_overflows_on_the_front_end
    sql: "SELECT t.id, t.it + 2147483647 AS x FROM t WHERE t.id IN (SELECT row_num + 6 FROM sa_rowgenerator(1, 1)) ORDER BY t.id"
    profile: iq17-default
  - id: generator_in_from_dateadd_is_a_timestamp
    sql: "SELECT t.id, DATEADD(DAY, 1, t.dt) AS d FROM t, sa_rowgenerator(1, 1) g WHERE t.id < 3 ORDER BY t.id"
    profile: iq17-default
  - id: without_a_generator_dateadd_is_a_date
    sql: "SELECT t.id, DATEADD(DAY, 1, t.dt) AS d FROM t WHERE t.id < 3 ORDER BY t.id"
    profile: iq17-default
  - id: generator_in_an_in_subquery_dateadd_is_a_timestamp
    sql: "SELECT t.id, DATEADD(DAY, 1, t.dt) AS d FROM t WHERE t.id IN (SELECT row_num FROM sa_rowgenerator(1, 2)) ORDER BY t.id"
    profile: iq17-default
