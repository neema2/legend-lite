# The IQ scale program's Q30 (docs/IQ_SCALE_PROGRAM_2026_10_22.md, 2026-10-24): whether IQ computes an operand that
# raises (a division by zero) beside an operand that is NULL. lite's translator guards a strict operation's operands
# and may skip one where another is NULL; Postgres raises there (a strict operator reads its arguments). Row 3 of t
# holds zeros (sm, it, bg = 0), row 5 NULLs. Each is judged by its oracle's answer in iq-answers.jsonl: SQL Anywhere 17
# for iq16-default, the live IQ 17.1 for its iq17-default twin. tools/iq-oracle's README.md has the keys.
tests:

  # ---- under IQ's engine (a query over t)
  - id: a_null_constant_beside_a_zero_divisor
    sql: "SELECT id, CAST(NULL AS INTEGER) + it / sm AS v FROM t WHERE id = 3"
  - id: a_computed_null_beside_a_zero_divisor
    sql: "SELECT id, NULLIF(sm, 0) + it / sm AS v FROM t WHERE id = 3"
  - id: a_zero_divisor_beside_a_computed_null
    sql: "SELECT id, it / sm + NULLIF(sm, 0) AS v FROM t WHERE id = 3"
  - id: a_computed_null_times_a_zero_divisor
    sql: "SELECT id, NULLIF(it, 0) * (bg / sm) AS v FROM t WHERE id = 3"
  - id: a_null_quotient_beside_a_zero_divisor
    sql: "SELECT id, nm / NULLIF(sm, 0) + (it + bg + id) / sm AS v FROM t WHERE id = 3"
  - id: a_null_column_beside_a_zero_divisor
    sql: "SELECT a.id, a.it + b.it / b.sm AS v FROM t a, t b WHERE a.id = 5 AND b.id = 3"
  - id: a_function_of_a_null_beside_a_zero_divisor
    sql: "SELECT id, ABS(NULLIF(sm, 0)) + it / sm AS v FROM t WHERE id = 3"
  - id: a_null_beside_a_zero_divisor_in_a_condition
    sql: "SELECT id FROM t WHERE id = 3 AND NULLIF(sm, 0) + it / sm > 0"

  # ---- in SQL Anywhere's front end (no table)
  - id: a_computed_null_beside_a_zero_divisor_without_from
    sql: "SELECT NULLIF(0, 0) + 1 / (SELECT 0) AS v"
