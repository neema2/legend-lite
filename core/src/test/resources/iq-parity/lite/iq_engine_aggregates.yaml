# SUM and AVG under IQ's engine (IQ island, 2026-10-15; the research's D-N1, measured on IQ 17.1, the live server): SUM
# of a NUMERIC(p,s) is a NUMERIC(p+1,s), the exact sum; AVG of an integer (SMALLINT, INTEGER, BIGINT, BIT) a NUMERIC of
# scale 16, of a NUMERIC(p,s) one of scale s+21, SUM / COUNT cut toward zero at that scale wherever it is read. SQL
# Anywhere's front end types and rounds AVG otherwise, so the AVG cases are judged by the live IQ only (iq17-default);
# the SUM cases by both. Every case is deterministic: a total ORDER BY, or a single row.
tests:

  # ---- SUM of a NUMERIC: NUMERIC(p+1,s)
  - id: sum_of_a_numeric_5_1
    sql: "SELECT SUM(qty) AS s FROM u"
  - id: sum_of_a_numeric_10_2
    sql: "SELECT SUM(nm) AS s FROM t"
  - id: sum_of_a_numeric_grouped
    sql: "SELECT k, SUM(n) AS s FROM g GROUP BY k ORDER BY k"
  - id: sum_of_a_numeric_over_no_rows
    sql: "SELECT SUM(nm) AS s FROM t WHERE id > 100"
  - id: sum_distinct_of_a_numeric
    sql: "SELECT SUM(DISTINCT n) AS s FROM g"
  - id: sum_of_a_numeric_compared_in_having
    sql: "SELECT k, COUNT(*) AS c FROM g WHERE k IS NOT NULL GROUP BY k HAVING SUM(n) > 0 ORDER BY k"
  - id: sum_of_a_numeric_ordered
    sql: "SELECT k, SUM(n) AS s FROM g WHERE k IS NOT NULL GROUP BY k ORDER BY SUM(n), k"
  - id: sum_of_a_numeric_in_a_derived_table
    sql: "SELECT s FROM (SELECT SUM(nm) AS s FROM t) d"
  - id: sum_of_a_numeric_through_a_cte
    sql: "WITH q AS (SELECT t_id, qty FROM u) SELECT t_id, SUM(qty) AS total FROM q GROUP BY t_id ORDER BY t_id"

  # ---- AVG of an integer: scale 16, cut toward zero
  - id: avg_of_an_integer_cut
    sql: "SELECT AVG(v) AS a FROM g WHERE id IN (1, 2, 4)"
    profile: iq17-default
  - id: avg_of_an_integer_negative_cut_toward_zero
    sql: "SELECT AVG(k - 5) AS a FROM g WHERE id < 6"
    profile: iq17-default
  - id: avg_of_integers_grouped
    sql: "SELECT k, AVG(v) AS a, AVG(j) AS b FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: avg_distinct_of_an_integer
    sql: "SELECT AVG(DISTINCT v) AS a FROM g"
    profile: iq17-default
  - id: avg_of_an_integer_over_no_rows
    sql: "SELECT AVG(v) AS a FROM g WHERE id > 100"
    profile: iq17-default
  - id: avg_of_a_smallint
    sql: "SELECT AVG(sm) AS a FROM t"
    profile: iq17-default
  - id: avg_of_an_integer_at_its_largest
    sql: "SELECT AVG(it) AS a, AVG(v) AS b FROM t, g WHERE t.id = 1 AND g.id = 10"
    profile: iq17-default
  - id: avg_of_a_bigint
    sql: "SELECT AVG(w) AS a FROM g"
    profile: iq17-default
  - id: avg_of_bigints_at_their_extremes
    sql: "SELECT AVG(bg) AS a FROM t"
    profile: iq17-default
  - id: avg_of_a_bit
    sql: "SELECT AVG(b) AS a FROM g"
    profile: iq17-default
  - id: avg_of_an_integer_compared_in_having
    sql: "SELECT COUNT(*) AS c FROM g WHERE id IN (1, 2, 4) HAVING AVG(v) = 4.3333333333333333"
    profile: iq17-default
  - id: avg_of_an_integer_ordered
    sql: "SELECT k, AVG(v) AS a FROM g WHERE k IS NOT NULL GROUP BY k ORDER BY AVG(v), k"
    profile: iq17-default

  # ---- AVG of a NUMERIC: scale s+21, cut toward zero
  - id: avg_of_a_numeric_10_2
    sql: "SELECT AVG(nm) AS a FROM t"
    profile: iq17-default
  - id: avg_of_a_numeric_5_1
    sql: "SELECT AVG(qty) AS a FROM u"
    profile: iq17-default
  - id: avg_of_a_numeric_grouped
    sql: "SELECT k, AVG(n) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: avg_of_a_numeric_repeating
    sql: "SELECT AVG(n) AS a FROM g WHERE id IN (8, 11, 2)"
    profile: iq17-default
  - id: avg_of_a_numeric_negative
    sql: "SELECT AVG(n) AS a FROM g WHERE id IN (8, 4, 11)"
    profile: iq17-default
  - id: avg_of_a_numeric_compared_in_having
    sql: "SELECT COUNT(*) AS c FROM g WHERE id IN (8, 11, 2) HAVING AVG(n) = 0.83333333333333333333333"
    profile: iq17-default
  - id: avg_of_a_numeric_over_no_rows
    sql: "SELECT AVG(n) AS a FROM g WHERE id > 100"
    profile: iq17-default

  # ---- IQ island, 2026-10-17 (the TPC-H corpus lane's AVG of a NUMERIC(15,2), IQ's NUMERIC(37,23), measured on IQ
  # 17.1): lite makes the sum whole before it scales it, so each step fits its 38 digits
  - id: avg_of_a_numeric_15_2
    sql: "SELECT AVG(CAST(nm AS NUMERIC(15,2))) AS a, SUM(CAST(nm AS NUMERIC(15,2))) AS s, COUNT(*) AS c FROM t"
    profile: iq17-default
  - id: avg_of_a_numeric_16_2_grouped
    sql: "SELECT k, AVG(CAST(n AS NUMERIC(16,2))) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: avg_of_a_numeric_14_4_repeating
    sql: "SELECT AVG(CAST(n AS NUMERIC(14,4))) AS a FROM g WHERE id IN (8, 11, 2)"
    profile: iq17-default
  - id: avg_of_a_numeric_15_2_negative
    sql: "SELECT AVG(CAST(n AS NUMERIC(15,2))) AS a FROM g WHERE id IN (8, 4, 11)"
    profile: iq17-default
  - id: avg_of_a_numeric_15_2_read_by_arithmetic
    sql: "SELECT AVG(CAST(n AS NUMERIC(15,2))) * 3 AS a FROM g WHERE id IN (8, 11, 2)"
    profile: iq17-default
  # ---- IQ island, 2026-10-17 (the TPC-H and TPC-DS corpus lanes' 900; measured on IQ 17.1): an AVG whose type IQ's
  # engine makes wider than 38 digits (NUMERIC(39,23) of a NUMERIC(17,2)) holds 38 digits of value at most; lite divides
  # in chunks, and refuses at run time a value past them
  - id: avg_of_a_numeric_17_2
    sql: "SELECT AVG(CAST(nm AS NUMERIC(17,2))) AS a FROM t"
    profile: iq17-default
  - id: avg_of_a_numeric_20_2_grouped
    sql: "SELECT k, AVG(CAST(n AS NUMERIC(20,2))) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: avg_of_a_product_of_numerics
    sql: "SELECT AVG(nm * nm) AS a FROM t WHERE id IN (1, 3, 4)"
    profile: iq17-default
  - id: avg_of_an_avg_is_refused_by_name
    sql: "SELECT AVG(a) AS b FROM (SELECT k, AVG(v) AS a FROM g GROUP BY k) d"
    profile: iq17-default
  - id: avg_of_a_numeric_15_2_compared_in_having
    sql: "SELECT k, COUNT(*) AS c FROM g WHERE k IS NOT NULL GROUP BY k HAVING AVG(CAST(n AS NUMERIC(15,2))) > 0.5 ORDER BY k"
    profile: iq17-default

  # ---- IQ island, 2026-10-15 (checklist 2.16, measured on IQ 17.1): PERCENTILE_CONT and PERCENTILE_DISC (WITHIN GROUP);
  # MEDIAN of a NUMERIC (the midpoint cut toward zero at its scale) and of a DOUBLE; STDDEV and VARIANCE refused (IQ's
  # engine computes them by a formula of its own that loses precision: VARIANCE of 1000000.1, .2, .3 is 0.0100 there)
  - id: percentiles
    sql: "SELECT k, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY v) AS a, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY v) AS b, PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY d DESC) AS c, PERCENTILE_DISC(0.75) WITHIN GROUP (ORDER BY n) AS e, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY d DESC) AS f FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: percentiles_at_the_ends
    sql: "SELECT k, PERCENTILE_CONT(0) WITHIN GROUP (ORDER BY v) AS a, PERCENTILE_CONT(1) WITHIN GROUP (ORDER BY n) AS b, PERCENTILE_DISC(1) WITHIN GROUP (ORDER BY v DESC) AS c FROM g WHERE k < 4 GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: median_of_a_numeric
    sql: "SELECT k, MEDIAN(n) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: median_of_a_double
    sql: "SELECT k, MEDIAN(d) AS a FROM g WHERE k < 4 GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: percentile_of_a_string_is_refused
    sql: "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY s) AS a FROM g"
    profile: iq17-default
  - id: percentile_disc_of_a_bigint_is_refused
    sql: "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY w) AS a FROM g"
    profile: iq17-default
  - id: stddev_is_refused
    sql: "SELECT k, STDDEV(v) AS a FROM g WHERE k < 4 GROUP BY k ORDER BY k"
    profile: iq17-default

  # ---- IQ island, 2026-10-15 (checklist 2.16, measured on IQ 17.1): LIST ordered by another column: the key's order,
  # IQ's NULL first ascending, last descending
  # (one LIST a query: two ordered differently are D-A1's, refused)
  - id: list_ordered_by_another_column_descending
    sql: "SELECT k, LIST(s, ',' ORDER BY id DESC) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: list_of_integers_ordered_by_another_column
    sql: "SELECT k, LIST(v ORDER BY id) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: list_ordered_by_a_key_with_nulls
    sql: "SELECT k, LIST(s, '|' ORDER BY d) AS a FROM g WHERE k < 4 GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: list_ordered_by_a_key_with_nulls_descending
    sql: "SELECT k, LIST(s ORDER BY n DESC) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
  - id: list_ordered_by_two_keys_is_refused
    sql: "SELECT k, LIST(s ORDER BY v, id) AS a FROM g GROUP BY k ORDER BY k"
    profile: iq17-default
