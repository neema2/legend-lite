# The IQ scale program's real-life census, its second wave (2026-10-25): joins_matrix, the permutations a report
# writes, over the parity tables, judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: inner_equi_rows
    sql: "SELECT t.id AS tid, u.id AS uid FROM t JOIN u ON u.t_id = t.id ORDER BY tid, uid"
    profile: iq17-default
  - id: inner_equi_grouped
    sql: "SELECT t.id AS tid, COUNT(u.id) AS n, SUM(u.qty) AS q FROM t JOIN u ON u.t_id = t.id GROUP BY t.id ORDER BY tid"
    profile: iq17-default
  - id: inner_equi_windowed
    sql: "SELECT t.id AS tid, u.id AS uid, COUNT(*) OVER (PARTITION BY t.id) AS n FROM t JOIN u ON u.t_id = t.id ORDER BY tid, uid"
    profile: iq17-default
  - id: inner_equi_filtered_rows
    sql: "SELECT t.id AS tid, u.id AS uid FROM t JOIN u ON u.t_id = t.id AND u.qty > 0 ORDER BY tid, uid"
    profile: iq17-default
  - id: inner_equi_filtered_grouped
    sql: "SELECT t.id AS tid, COUNT(u.id) AS n, SUM(u.qty) AS q FROM t JOIN u ON u.t_id = t.id AND u.qty > 0 GROUP BY t.id ORDER BY tid"
    profile: iq17-default
  - id: inner_equi_filtered_windowed
    sql: "SELECT t.id AS tid, u.id AS uid, COUNT(*) OVER (PARTITION BY t.id) AS n FROM t JOIN u ON u.t_id = t.id AND u.qty > 0 ORDER BY tid, uid"
    profile: iq17-default
  - id: inner_non_equi_rows
    sql: "SELECT t.id AS tid, u.id AS uid FROM t JOIN u ON u.t_id >= t.id + 2 ORDER BY tid, uid"
    profile: iq17-default
