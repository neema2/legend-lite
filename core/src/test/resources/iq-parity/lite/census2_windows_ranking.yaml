# The IQ scale program's real-life census, its second wave (2026-10-25): windows_ranking, the permutations a report
# writes, over the parity tables, judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: row_number_v_asc_all
    sql: "SELECT id, ROW_NUMBER() OVER (ORDER BY v, id) AS r FROM g WHERE id < 10 ORDER BY id"
    profile: iq17-default
  - id: row_number_v_asc_by_k
    sql: "SELECT id, ROW_NUMBER() OVER (PARTITION BY k ORDER BY v, id) AS r FROM g WHERE id < 10 ORDER BY id"
    profile: iq17-default
