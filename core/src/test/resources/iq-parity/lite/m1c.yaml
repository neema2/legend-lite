# M1c for the #IQ{...}# island (docs/IQ_SQL_STUDY_2026_10_13.md §9.5): GROUP BY (names, expressions, select-list
# aliases, integer constants), HAVING, SELECT DISTINCT, and the aggregates COUNT, SUM, AVG, MIN, MAX, MEDIAN and LIST
# with SQL Anywhere's result types, over the tables g (keys with duplicates and NULL groups) and o (sums that pass their
# type's largest value on the way). Each is judged by SQL Anywhere 17's answer in iq-answers.jsonl. A case without FROM,
# or over DUMMY or sa_rowgenerator, runs in SQL Anywhere's front end (engine: sa); one over tables in the IQ engine,
# unless its profile is a sqla17 one. No case groups, orders or compares strings (an ASCII-only right trim, not built
# then; IQ island, 2026-10-14: count_distinct_of_strings answers by IQ's collation since the merge, lite/collation.yaml
# has the rest), nor reads the CHAR(3) column c under the IQ engine (its padding is the research's D-S1).
# tools/iq-oracle's README.md has the keys.
tests:

  # ---- COUNT: *, a value, DISTINCT; INTEGER in SQL Anywhere's front end, UNSIGNED BIGINT under the IQ engine (D-F15)
  - id: count_star_value_and_distinct
    sql: "SELECT COUNT(*), COUNT(v), COUNT(DISTINCT v), COUNT(j) FROM g"
  - id: count_of_strings_counts_their_values
    sql: "SELECT COUNT(s), COUNT(vc) FROM g, t WHERE g.id = t.id"
  - id: count_with_empty_parentheses
    sql: "SELECT COUNT() FROM g"
  - id: count_of_no_rows_is_zero
    sql: "SELECT COUNT(*), COUNT(v), COUNT(DISTINCT v) FROM g WHERE id > 100"
  - id: count_of_null_is_zero
    sql: "SELECT COUNT(NULL) FROM g"
  - id: count_distinct_of_null_is_zero
    sql: "SELECT COUNT(NULL), COUNT(DISTINCT NULL) FROM g"
    profile: sqla17-default
  - id: count_of_a_constant
    sql: "SELECT COUNT(1), COUNT('x') FROM g"
  - id: count_distinct_of_bits_and_dates
    sql: "SELECT COUNT(DISTINCT b), COUNT(DISTINCT dt), COUNT(DISTINCT d) FROM g"
  - id: count_distinct_of_an_expression
    sql: "SELECT COUNT(DISTINCT k + 1) FROM g"
    profile: sqla17-default
  - id: count_distinct_of_an_expression_under_the_iq_engine_is_refused
    sql: "SELECT COUNT(DISTINCT k + 1) FROM g"
  # IQ island, 2026-10-14 (the merge of M1b/M1c with the natives slice): was count_distinct_of_strings_is_refused; IQ's collation answers it now
  - id: count_distinct_of_strings
    sql: "SELECT COUNT(DISTINCT s) FROM g"
  - id: count_in_arithmetic_in_sql_anywhere
    sql: "SELECT COUNT(*) + 1, COUNT(*) - 20, COUNT(*) * 3 FROM sa_rowgenerator(1, 10)"
    engine: sa
  - id: count_out_of_its_integer
    sql: "SELECT COUNT(*) * 2147483647 FROM sa_rowgenerator(1, 2)"
    engine: sa
  - id: count_in_arithmetic_under_the_iq_engine
    sql: "SELECT COUNT(*) + 1 FROM g"
  - id: count_compared_under_the_iq_engine
    sql: "SELECT k FROM g GROUP BY k HAVING COUNT(*) > 2"
  - id: count_ordered_under_the_iq_engine
    sql: "SELECT k, COUNT(*) AS n FROM g GROUP BY k ORDER BY n DESC, k"
  - id: count_of_rowgenerator
    sql: "SELECT COUNT(*), COUNT(row_num) FROM sa_rowgenerator(1, 100)"
    engine: sa
  - id: count_of_an_empty_rowgenerator
    sql: "SELECT COUNT(*) FROM sa_rowgenerator(5, 1)"
    engine: sa
  - id: count_of_dummy
    sql: "SELECT COUNT(*) FROM DUMMY"
    engine: sa
  - id: count_in_a_sql_anywhere_database
    sql: "SELECT COUNT(*) + 1, COUNT(DISTINCT k) FROM g"
    profile: sqla17-default
  - id: count_star_distinct_is_a_syntax_error
    sql: "SELECT COUNT(DISTINCT *) FROM g"
  - id: count_of_two_values
    sql: "SELECT COUNT(v, k) FROM g"
  - id: count_over_a_join
    sql: "SELECT COUNT(*) FROM g a, g b WHERE a.k = b.k"
  - id: count_over_a_left_join
    sql: "SELECT t.id, COUNT(u.id) FROM t LEFT JOIN u ON u.t_id = t.id GROUP BY t.id ORDER BY 1"

  # ---- SUM: SMALLINT and INTEGER to INTEGER, BIGINT to BIGINT, BIT to NUMERIC(18,0), DOUBLE to DOUBLE, NUMERIC(p,s)
  #      to NUMERIC(p+8,s) in SQL Anywhere's front end; each running total checked (D-E3)
  - id: sum_of_smallint_and_integer
    sql: "SELECT SUM(k), SUM(v), SUM(j) FROM g WHERE k < 4"
  - id: sum_of_bigint
    sql: "SELECT SUM(w) FROM g WHERE k < 4"
  - id: sum_of_smallint_extremes
    sql: "SELECT SUM(sm) FROM t"
  - id: sum_per_group
    sql: "SELECT k, SUM(v), SUM(w) FROM g WHERE k < 4 OR k IS NULL GROUP BY k ORDER BY k"
  - id: sum_of_an_integer_out_of_range
    sql: "SELECT SUM(v) FROM g"
    decision: D-N3
    expect: '{"columns": [["SUM(g.v)", "numeric", 0]], "rows": [["2147483661"]]}'
  - id: sum_of_a_bigint_out_of_range
    sql: "SELECT SUM(w) FROM g"
    decision: D-N3
    expect: '{"columns": [["SUM(g.w)", "numeric", 0]], "rows": [["9223372036854775832"]]}'
  - id: sum_out_of_range_in_one_group
    sql: "SELECT k, SUM(v) FROM g GROUP BY k"
    decision: D-N3
    expect: '{"columns": [["k", "smallint", 0], ["SUM(g.v)", "numeric", 0]], "rows": [[null, "3"], ["1", "12"], ["2", "2"], ["3", "-4"], ["4", "2147483648"]]}'
  - id: sum_whose_running_total_passes_the_largest
    sql: "SELECT SUM(v) FROM o"
    decision: D-N3
    expect: '{"columns": [["SUM(o.v)", "numeric", 0]], "rows": [["2147483643"]]}'
  - id: sum_of_a_bigint_whose_running_total_passes_the_largest
    sql: "SELECT SUM(w) FROM o"
    decision: D-N3
    expect: '{"columns": [["SUM(o.w)", "numeric", 0]], "rows": [["9223372036854775803"]]}'
  - id: sum_whose_running_total_may_pass_the_largest
    sql: "SELECT SUM(x) FROM (SELECT 2147483647 x UNION ALL SELECT 1 UNION ALL SELECT -5) d"
    engine: sa
    skip: "plan-dependent run-time error (D-E3): SQL Anywhere checks each running total in its plan's order"
  - id: sum_near_the_largest
    sql: "SELECT SUM(v) FROM o WHERE id <> 2"
  - id: sum_of_negative_values
    sql: "SELECT SUM(v), SUM(w) FROM o WHERE id > 1"
  - id: sum_below_the_smallest
    sql: "SELECT SUM(x) FROM (SELECT -2147483647 x UNION ALL SELECT -2) d"
    engine: sa
  - id: sum_of_smallints_beyond_a_smallint
    sql: "SELECT SUM(x) FROM (SELECT 32767 x UNION ALL SELECT 32767) d"
    engine: sa
  - id: sum_distinct
    sql: "SELECT SUM(DISTINCT v), SUM(DISTINCT k) FROM g WHERE k < 4"
  - id: sum_distinct_per_group
    sql: "SELECT k, SUM(DISTINCT v), COUNT(DISTINCT v) FROM g WHERE k < 4 GROUP BY k ORDER BY 1"
  - id: sum_of_an_expression
    sql: "SELECT SUM(k + 1), SUM(-k), SUM(k * 2) FROM g"
  - id: sum_of_bits
    sql: "SELECT SUM(b) FROM g"
  - id: sum_of_doubles
    sql: "SELECT SUM(d) FROM g WHERE k < 4"
  - id: sum_of_doubles_per_group
    sql: "SELECT k, SUM(d) FROM g WHERE k < 4 GROUP BY k ORDER BY 1"
  - id: sum_of_doubles_out_of_range
    sql: "SELECT SUM(d) FROM g WHERE k = 4 OR id = 4"
  - id: sum_of_no_rows_is_null
    sql: "SELECT SUM(v), SUM(w), SUM(d) FROM g WHERE id > 100"
  - id: sum_of_null_values_is_null
    sql: "SELECT SUM(v) FROM g WHERE id = 7"
  - id: sum_of_untyped_null_is_refused
    sql: "SELECT SUM(NULL) FROM g"
  - id: sum_of_rowgenerator
    sql: "SELECT SUM(row_num) FROM sa_rowgenerator(1, 100)"
    engine: sa
  - id: sum_of_an_empty_rowgenerator
    sql: "SELECT SUM(row_num) FROM sa_rowgenerator(5, 1)"
    engine: sa
  - id: sum_of_numerics_in_sql_anywhere
    sql: "SELECT SUM(row_num * 1.5), SUM(1.25), SUM(row_num * 0.25) FROM sa_rowgenerator(1, 3)"
    engine: sa
  - id: sum_of_a_numeric_under_the_iq_engine
    sql: "SELECT SUM(n) FROM g"
  - id: sum_of_strings_is_refused
    sql: "SELECT SUM(s) FROM g"
  - id: sum_of_dates_is_refused
    sql: "SELECT SUM(dt) FROM g"
  - id: sum_in_arithmetic
    sql: "SELECT SUM(v) - 1, SUM(k) * 2 FROM g WHERE k < 4"
  - id: sum_in_a_sql_anywhere_database
    sql: "SELECT SUM(v), SUM(w) FROM g WHERE k < 4"
    profile: sqla17-default
  - id: sum_of_star_is_wrong
    sql: "SELECT SUM(*) FROM g"
  - id: sum_of_nothing_is_wrong
    sql: "SELECT SUM() FROM g"
  - id: sum_of_two_values_is_wrong
    sql: "SELECT SUM(v, k) FROM g"
  - id: sum_with_order_by_is_wrong
    sql: "SELECT SUM(v ORDER BY v) FROM g"

  # ---- AVG: of a DOUBLE a DOUBLE, checked as its SUM; of an exact number a NUMERIC quotient (refused)
  - id: avg_of_doubles
    sql: "SELECT AVG(d) FROM g WHERE k < 4"
  - id: avg_of_doubles_per_group
    sql: "SELECT k, AVG(d) FROM g WHERE k < 4 GROUP BY k ORDER BY 1"
  - id: avg_distinct_of_doubles
    sql: "SELECT AVG(DISTINCT d) FROM g WHERE k < 4"
  - id: avg_of_doubles_out_of_range
    sql: "SELECT AVG(d) FROM g WHERE k = 4"
  - id: avg_of_no_doubles_is_null
    sql: "SELECT AVG(d) FROM g WHERE id > 100"
  - id: avg_of_an_integer_under_the_iq_engine
    sql: "SELECT AVG(v) FROM g WHERE k < 4"
    profile: iq17-default
  - id: avg_of_a_numeric_under_the_iq_engine
    sql: "SELECT AVG(n) FROM g"
    profile: iq17-default
  - id: avg_of_rowgenerator_is_refused
    sql: "SELECT AVG(row_num) FROM sa_rowgenerator(1, 3)"
    engine: sa

  # ---- MIN and MAX: the argument's type
  - id: min_max_of_integers
    sql: "SELECT MIN(k), MAX(k), MIN(v), MAX(v), MIN(w), MAX(w) FROM g"
  - id: min_max_of_numerics
    sql: "SELECT MIN(n), MAX(n) FROM g"
  - id: min_max_of_doubles
    sql: "SELECT MIN(d), MAX(d) FROM g"
  - id: min_max_of_dates_and_timestamps
    sql: "SELECT MIN(dt), MAX(dt), MIN(ts), MAX(ts) FROM t"
  - id: min_max_of_bits
    sql: "SELECT MIN(b), MAX(b) FROM g"
  - id: min_max_of_type_extremes
    sql: "SELECT MIN(sm), MAX(sm), MIN(it), MAX(it), MIN(bg), MAX(bg), MIN(nm), MAX(nm) FROM t"
  - id: min_max_per_group
    sql: "SELECT k, MIN(v), MAX(n), MIN(dt), MAX(d) FROM g GROUP BY k ORDER BY k"
  - id: min_max_of_no_rows
    sql: "SELECT MIN(v), MAX(n), MIN(dt) FROM g WHERE id > 100"
  - id: min_of_a_group_of_nulls
    sql: "SELECT k, MIN(v) FROM g WHERE id = 7 GROUP BY k"
  - id: min_distinct
    sql: "SELECT MIN(DISTINCT k), MAX(DISTINCT v) FROM g"
  - id: min_max_of_untyped_null
    sql: "SELECT MIN(NULL), MAX(NULL) FROM g"
    decision: D-N7
    expect: '{"columns": [["MIN(null)", "varchar", 0], ["MAX(null)", "varchar", 0]], "rows": [[null, null]]}'
  - id: min_max_of_numerics_in_sql_anywhere
    sql: "SELECT MIN(1.5), MAX(row_num * 0.5) FROM sa_rowgenerator(1, 3)"
    engine: sa
  - id: min_max_in_arithmetic
    sql: "SELECT MAX(k) + MIN(k), MAX(k) - 1 FROM g"
  - id: max_minus_min_per_group
    sql: "SELECT k, MAX(v) - MIN(v) AS spread FROM g WHERE k < 4 GROUP BY k ORDER BY k"
  - id: min_of_strings
    sql: "SELECT MIN(s) FROM g"
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: max_of_a_char
    sql: "SELECT MAX(c) FROM g"
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: min_with_order_by_is_wrong
    sql: "SELECT MIN(v ORDER BY v) FROM g"

  # ---- MEDIAN: an integer's midpoint floored, as its type
  # IQ island, 2026-10-14 (review 3's M2): MEDIAN of an INTEGER column (v, j) is refused now -- SQL Anywhere's midpoint
  # wraps at 32 bits (its defect) -- so the cases over v and j are judged REFUSED; a SMALLINT's and row_num's answer
  - id: median_of_integers
    sql: "SELECT MEDIAN(k), MEDIAN(v) FROM g WHERE k < 4"
  - id: median_per_group
    sql: "SELECT k, MEDIAN(v), MEDIAN(j) FROM g WHERE k < 4 GROUP BY k ORDER BY 1"
  - id: median_of_an_even_count_is_floored
    sql: "SELECT MEDIAN(x) AS m FROM (SELECT -1 x UNION ALL SELECT -4) d"
    engine: sa
  - id: median_of_an_odd_count
    sql: "SELECT MEDIAN(row_num) FROM sa_rowgenerator(1, 7)"
    engine: sa
  - id: median_of_an_even_rowgenerator
    sql: "SELECT MEDIAN(row_num) FROM sa_rowgenerator(1, 100)"
    engine: sa
  - id: median_all
    sql: "SELECT MEDIAN(ALL v) FROM g WHERE k < 4"
  - id: median_distinct_is_refused
    sql: "SELECT MEDIAN(DISTINCT v), MEDIAN(ALL v) FROM g WHERE k < 4"
  - id: median_of_no_rows
    sql: "SELECT MEDIAN(v) FROM g WHERE id > 100"
  - id: median_of_integer_extremes
    sql: "SELECT MEDIAN(it), MEDIAN(sm) FROM t"
  - id: median_of_a_bit_is_wrong
    sql: "SELECT MEDIAN(b) FROM g"
  - id: median_of_a_date_is_wrong
    sql: "SELECT MEDIAN(dt) FROM g"
  - id: median_of_null_is_wrong
    sql: "SELECT MEDIAN(NULL) FROM g"
  - id: median_of_a_bigint_is_refused
    sql: "SELECT MEDIAN(w) FROM g WHERE k < 4"
  # IQ island, 2026-10-15 (checklist 2.16, measured on IQ 17.1): answered now, so renamed from median_of_a_double_is_refused
  # and median_of_a_numeric_is_refused; under IQ's engine MEDIAN of a NUMERIC keeps its type (D-F20), where SQL
  # Anywhere's front end gives a NUMERIC(126,38)
  - id: median_of_a_double
    sql: "SELECT MEDIAN(d) FROM g WHERE k < 4"
  - id: median_of_a_numeric
    sql: "SELECT MEDIAN(n) FROM g"
    decision: D-F20
    expect: '{"columns": [["MEDIAN(g.n)", "numeric", 2]], "rows": [["1.25"]]}'

  # ---- LIST: an integer column's values in its own order, joined
  - id: list_ordered_by_its_value
    sql: "SELECT LIST(id ORDER BY id) FROM g"
  - id: list_descending
    sql: "SELECT LIST(v ORDER BY v DESC) FROM g"
  - id: list_with_a_delimiter
    sql: "SELECT LIST(id, '-' ORDER BY id) FROM g"
  - id: list_with_a_spaced_delimiter
    sql: "SELECT LIST(id, ', ' ORDER BY id) FROM g WHERE k < 3"
  - id: list_with_an_empty_delimiter
    sql: "SELECT LIST(id, '' ORDER BY id) FROM g"
  - id: list_with_a_null_delimiter
    sql: "SELECT LIST(id, NULL ORDER BY id) FROM g"
  - id: list_per_group
    sql: "SELECT k, LIST(id ORDER BY id) FROM g GROUP BY k ORDER BY k"
  - id: list_skips_nulls
    sql: "SELECT k, LIST(v ORDER BY v) FROM g WHERE k IS NULL OR k = 2 GROUP BY k ORDER BY k"
  - id: list_of_no_rows_is_empty
    sql: "SELECT LIST(v ORDER BY v) FROM g WHERE id > 100"
    decision: D-A3
    expect: '{"columns": [["LIST(g.v order by g.v asc)", "varchar", 0]], "rows": [[null]]}'
  - id: list_of_bigints
    sql: "SELECT LIST(w ORDER BY w) FROM g"
  - id: list_of_bits
    sql: "SELECT LIST(b ORDER BY b) FROM g"
  - id: list_of_rowgenerator
    sql: "SELECT LIST(row_num ORDER BY row_num DESC) FROM sa_rowgenerator(1, 5)"
    engine: sa
  - id: list_of_an_empty_rowgenerator
    sql: "SELECT LIST(row_num ORDER BY row_num) FROM sa_rowgenerator(5, 1)"
    engine: sa
  - id: two_lists_ordered_alike
    sql: "SELECT LIST(id ORDER BY id), LIST(id, '|' ORDER BY id) FROM g"
  - id: two_lists_ordered_differently
    sql: "SELECT LIST(row_num ORDER BY row_num), LIST(row_num ORDER BY row_num DESC) FROM sa_rowgenerator(1, 3)"
    engine: sa
  - id: two_lists_ordered_differently_under_the_iq_engine_are_refused
    sql: "SELECT LIST(id ORDER BY id), LIST(k ORDER BY k) FROM g"
  # LIST without ORDER BY (IQ island, 2026-10-15): its values in the plan's order, IQ's as the database's; grouped by a
  # unique column, each LIST holds one value
  - id: list_without_order_by
    sql: "SELECT id, LIST(sm) AS l FROM t GROUP BY id ORDER BY id"
    decision: D-A3
    expect: '{"columns": [["id", "integer", 0], ["l", "varchar", 0]], "rows": [["1", "32767"], ["2", "-32768"], ["3", "0"], ["4", "1"], ["5", null], ["6", "100"], ["7", "-1"]]}'
  - id: list_of_strings_without_order_by
    sql: "SELECT id, LIST(vc) AS l FROM t GROUP BY id ORDER BY id"
    decision: D-A3
    expect: '{"columns": [["id", "integer", 0], ["l", "varchar", 0]], "rows": [["1", "Hello"], ["2", "hello"], ["3", "Résumé"], ["4", "ÉCOLE"], ["5", null], ["6", "x"], ["7", "apple"]]}'
  - id: list_with_a_delimiter_without_order_by
    sql: "SELECT id, LIST(it, '; ') AS l FROM t GROUP BY id ORDER BY id"
    decision: D-A3
    expect: '{"columns": [["id", "integer", 0], ["l", "varchar", 0]], "rows": [["1", "2147483647"], ["2", "-2147483648"], ["3", "0"], ["4", "-1"], ["5", null], ["6", "100"], ["7", "7"]]}'
  - id: list_ordered_by_another_column_is_refused
    sql: "SELECT LIST(k ORDER BY id) FROM g"
  - id: list_of_strings_is_refused
    sql: "SELECT LIST(s ORDER BY s) FROM g"
  - id: list_distinct_is_refused
    sql: "SELECT LIST(DISTINCT id ORDER BY id) FROM g"
  - id: list_ordered_by_a_position_is_wrong
    sql: "SELECT LIST(id ORDER BY 1) FROM g"
  - id: list_with_a_column_delimiter_is_refused
    sql: "SELECT LIST(id, k ORDER BY id) FROM g"
  - id: list_with_nulls_first_is_a_syntax_error
    sql: "SELECT LIST(id ORDER BY id NULLS FIRST) FROM g"

  # ---- GROUP BY: columns, expressions, select-list aliases; NULL is one group, the lowest
  - id: group_by_a_column
    sql: "SELECT k, COUNT(*) FROM g GROUP BY k ORDER BY k"
  - id: group_by_two_columns
    sql: "SELECT k, j, COUNT(*) FROM g GROUP BY k, j ORDER BY k, j"
  - id: group_by_columns_in_another_order
    sql: "SELECT j, k FROM g GROUP BY k, j ORDER BY 1, 2"
  - id: group_by_a_column_not_shown
    sql: "SELECT COUNT(*) FROM g GROUP BY k"
  - id: group_by_without_aggregates
    sql: "SELECT k FROM g GROUP BY k ORDER BY 1"
  - id: group_by_a_column_twice
    sql: "SELECT k FROM g GROUP BY k, k ORDER BY 1"
  - id: group_by_an_expression
    sql: "SELECT k + 1, COUNT(*) FROM g GROUP BY k + 1 ORDER BY 1"
  # (these two name their items by the front end's rule: the names section below says where they run)
  - id: group_by_an_expression_shown_inside_another
    sql: "SELECT (k + 1) * 2 FROM g GROUP BY k + 1 ORDER BY 1"
    profile: sqla17-default, iq17-default
  - id: group_by_an_expression_named_as_group_by_writes_it
    sql: "SELECT k + 1 FROM g GROUP BY (k) + 1"
    profile: sqla17-default, iq17-default
  - id: group_by_an_expression_written_otherwise_is_refused
    sql: "SELECT 1 + k FROM g GROUP BY k + 1"
  - id: group_by_an_expression_and_its_column_elsewhere_is_refused
    sql: "SELECT k * 3 FROM g GROUP BY k + 1"
  - id: group_by_an_expression_and_a_column
    sql: "SELECT j, k + 1 FROM g GROUP BY j, k + 1 ORDER BY 1, 2"
  - id: group_by_a_case
    sql: "SELECT CASE WHEN k > 2 THEN 1 ELSE 0 END AS big, COUNT(*) FROM g GROUP BY big ORDER BY 1"
  - id: group_by_an_alias
    sql: "SELECT k AS kk, COUNT(*) FROM g GROUP BY kk ORDER BY 1"
  - id: group_by_an_alias_of_an_expression
    sql: "SELECT j + 0 AS x, COUNT(*) FROM g GROUP BY x ORDER BY 1"
  - id: group_by_an_alias_before_a_column_of_its_name
    sql: "SELECT j AS k, COUNT(*) FROM g GROUP BY k ORDER BY 1"
  - id: group_by_an_alias_inside_an_expression
    sql: "SELECT j AS x, COUNT(*) FROM g GROUP BY x + 0 ORDER BY 1"
  - id: group_by_an_alias_and_the_same_expression
    sql: "SELECT k + 1 AS x, k + 1 FROM g GROUP BY x ORDER BY 1"
  - id: group_by_an_alias_of_an_aggregate_is_wrong
    sql: "SELECT COUNT(*) AS n FROM g GROUP BY n"
  - id: group_by_a_bit
    sql: "SELECT b, COUNT(*), SUM(v) FROM g WHERE k < 4 GROUP BY b ORDER BY b"
  - id: group_by_a_date
    sql: "SELECT dt, COUNT(*) FROM g GROUP BY dt ORDER BY dt"
  - id: group_by_a_double
    sql: "SELECT d, COUNT(*) FROM g WHERE k < 4 GROUP BY d ORDER BY d"
  - id: group_by_a_numeric
    sql: "SELECT n, COUNT(*) FROM g GROUP BY n ORDER BY n"
  - id: group_by_a_bigint
    sql: "SELECT w, COUNT(*) FROM g GROUP BY w ORDER BY w"
  - id: group_by_null_groups
    sql: "SELECT j, COUNT(*), COUNT(j) FROM g GROUP BY j ORDER BY j"
  - id: group_by_of_no_rows
    sql: "SELECT k, COUNT(*) FROM g WHERE id > 100 GROUP BY k"
  - id: group_by_a_string
    sql: "SELECT s, COUNT(*) FROM g GROUP BY s"
    member: "IQ shows one value of each group of equal strings, its plan's choice; any is IQ's answer"
  - id: group_by_a_varchar
    sql: "SELECT vc FROM t GROUP BY vc"
  - id: group_by_a_column_not_grouped_is_wrong
    sql: "SELECT k, j FROM g GROUP BY k"
  - id: group_by_a_column_not_grouped_in_having_is_wrong
    sql: "SELECT k FROM g GROUP BY k HAVING j > 1"
  - id: group_by_order_by_a_column_not_grouped_is_wrong
    sql: "SELECT k FROM g GROUP BY k ORDER BY j"
  - id: group_by_one_is_a_constant_not_a_position
    sql: "SELECT k, COUNT(*) FROM g GROUP BY 1"
  - id: group_by_positions_are_constants
    sql: "SELECT k, j, COUNT(*) FROM g GROUP BY 1, 2"
  - id: group_by_a_constant_beside_a_column
    sql: "SELECT k, COUNT(*) FROM g GROUP BY k, 1 ORDER BY k"
  - id: group_by_only_a_constant_under_the_iq_engine
    sql: "SELECT COUNT(*) FROM g GROUP BY 1"
  - id: group_by_only_a_constant_in_sql_anywhere
    sql: "SELECT COUNT(*) FROM sa_rowgenerator(1, 5) GROUP BY 1"
    engine: sa
  - id: group_by_only_a_constant_over_no_rows
    sql: "SELECT COUNT(*) FROM sa_rowgenerator(5, 1) GROUP BY 1"
    engine: sa
  - id: group_by_null
    sql: "SELECT COUNT(*) FROM g GROUP BY NULL"
  - id: group_by_rowgenerator_remainders
