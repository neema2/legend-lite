  # computed only where read): the second aggregate is MAX now, which cannot raise
  - id: having_two_aggregates
    sql: "SELECT k FROM g WHERE k < 4 GROUP BY k HAVING COUNT(*) > 1 AND MAX(v) > 0 ORDER BY k"
