  # ---- CAST to integers: truncated toward zero; a string by IQ's strict reading; out of range -158
  - id: cast_numbers_to_int
    sql: "SELECT CAST(2.5 AS INT) AS a, CAST(-2.5 AS INT) AS b, CAST(-2.7e0 AS INT) AS c, CAST(NULL AS INT) AS d, CAST(32767 AS SMALLINT) AS e, CAST(1 AS BIGINT) AS f, CAST(1.9 AS SMALLINT) AS g, CAST(-32768 AS SMALLINT) AS h"
    engine: sa
  - id: cast_numeric_column_to_int
    sql: "SELECT id, CAST(nm AS INT) AS a, CAST(nm AS BIGINT) AS b FROM t ORDER BY id"
  - id: cast_double_column_to_int
    sql: "SELECT id, CAST(dbl AS INT) AS a, CAST(dbl AS SMALLINT) AS b FROM t WHERE id <> 6 ORDER BY id"
  - id: cast_double_past_bigint
    sql: "SELECT id, CAST(dbl AS BIGINT) AS a FROM t WHERE id = 6"
  - id: cast_integer_columns
    sql: "SELECT id, CAST(sm AS INT) AS a, CAST(it AS BIGINT) AS b, CAST(bt AS SMALLINT) AS c FROM t ORDER BY id"
  - id: cast_integer_column_narrower
