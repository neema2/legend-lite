  # ---- CAST to NUMERIC(p, s): rounded half away from zero; more whole digits than p - s is -158
  - id: cast_to_numeric_constants
    sql: "SELECT CAST(2.675 AS NUMERIC(5,2)) AS a, CAST(-2.675 AS NUMERIC(5,2)) AS b, CAST(2.5 AS NUMERIC(1,0)) AS c, CAST(1 AS NUMERIC(5,2)) AS d, CAST(NULL AS NUMERIC(5,2)) AS e, CAST(1.5 AS DECIMAL(10,4)) AS f"
    engine: sa
  - id: cast_strings_to_numeric
    sql: "SELECT CAST('1.5' AS NUMERIC(5,2)) AS a, CAST('1e2' AS NUMERIC(5,1)) AS b, CAST(' -1.25 ' AS NUMERIC(5,1)) AS c, CAST('' AS NUMERIC(5,2)) AS d, CAST('.5' AS NUMERIC(3,2)) AS e"
    engine: sa
  # IQ island, 2026-10-15 (checklist 0.5, D-N6, measured on IQ 17.1): under IQ's engine a narrower scale truncates
  - id: cast_numeric_column_to_numeric
    sql: "SELECT id, CAST(nm AS NUMERIC(12,1)) AS a, CAST(nm AS NUMERIC(15,4)) AS b, CAST(nm AS DECIMAL(10)) AS c FROM t ORDER BY id"
    decision: D-N6
    expect: '[["1","12345678.9","12345678.9900","12345678"],["2","-99999999.9","-99999999.9900","-99999999"],["3","0.0","0.0000","0"],["4","0.0",".0100","0"],["5",null,null,null],["6","100.5","100.5000","100"],["7","-.5","-.5000","0"]]'
  # IQ island, 2026-10-15 (checklist 0.5): CAST(it AS NUMERIC) is a NUMERIC(126,38) under IQ's engine, refused
  # (iq_engine_casts.yaml), so this reads a precision
  - id: cast_integer_column_to_numeric
    sql: "SELECT id, CAST(sm AS NUMERIC(7,2)) AS a, CAST(it AS NUMERIC(10,0)) AS b, CAST(bg AS DECIMAL(20,0)) AS c FROM t ORDER BY id"
  - id: cast_to_numeric_out_of_range
    sql: "SELECT id, CAST(nm AS NUMERIC(5,1)) AS a FROM t ORDER BY id"
  - id: cast_to_numeric_rounding_up_out_of_range
    sql: "SELECT CAST(999.5 AS NUMERIC(3,0)) AS a"
    engine: sa
  - id: cast_to_numeric_over_rowgenerator
    sql: "SELECT row_num, CAST(row_num * 0.125 AS NUMERIC(5,2)) AS a, CAST(row_num AS NUMERIC(4,1)) AS b FROM sa_rowgenerator(-4, 4) ORDER BY row_num"
    engine: sa
  - id: cast_string_to_numeric_without_precision_in_sql_anywhere
    sql: "SELECT CAST('1' AS DECIMAL) AS a, CAST(' 2.5 ' AS NUMERIC) AS b"
    profile: sqla17-default
    engine: sa
  - id: cast_string_to_numeric_without_precision_is_refused
    sql: "SELECT CAST('1' AS DECIMAL) AS a"
    engine: sa
  # IQ island, 2026-10-15 (checklist 0.5, D-N6): answered under IQ's engine, so renamed from cast_double_to_numeric_is_refused
  - id: cast_double_to_numeric
    sql: "SELECT id, CAST(dbl AS NUMERIC(10,2)) AS a FROM t WHERE id <> 6 ORDER BY id"
  # IQ island, 2026-10-15 (checklist 0.5): read under IQ's engine ('Hello' is its error), so renamed from
  # cast_string_column_to_numeric_is_refused
  - id: cast_string_column_to_numeric_is_iqs_error
    sql: "SELECT CAST(vc AS NUMERIC(10,2)) AS a FROM t WHERE id = 1"
  - id: cast_to_numeric_of_precision_0
    sql: "SELECT CAST(1 AS NUMERIC(0,0)) AS a"
    engine: sa
  - id: cast_to_numeric_of_a_scale_past_precision
    sql: "SELECT CAST(1 AS NUMERIC(2,3)) AS a"
    engine: sa

  # ---- CAST to DOUBLE
  - id: cast_to_double
    sql: "SELECT CAST(1 AS DOUBLE) AS a, CAST(1.5 AS DOUBLE) AS b, CAST('1.5' AS DOUBLE) AS c, CAST(NULL AS DOUBLE) AS d, CAST(' 2.5e1 ' AS DOUBLE) AS e, CAST('' AS DOUBLE) AS f, CAST(1 AS DOUBLE PRECISION) AS g, CAST(1 AS FLOAT(53)) AS h"
