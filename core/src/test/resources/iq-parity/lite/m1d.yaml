  # ---- CAST to DATE and TIMESTAMP: a date, a timestamp, an ISO string constant
  - id: cast_strings_to_dates
    sql: "SELECT CAST('2026-03-04' AS DATE) AS a, CAST('2026-03-04 05:06:07' AS TIMESTAMP) AS b, CAST('2026-03-04' AS TIMESTAMP) AS c, CAST(NULL AS DATE) AS d, CAST('2026-03-04 23:59' AS DATE) AS e, CAST('2026-03-04 05:06:07.123456' AS DATETIME) AS f"
    engine: sa
  - id: cast_columns_to_dates
    sql: "SELECT id, CAST(ts AS DATE) AS a, CAST(dt AS TIMESTAMP) AS b, CAST(dt AS DATE) AS c, CAST(ts AS DATETIME) AS d FROM t ORDER BY id"
  - id: cast_invalid_date_string
    sql: "SELECT CAST('2026-02-30' AS DATE) AS a"
    engine: sa
  - id: cast_empty_string_to_date
    sql: "SELECT CAST('' AS DATE) AS a"
    engine: sa
  - id: cast_invalid_date_string_of_no_row
    sql: "SELECT CAST('2026-02-30' AS DATE) AS a FROM sa_rowgenerator(1, 0)"
    engine: sa
  # IQ island, 2026-10-14 (M1e): answered now (IqDateTime), so renamed from cast_non_iso_string_to_date_is_refused
  - id: cast_non_iso_string_to_date
    sql: "SELECT CAST('2026/03/04' AS DATE) AS a"
    engine: sa
  - id: cast_integer_to_date_is_refused
    sql: "SELECT CAST(20260304 AS DATE) AS a"
    engine: sa
  - id: cast_date_compared
    sql: "SELECT id FROM t WHERE CAST(ts AS DATE) = CAST('2026-03-04' AS DATE) ORDER BY id"

  # ---- CAST to BIT: 0 or 1, anything else -158 (any nonzero is 1 under the IQ engine: refused there)
  - id: cast_to_bit
    sql: "SELECT CAST(1 AS BIT) AS a, CAST(0 AS BIT) AS b, CAST(NULL AS BIT) AS c"
    engine: sa
  - id: cast_to_bit_out_of_range
    sql: "SELECT CAST(5 AS BIT) AS a"
    engine: sa
  - id: cast_values_to_bit
    sql: "SELECT row_num, CAST(row_num AS BIT) AS b FROM sa_rowgenerator(0, 1) ORDER BY row_num"
    engine: sa
  - id: cast_value_2_to_bit
    sql: "SELECT row_num, CAST(row_num AS BIT) AS b FROM sa_rowgenerator(0, 2) ORDER BY row_num"
    engine: sa
  - id: cast_bit_column_to_bit
    sql: "SELECT id, CAST(bt AS BIT) AS b FROM t ORDER BY id"
  - id: cast_integer_column_to_bit_under_iq_is_refused
    sql: "SELECT CAST(sm AS BIT) AS b FROM t WHERE id = 3"
  - id: cast_numeric_to_bit_is_refused
    sql: "SELECT CAST(1.5 AS BIT) AS b"
    engine: sa

  # ---- CAST to the types the island does not read, and CAST's syntax
  - id: cast_to_tinyint_is_refused
    sql: "SELECT CAST(1 AS TINYINT) AS a"
    engine: sa
  - id: cast_to_unsigned_is_refused
    sql: "SELECT CAST(1 AS UNSIGNED INT) AS a"
    engine: sa
  - id: cast_to_time_is_refused
    sql: "SELECT CAST('10:00:00' AS TIME) AS a"
    engine: sa
  - id: cast_to_binary_is_refused
    sql: "SELECT CAST('ab' AS BINARY(2)) AS a"
    engine: sa
  - id: cast_to_a_domain_is_refused
    sql: "SELECT CAST(1 AS foo_domain) AS a"
    engine: sa
  - id: cast_to_int_with_a_display_width
    sql: "SELECT CAST(1 AS INT(11)) AS a"
    engine: sa
  - id: cast_without_as
    sql: "SELECT CAST(1 INT) AS a"
    engine: sa
  - id: cast_of_a_condition
    sql: "SELECT CAST(1 = 1 AS INT) AS a"
    engine: sa
  - id: cast_nested
    sql: "SELECT CAST(CAST(' 7 ' AS INT) AS VARCHAR(3)) || '|' AS a, CAST(CAST(2.5 AS NUMERIC(3,1)) AS INT) AS b"
    engine: sa
  - id: cast_null_in_arithmetic
    sql: "SELECT CAST(NULL AS INT) + 1 AS a, CAST(NULL AS INT) * 2 AS b, 'abc' || CAST(NULL AS VARCHAR(10)) AS c"
    engine: sa
  - id: cast_in_order_by
    sql: "SELECT id, nm FROM t WHERE id <> 5 ORDER BY CAST(nm AS INT), id"

  # ---- CONVERT without a style is CAST but where a date becomes text (style 0; D-C6 under the IQ engine); styles later
  - id: convert_without_a_style
    sql: "SELECT CONVERT(INT, '30') AS a, CONVERT(VARCHAR(10), 123) AS b, CONVERT(NUMERIC(5,2), 1.234) AS c, CONVERT(DATE, '2026-03-04') AS d, CONVERT(CHAR(5), 'ab') || '|' AS e"
    engine: sa
  - id: convert_plus_cast
    sql: "SELECT CONVERT(INT, '30') + CAST('12' AS INT) AS a"
    engine: sa
  - id: convert_of_columns
    sql: "SELECT id, CONVERT(INT, nm) AS a, CONVERT(VARCHAR(20), it) AS b, CONVERT(DATE, ts) AS c FROM t ORDER BY id"
  - id: convert_date_to_text
    sql: "SELECT CONVERT(VARCHAR(30), dt) AS a FROM t WHERE id = 1"
    decision: D-C6
    expect: '{"columns": [["a", "varchar", 0]], "rows": [["2026-03-04"]]}'
  - id: convert_date_to_text_in_sql_anywhere_is_refused
    sql: "SELECT CONVERT(VARCHAR(30), CAST('2026-03-04' AS DATE)) AS a"
    engine: sa
  - id: convert_with_a_style
    sql: "SELECT CONVERT(VARCHAR(30), dt, 112) AS a FROM t WHERE id = 1"
  - id: convert_with_a_style_on_the_front_end_is_refused
    sql: "SELECT CONVERT(VARCHAR(30), DATE('2026-03-04'), 106) AS a"
    engine: sa
  - id: convert_with_a_default_style
    sql: "SELECT CONVERT(VARCHAR(30), 1, DEFAULT) AS a"
    engine: sa
  - id: convert_without_a_value
    sql: "SELECT CONVERT(INT) AS a"
    engine: sa

  # ---- functions together, and in the other profiles
  - id: functions_nested
    sql: "SELECT id, LEFT(TRIM(vc), 3) || '|' || RIGHT(STRING(sm), 2) AS a, LENGTH(REPLACE(vc, 'l', '')) AS b FROM t ORDER BY id"
  - id: functions_in_case_and_isnull
    sql: "SELECT id, ISNULL(LEFT(vc, 1), '-') AS a, CASE WHEN LENGTH(vc) > 4 THEN SUBSTRING(vc, 2, 2) ELSE 'short' END AS b FROM t ORDER BY id"
  - id: functions_under_tds
    sql: "SELECT id, LENGTH(vc) AS a, SUBSTRING(vc, 2, 2) AS b, CAST(nm AS INT) AS c FROM t ORDER BY id"
    profile: iq16-tds
  - id: functions_under_odbc
    sql: "SELECT id, LOCATE(vc, 'l') AS a, DATEPART(dw, dt) AS b FROM t ORDER BY id"
    profile: iq16-odbc
  - id: functions_in_sqla17_tds
    sql: "SELECT id, LENGTH(vc) AS a, CAST(it AS VARCHAR(11)) AS b FROM t ORDER BY id"
    profile: sqla17-tds
  - id: functions_order_by_a_function
    sql: "SELECT id, vc FROM t WHERE id <> 5 ORDER BY LENGTH(vc), id"
