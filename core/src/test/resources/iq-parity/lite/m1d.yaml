    engine: sa
  - id: cast_string_out_of_smallint
    sql: "SELECT CAST('40000' AS SMALLINT) AS a"
    engine: sa
  - id: cast_string_values_to_int
    sql: "SELECT row_num, CAST(IF row_num = 1 THEN ' 12 ' ELSE IF row_num = 2 THEN '' ELSE '-0042' ENDIF ENDIF AS INT) AS a FROM sa_rowgenerator(1, 3) ORDER BY row_num"
