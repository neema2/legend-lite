  - id: cast_varchar_column_to_char_in_sql_anywhere
    sql: "SELECT id, CAST(vc AS CHAR(22)) || '|' AS a FROM t ORDER BY id"
    profile: sqla17-default
  # IQ island, 2026-10-15 (checklist 0.5, D-C2, measured on IQ 17.1): under IQ's engine a longer string is cut, to n bytes
  # (n characters in this ISO-8859-1 database; the live IQ's UTF-8 cut is iq_engine_casts.yaml's), where SQL Anywhere
  # raises -638; renamed from cast_varchar_column_to_a_shorter_varchar_is_refused
  - id: cast_varchar_column_to_a_shorter_varchar
