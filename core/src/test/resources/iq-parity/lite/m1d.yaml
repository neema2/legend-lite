  # ---- CAST to CHAR, VARCHAR, LONG VARCHAR: a longer string -638 (but trailing blanks); CHAR(n) padded under IQ (D-S1)
  - id: cast_to_text_constants
    sql: "SELECT CAST(12345 AS VARCHAR(10)) AS a, CAST(-12 AS CHAR(3)) AS b, CAST('abc' AS VARCHAR(10)) AS c, CAST(NULL AS VARCHAR(10)) AS d, CAST(1.50 AS VARCHAR(10)) AS e, CAST('abc' AS VARCHAR) AS f, CAST(123 AS CHAR) AS g, CAST('ab' AS LONG VARCHAR) AS h"
    engine: sa
