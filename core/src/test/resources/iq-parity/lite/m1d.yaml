    sql: "SELECT id, CAST(it AS SMALLINT) AS a FROM t ORDER BY id"
  - id: cast_numeric_out_of_range
    sql: "SELECT CAST(2147483648.5 AS INT) AS a"
    engine: sa
  - id: cast_numeric_just_in_range
    sql: "SELECT CAST(2147483647.5 AS INT) AS a, CAST(-32768.9 AS SMALLINT) AS b, CAST(-9223372036854775808.9 AS BIGINT) AS c"
    engine: sa
  - id: cast_strings_to_int
