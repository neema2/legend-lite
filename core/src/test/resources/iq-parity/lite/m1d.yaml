    engine: sa
  - id: cast_string_values_too_long
    sql: "SELECT row_num, CAST(IF row_num = 1 THEN 'ab' ELSE 'abcd  ' ENDIF AS VARCHAR(4)) || '|' AS a, CAST(IF row_num = 1 THEN 'ab' ELSE 'abcdef' ENDIF AS VARCHAR(4)) AS b FROM sa_rowgenerator(1, 2) ORDER BY row_num"
    engine: sa
  - id: cast_string_values_too_long_of_no_row
    sql: "SELECT CAST(IF row_num = 1 THEN 'ab' ELSE 'abcdef' ENDIF AS VARCHAR(4)) AS a FROM sa_rowgenerator(3, 2)"
