# M1d for the #IQ{...}# island (docs/IQ_SQL_STUDY_2026_10_13.md §9.6): IQ's string, number and date functions and
# CAST and CONVERT, as far as each is exact with Pure's natives (IqFunctions), the rest refused by name. Each is
# judged by SQL Anywhere 17's answer in iq-answers.jsonl unless it names a decision (D-S1: a CHAR(n) value padded
# under the IQ engine; D-F5 (replaced by IQ 17.1's measured ABS, 2026-10-16); D-F9: the IQ engine raises outside
# a function's domain), whose expect is the decided rows (SQL Anywhere's rows, padded where D-S1 pads). A case without
# FROM, or over sa_rowgenerator, runs in SQL Anywhere's front end (engine: sa); one over tables in the IQ engine,
# unless its profile is a sqla17 one. tools/iq-oracle's README.md has the keys.
# IQ island, 2026-10-14 (review 4's m3): the substring, LTRIM, LOCATE and STUFF cases read the island's own strings
# ('mnopqrst', 'xyyxXwxy', 'xyz', 'wxyz') and positions, none a manual's example.
tests:

  # ---- LENGTH, CHAR_LENGTH and LEN: characters, trailing blanks counted (LEN is LENGTH: D-S6); an integer's digits
  - id: length_of_constants
    sql: "SELECT LENGTH('abc  ') AS a, LEN('abc  ') AS b, CHAR_LENGTH('') AS c, LENGTH(NULL) AS d, LENGTH(12345) AS e, LENGTH(-12) AS f"
    engine: sa
  - id: length_of_latin1_text
    sql: "SELECT LENGTH('Résumé') AS a, CHAR_LENGTH('ÿ') AS b, LEN(' ') AS c"
    engine: sa
  - id: length_of_a_varchar
    sql: "SELECT id, LENGTH(vc) AS n FROM t ORDER BY id"
  - id: len_counts_trailing_blanks
    sql: "SELECT id, LEN(vc) AS n, CHAR_LENGTH(vc) AS c FROM t WHERE id = 6"
  - id: length_of_a_char_is_its_padded_length
    sql: "SELECT id, LENGTH(ch) AS n, LEN(ch) AS l FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","5","5"],["2","5","5"],["3","5","5"],["4","5","5"],["5",null,null],["6","5","5"],["7","5","5"]]'
  - id: length_of_a_char_in_sql_anywhere
    sql: "SELECT id, LENGTH(ch) AS n FROM t ORDER BY id"
    profile: sqla17-default
  # IQ island, 2026-10-15 (checklist 1.10, D-S7, measured on IQ 17.1): under IQ's engine an integer column's LENGTH is
  # its storage width, where SQL Anywhere's front end counts its digits
  - id: length_of_integers
    sql: "SELECT id, LENGTH(sm) AS a, CHAR_LENGTH(it) AS b, LEN(bg) AS c, LENGTH(bt) AS d FROM t ORDER BY id"
    decision: D-S7
    expect: '[["1","2","4","8","1"],["2","2","4","8","1"],["3","2","4","8","1"],["4","2","4","8","1"],["5",null,null,null,null],["6","2","4","8","1"],["7","2","4","8","1"]]'
  - id: length_of_repeats_and_spaces
    sql: "SELECT id, LENGTH(REPEAT('ab', id)) AS n, LENGTH(SPACE(sm)) AS s FROM t WHERE id <> 1 ORDER BY id"
  - id: length_in_where
    sql: "SELECT id FROM t WHERE LENGTH(vc) = 5 ORDER BY id"
  - id: length_of_a_numeric_is_refused
    sql: "SELECT LENGTH(nm) AS n FROM t WHERE id = 1"
  - id: length_of_a_double_is_refused
    sql: "SELECT LENGTH(dbl) AS n FROM t WHERE id = 1"
  # IQ island, 2026-10-14 (M1e): answered (IqDateTime); IQ island, 2026-10-15 (checklist 1.10, D-S7, measured on IQ
  # 17.1): IQ's engine answers a date's storage length (3 here), refused again, so renamed from length_of_a_date
  - id: length_of_a_date_is_refused
    sql: "SELECT LENGTH(dt) AS n FROM t WHERE id = 1"
  - id: length_of_two_arguments
    sql: "SELECT LENGTH('a', 'b') AS n"
    engine: sa
  - id: length_of_no_argument
    sql: "SELECT LEN() AS n"
    engine: sa

  # ---- SUBSTRING and SUBSTR under ANSI_SUBSTRING On: positions below 1 are virtual, a negative length is -1090
  - id: substring_virtual_positions
    sql: "SELECT SUBSTRING('mnopqrst', 0, 5) AS a, SUBSTRING('mnopqrst', -3, 5) AS b, SUBSTRING('mnopqrst', 1, 3) AS c, SUBSTRING('mnopqrst', 5, 10) AS d, SUBSTRING('mnopqrst', 9, 2) AS e, SUBSTRING('mnopqrst', 100, 1) AS f"
    engine: sa
  - id: substring_lengths
    sql: "SELECT SUBSTRING('mnopqrst', 1, 0) AS a, SUBSTRING('mnopqrst', -5, 3) AS b, SUBSTRING('mnopqrst', -10, 20) AS c, SUBSTRING('mnopqrst', 0, 0) AS d, SUBSTRING('mnopqrst', 0, 1) AS e, SUBSTRING('mnopqrst', 2, 100) AS f"
    engine: sa
  - id: substr_is_substring
    sql: "SELECT SUBSTR('mnopqrst', 0, 3) AS a, SUBSTR('mnopqrst', -1, 4) AS b, SUBSTR('mnopqrst', 3, 2) AS c"
    engine: sa
  - id: substring_without_a_length
    sql: "SELECT SUBSTRING('mnopqrst', 0) AS a, SUBSTRING('mnopqrst', -3) AS b, SUBSTRING('mnopqrst', 1) AS c, SUBSTR('mnopqrst', 3) AS d, SUBSTRING('mnopqrst', 8) AS e, SUBSTRING('mnopqrst', 9) AS f, SUBSTRING('mnopqrst', -100) AS g"
    engine: sa
  - id: substring_positions_of_columns
    sql: "SELECT id, SUBSTRING('mnopqrst', sm, id) AS a, SUBSTRING('mnopqrst', it, id) AS b, SUBSTRING('mnopqrst', id, 3) AS c FROM t ORDER BY id"
    decision: D-F18
    expect: '[["1","",null,"mno"],["2",null,null,"nop"],["3","mno","mno","opq"],["4","mnop","t","pqr"],["5",null,null,"qrs"],["6","","","rst"],["7","t","st","st"]]'
  - id: substring_lengths_of_columns
    sql: "SELECT id, SUBSTRING('mnopqrst', -1, id) AS a, SUBSTRING('mnopqrst', 3, id) AS b, SUBSTRING('mnopqrst', 0, id) AS c FROM t ORDER BY id"
    decision: D-F18
    expect: '[["1","t","o","m"],["2","t","op","mn"],["3","t","opq","mno"],["4","t","opqr","mnop"],["5","t","opqrs","mnopq"],["6","t","opqrst","mnopqr"],["7","t","opqrst","mnopqrs"]]'
  - id: substring_without_length_of_columns
    sql: "SELECT id, SUBSTR('abcdef', id) AS a, SUBSTR('abcdef', sm) AS b, SUBSTRING('abcdef', it) AS c FROM t ORDER BY id"
    decision: D-F18
    expect: '[["1","abcdef","",null],["2","bcdef",null,null],["3","cdef","abcdef","abcdef"],["4","def","abcdef","f"],["5","ef",null,null],["6","f","",""],["7","","f",""]]'
  - id: substring_negative_length
    sql: "SELECT SUBSTRING('mnopqrst', 3, -1) AS s"
    engine: sa
  - id: substring_negative_length_of_null
    sql: "SELECT SUBSTRING(NULL, 2, -1) AS s"
    engine: sa
  - id: substring_null_arguments
    sql: "SELECT SUBSTRING('abc', NULL, 1) AS a, SUBSTRING('abc', 1, NULL) AS b, SUBSTRING(NULL, 1, 1) AS c, SUBSTRING('abc', NULL) AS d"
    engine: sa
  - id: substring_of_an_integer
    sql: "SELECT SUBSTRING(12345, 2, 2) AS a, SUBSTR(-9876, 1, 2) AS b"
    engine: sa
  - id: substring_of_latin1_text
    sql: "SELECT SUBSTRING('Résumé', 2, 3) AS a, SUBSTR('ÉCOLE', 1, 1) AS b"
    engine: sa
  - id: substring_of_a_varchar
    sql: "SELECT id, SUBSTRING(vc, 2, 3) AS s FROM t ORDER BY id"
  - id: substring_of_a_char_is_of_its_padded_value
    sql: "SELECT id, SUBSTRING(ch, 2, 3) || '|' AS s FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","b  |"],["2","bc |"],["3","   |"],["4","z  |"],["5","|"],["6","   |"],["7","b  |"]]'
  - id: substring_by_a_smallint
    sql: "SELECT id, SUBSTRING(vc, 1, sm) AS s FROM t WHERE sm >= 0 ORDER BY id"
  - id: substring_from_an_integer_column
    sql: "SELECT id, SUBSTRING(vc, it, 2) AS s FROM t ORDER BY id"
    decision: D-F18
    expect: '[["1",null],["2",null],["3","Ré"],["4","E"],["5",null],["6",""],["7",""]]'
  - id: substring_from_an_integer_column_without_length
    sql: "SELECT id, SUBSTRING(vc, it) AS s FROM t ORDER BY id"
    decision: D-F18
    expect: '[["1",null],["2",null],["3","Résumé"],["4","E"],["5",null],["6",""],["7",""]]'
  - id: substring_negative_length_of_a_column
    sql: "SELECT id, SUBSTRING(vc, 1, sm) AS s FROM t ORDER BY id"
  - id: substring_in_where
    sql: "SELECT id FROM t WHERE SUBSTRING(vc, 1, 1) = 'h' ORDER BY id"
  - id: substring_in_sql_anywhere
    sql: "SELECT id, SUBSTRING(vc, -1, 4) AS s FROM t ORDER BY id"
    profile: sqla17-default
  - id: substring_by_a_bigint
    sql: "SELECT SUBSTRING(vc, bg, 1) AS s FROM t WHERE id = 3"
    decision: D-F18
    expect: '[["R"]]'
  - id: substring_by_a_rowgenerator_value
    sql: "SELECT row_num, LEFT('mnopqrst', row_num) AS s FROM sa_rowgenerator(0, 3)"
    engine: sa
  - id: substring_by_a_computed_position
    sql: "SELECT row_num, SUBSTRING('mnopqrst', row_num - 3, 4) AS s FROM sa_rowgenerator(0, 3)"
    engine: sa
  - id: substring_by_a_numeric_is_refused
    sql: "SELECT SUBSTRING('abcdef', 1, 2.5) AS s"
    engine: sa
  - id: substring_of_a_double_is_refused
    sql: "SELECT SUBSTRING(dbl, 1, 2) AS s FROM t WHERE id = 1"
  - id: substring_of_one_argument
    sql: "SELECT SUBSTRING('abc') AS s"
    engine: sa
  - id: substring_of_four_arguments
    sql: "SELECT SUBSTR('abc', 1, 1, 1) AS s"
    engine: sa
  - id: substring_ansi_from_for_is_rejected
    sql: "SELECT SUBSTRING('abc' FROM 1 FOR 2) AS s"
    engine: sa
  - id: substring_under_a_row_limit
    sql: "SELECT TOP 2 id, SUBSTRING(vc, 1, 2) AS s FROM t ORDER BY id"
  - id: substring_of_a_negative_length_under_a_row_limit
    sql: "SELECT TOP 2 id, SUBSTRING(vc, 1, sm) AS s FROM t ORDER BY id"

  # ---- LEFT and RIGHT: a negative count is '', a count past the end the whole string
  - id: left_right_counts
    sql: "SELECT LEFT('mnopqrst', -1) AS a, RIGHT('mnopqrst', -1) AS b, LEFT('mnopqrst', 0) AS c, RIGHT('mnopqrst', 2) AS d, LEFT('mnopqrst', 100) AS e, RIGHT('mnopqrst', 100) AS f"
    engine: sa
  - id: left_right_of_column_counts
    sql: "SELECT id, LEFT('abcdef', sm) AS l, RIGHT('abcdef', it) AS r, LEFT('abcdef', id) AS m, RIGHT('abcdef', id) AS n FROM t ORDER BY id"
  - id: left_right_of_a_varchar
    sql: "SELECT id, LEFT(vc, 2) AS l, RIGHT(vc, 2) AS r FROM t ORDER BY id"
  - id: left_right_of_integers
    sql: "SELECT LEFT(12345, 2) AS a, RIGHT(12345, 2) AS b, LEFT(-123, 2) AS c, RIGHT(-123, 4) AS d"
    engine: sa
  - id: left_right_of_null
    sql: "SELECT LEFT(NULL, 2) AS a, LEFT('abc', NULL) AS b, RIGHT(NULL, 1) AS c, RIGHT('abc', NULL) AS d"
    engine: sa
  - id: left_by_a_smallint
    sql: "SELECT id, LEFT(vc, sm) AS l, RIGHT(vc, sm) AS r FROM t ORDER BY id"
  - id: right_of_a_char_is_of_its_pad
    sql: "SELECT id, RIGHT(ch, 2) || '|' AS r, LEFT(ch, 1) AS l FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","  |","a"],["2","  |","a"],["3","  |","A"],["4","  |","z"],["5","|",null],["6","  |"," "],["7","  |"," "]]'
  - id: left_of_latin1_text
    sql: "SELECT LEFT('Résumé', 2) AS a, RIGHT('Résumé', 2) AS b"
    engine: sa
  - id: left_by_a_numeric_is_refused
    sql: "SELECT LEFT('abcdef', 2.9) AS l"
    engine: sa
  # IQ island, 2026-10-14 (M1e): answered now (IqDateTime), so renamed from left_of_a_date_is_refused
  - id: left_of_a_date
    sql: "SELECT LEFT(dt, 4) AS l FROM t WHERE id = 1"
  - id: left_in_sql_anywhere
    sql: "SELECT id, LEFT(vc, 3) AS l FROM t ORDER BY id"
    profile: sqla17-default

  # ---- TRIM, LTRIM and RTRIM: the space, tab, line feed, vertical tab, form feed and carriage return (no other); a set
  - id: trim_spaces
    sql: "SELECT '[' || TRIM('  a b  ') || ']' AS a, '[' || LTRIM('  a  ') || ']' AS b, '[' || RTRIM('  a  ') || ']' AS c, '[' || TRIM('') || ']' AS d, '[' || TRIM('   ') || ']' AS e, TRIM(NULL) AS f"
    engine: sa
  - id: trim_control_characters
    sql: "SELECT '[' || TRIM('\\x09a\\x09') || ']' AS a, '[' || TRIM('\\x0aa\\x0a') || ']' AS b, '[' || TRIM('\\x0ba\\x0c') || ']' AS c, '[' || TRIM('\\x0da\\x0d') || ']' AS d, '[' || TRIM(' \\x09 \\x0a a \\x0d ') || ']' AS e"
    engine: sa
  - id: trim_keeps_other_characters
    sql: "SELECT '[' || TRIM('\\xa0a\\xa0') || ']' AS a, '[' || TRIM('\\x1fa\\x1c') || ']' AS c, '[' || LTRIM('\\x7fa') || ']' AS d, '[' || RTRIM('a\\x01') || ']' AS e"
    engine: sa
  - id: ltrim_rtrim_controls
    sql: "SELECT '[' || LTRIM(' \\x09x\\x09 ') || ']' AS a, '[' || RTRIM(' \\x09x\\x0a\\x0b ') || ']' AS b"
    engine: sa
  - id: trim_of_a_set
    sql: "SELECT TRIM('abcab', 'ab') AS a, LTRIM('xyyxXwxy', 'xy') AS b, RTRIM('xxaxx', 'x') AS c, TRIM('aa', '') AS d, TRIM('  a  ', NULL) AS e, TRIM('[a]', '[]') AS f, LTRIM('-^-x', '^-') AS g"
    engine: sa
  - id: trim_of_a_set_of_controls
    sql: "SELECT '[' || TRIM('\\x0a\\x0ax\\x09\\x0a', '\\x0a') || ']' AS a, '[' || TRIM('\\x5cx\\x5c', '\\x5c') || ']' AS b"
    engine: sa
  - id: trim_of_a_varchar
    sql: "SELECT id, '[' || TRIM(vc) || ']' AS t, '[' || LTRIM(vc) || ']' AS l, '[' || RTRIM(vc) || ']' AS r FROM t ORDER BY id"
  - id: trim_of_a_char_drops_its_pad
    sql: "SELECT id, '[' || RTRIM(ch) || ']' AS r, '[' || TRIM(ch) || ']' AS t FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","[ab]","[ab]"],["2","[abc]","[abc]"],["3","[A]","[A]"],["4","[zz]","[zz]"],["5","[]","[]"],["6","[]","[]"],["7","[ b]","[b]"]]'
  - id: ltrim_of_a_char_keeps_its_pad
    sql: "SELECT id, '[' || LTRIM(ch) || ']' AS l FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","[ab   ]"],["2","[abc  ]"],["3","[A    ]"],["4","[zz   ]"],["5","[]"],["6","[]"],["7","[b   ]"]]'
  - id: trim_of_spaces_of_columns
    sql: "SELECT id, '[' || TRIM(SPACE(id) || 'x' || SPACE(id)) || ']' AS t, LENGTH(LTRIM(SPACE(id) || 'x')) AS l FROM t ORDER BY id"
  - id: trim_of_integers
    sql: "SELECT TRIM(123) AS a, LTRIM(-5) AS b"
    engine: sa
  - id: trim_of_a_set_of_a_column
    sql: "SELECT id, TRIM(vc, 'eH') AS s FROM t ORDER BY id"
  # IQ island, 2026-10-14 (natives): answers now (was trim_in_sql_anywhere_is_refused)
  - id: trim_in_sql_anywhere
    sql: "SELECT TRIM(vc) AS s FROM t WHERE id = 1"
    profile: sqla17-default
  - id: trim_of_a_set_not_constant_is_refused
    sql: "SELECT TRIM(vc, vc) AS s FROM t WHERE id = 1"
  - id: trim_ansi_form_is_rejected
    sql: "SELECT TRIM(BOTH ' ' FROM ' a ') AS s"
    engine: sa
  - id: trim_of_three_arguments
    sql: "SELECT TRIM('a', 'b', 'c') AS s"
    engine: sa

  # ---- REPLACE: every occurrence, left to right, case-sensitively; '' searched is no change; a search of 255 or more NULL
  - id: replace_constants
    sql: "SELECT REPLACE('abcABCabc', 'b', 'X') AS a, REPLACE('abc', '', 'X') AS b, REPLACE('abcabc', 'b', '') AS c, REPLACE('aaa', 'aa', 'b') AS d, REPLACE('a.b', '.', '..') AS e, REPLACE('Résumé', 'é', 'e') AS f"
    engine: sa
  - id: replace_is_case_sensitive
    sql: "SELECT REPLACE('abc', 'B', 'X') AS a, REPLACE('ABC', 'b', 'X') AS b"
    engine: sa
  - id: replace_of_null
    sql: "SELECT REPLACE(NULL, 'a', 'b') AS a, REPLACE('a', NULL, 'b') AS b, REPLACE('a', 'a', NULL) AS c"
    engine: sa
  - id: replace_of_integers
    sql: "SELECT REPLACE(123123, 2, 9) AS a, REPLACE('a1b1', 1, '-') AS b"
    engine: sa
  - id: replace_search_of_254
    sql: "SELECT LENGTH(REPLACE(REPEAT('a', 300), REPEAT('a', 254), 'X')) AS a"
    engine: sa
  - id: replace_search_of_255_is_null
    sql: "SELECT REPLACE(REPEAT('a', 300), REPEAT('a', 255), 'X') AS a, REPLACE('abc', REPEAT('a', 256), 'X') AS b"
    engine: sa
  - id: replace_of_repeats
    sql: "SELECT id, REPLACE(REPEAT('ab', id), 'ba', '-') AS r FROM t ORDER BY id"
  - id: replace_of_a_varchar
    sql: "SELECT id, REPLACE(vc, 'l', 'L') AS r, REPLACE(vc, ' ', '_') AS s FROM t ORDER BY id"
  - id: replace_of_a_char_shows_its_pad
    sql: "SELECT id, REPLACE(ch, ' ', '_') AS r FROM t ORDER BY id"
    decision: D-S1
    expect: '[["1","ab___"],["2","abc__"],["3","A____"],["4","zz___"],["5",null],["6","_____"],["7","_b___"]]'
  - id: replace_with_a_column_search
    sql: "SELECT id, REPLACE('Hello hello', vc, '*') AS r FROM t ORDER BY id"
  # IQ island, 2026-10-14 (natives): answers now (was replace_in_sql_anywhere_is_refused)
  - id: replace_without_case_in_sql_anywhere
    sql: "SELECT REPLACE(vc, 'l', 'L') AS r FROM t WHERE id = 1"
    profile: sqla17-default
  - id: replace_of_two_arguments
    sql: "SELECT REPLACE('abc', 'b') AS r"
    engine: sa

  # ---- REPEAT, REPLICATE and SPACE: n copies, '' for n of 0 or less
  - id: repeat_counts
    sql: "SELECT REPEAT('ab', 3) AS a, REPEAT('ab', 0) AS b, REPEAT('ab', -1) AS c, REPEAT('', 5) AS d, REPEAT(NULL, 2) AS e, REPEAT('a', NULL) AS f, REPLICATE('xy', 2) AS g"
    engine: sa
  - id: space_counts
    sql: "SELECT '[' || SPACE(3) || ']' AS a, '[' || SPACE(-1) || ']' AS b, '[' || SPACE(0) || ']' AS c, SPACE(NULL) AS d"
    engine: sa
  - id: repeat_of_column_counts
    sql: "SELECT id, REPEAT('ab', sm) AS r, '[' || SPACE(id) || ']' AS s FROM t WHERE id <> 1 ORDER BY id"
  - id: repeat_of_an_integer
    sql: "SELECT REPEAT(12, 2) AS a, REPLICATE(-1, 3) AS b"
    engine: sa
  - id: repeat_of_columns
    sql: "SELECT id, REPEAT(vc, 2) AS r FROM t WHERE id IN (1, 6) ORDER BY id"
  - id: repeat_by_a_smallint
    sql: "SELECT id, LENGTH(REPEAT('x', sm)) AS n FROM t WHERE id <> 1 ORDER BY id"
  - id: repeat_by_a_numeric_is_refused
    sql: "SELECT REPEAT('ab', 1.7) AS r"
    engine: sa

  # ---- CHARINDEX and LOCATE: from 1, 0 when not found, '' found at 1; LOCATE's start (negative: the last occurrence)
  - id: charindex_constants
    sql: "SELECT CHARINDEX('b', 'abcb') AS a, CHARINDEX('', 'abc') AS b, CHARINDEX('x', 'abc') AS c, CHARINDEX('', '') AS d, CHARINDEX('abc', 'ab') AS e, CHARINDEX('é', 'Résumé') AS f"
    engine: sa
  - id: charindex_is_case_sensitive
    sql: "SELECT CHARINDEX('B', 'abc') AS a, CHARINDEX('b', 'ABC') AS b"
    engine: sa
  - id: charindex_of_null
    sql: "SELECT CHARINDEX(NULL, 'abc') AS a, CHARINDEX('b', NULL) AS b"
    engine: sa
  - id: charindex_of_integers
    sql: "SELECT CHARINDEX(2, 12345) AS a, CHARINDEX('-', -5) AS b"
    engine: sa
  - id: charindex_search_of_254_and_255
    sql: "SELECT CHARINDEX(REPEAT('a', 254), REPEAT('a', 300)) AS a, CHARINDEX(REPEAT('a', 255), REPEAT('a', 300)) AS b, CHARINDEX(REPEAT('a', 256), 'a') AS c"
    engine: sa
  - id: charindex_of_three_arguments
    sql: "SELECT CHARINDEX('b', 'abc', 1) AS c"
    engine: sa
  - id: charindex_over_columns
    sql: "SELECT id, CHARINDEX('l', vc) AS a, CHARINDEX(vc, 'Hello hello') AS b FROM t ORDER BY id"
  - id: locate_two_arguments
    sql: "SELECT LOCATE('abcabc', 'b') AS a, LOCATE('abcabc', 'x') AS b, LOCATE('abcabc', '') AS c, LOCATE(NULL, 'b') AS d, LOCATE('abc', NULL) AS e"
    engine: sa
  - id: locate_from_column_starts
    sql: "SELECT id, LOCATE('abcabc', 'b', sm) AS a, LOCATE('abcabc', 'bc', it) AS b, LOCATE('abcabc', '', sm) AS c, LOCATE('abcabc', 'c', id) AS d FROM t ORDER BY id"
  - id: locate_negative_starts
    sql: "SELECT LOCATE('abcabc', 'b', -2) AS a, LOCATE('abcabc', 'bc', -2) AS b, LOCATE('abcabc', 'b', -3) AS c, LOCATE('abcabc', 'b', -4) AS d, LOCATE('abcabc', 'b', -6) AS e, LOCATE('abcabc', 'b', -7) AS f, LOCATE('abcabc', 'b', -100) AS g, LOCATE('abcabc', 'b', 0) AS h"
    engine: sa
  - id: locate_last_occurrences
    sql: "SELECT LOCATE('xyz', 'z', -1) AS a, LOCATE('xyz', 'xyz', -1) AS b, LOCATE('xyz', 'xyzw', -1) AS c, LOCATE('', 'a', 1) AS d, LOCATE('', '', -1) AS e, LOCATE('aaa', 'aa', -1) AS f, LOCATE('aaa', 'aa', 2) AS g"
    engine: sa
  - id: locate_of_a_null_start
    sql: "SELECT LOCATE('abc', 'b', NULL) AS a"
    engine: sa
  - id: locate_search_of_255
    sql: "SELECT LOCATE(REPEAT('a', 300), REPEAT('a', 254)) AS a, LOCATE(REPEAT('a', 300), REPEAT('a', 255)) AS b, LOCATE(REPEAT('a', 300), REPEAT('a', 255), -1) AS c"
    engine: sa
  - id: locate_over_columns
    sql: "SELECT id, LOCATE(vc, 'l') AS a, LOCATE(vc, 'l', -1) AS b, LOCATE(vc, 'l', 4) AS c FROM t ORDER BY id"
  - id: locate_by_a_smallint_start
    sql: "SELECT id, LOCATE('abcabcabc', 'c', sm) AS a FROM t ORDER BY id"
  # IQ island, 2026-10-14 (natives): answers now (was locate_in_sql_anywhere_is_refused)
  - id: locate_without_case_in_sql_anywhere
    sql: "SELECT LOCATE(vc, 'l') AS a FROM t WHERE id = 1"
    profile: sqla17-default

