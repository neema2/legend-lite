    profile: iq17-default
  - id: datediff_seconds_and_milliseconds_elapsed
    sql: "SELECT DATEDIFF(second, CAST('2026-03-04 05:06:06.5' AS TIMESTAMP), CAST('2026-03-04 05:06:08.4' AS TIMESTAMP)) AS a, DATEDIFF(millisecond, CAST('2026-03-04 05:06:06.0009' AS TIMESTAMP), CAST('2026-03-04 05:06:06.0021' AS TIMESTAMP)) AS b FROM t WHERE id = 1"
    profile: iq17-default
