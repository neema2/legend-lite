# The IQ scale program's realistic reports (2026-10-25): analyst_patterns, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: order_month_streaks
    sql: "WITH months AS (SELECT DISTINCT customer_id, DATEDIFF(MONTH, CAST('2023-01-01' AS DATE), CAST(order_ts AS DATE)) AS m FROM orders WHERE status <> 'cancelled'), islands AS (SELECT customer_id, m, m - ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY m) AS grp FROM months) SELECT customer_id, MIN(m) AS first_month, MAX(m) AS last_month, COUNT(*) AS streak_months, DATEADD(MONTH, MIN(m), CAST('2023-01-01' AS DATE)) AS streak_start FROM islands GROUP BY customer_id, grp HAVING COUNT(*) >= 2 ORDER BY streak_months DESC, customer_id, first_month"
    profile: iq17-default
  - id: web_sessions_at_a_30_minute_gap
    sql: "WITH ev AS (SELECT id, customer_id, event_ts, url, CASE WHEN LAG(event_ts) OVER (PARTITION BY customer_id ORDER BY event_ts, id) IS NULL OR DATEDIFF(MINUTE, LAG(event_ts) OVER (PARTITION BY customer_id ORDER BY event_ts, id), event_ts) > 30 THEN 1 ELSE 0 END AS new_session FROM web_events WHERE customer_id IS NOT NULL), s AS (SELECT id, customer_id, event_ts, url, SUM(new_session) OVER (PARTITION BY customer_id ORDER BY event_ts, id ROWS UNBOUNDED PRECEDING) AS session_no FROM ev) SELECT customer_id, session_no, COUNT(*) AS events, MIN(event_ts) AS started, MAX(event_ts) AS ended, DATEDIFF(MINUTE, MIN(event_ts), MAX(event_ts)) AS minutes, SUM(CASE WHEN url LIKE '%/checkout%' THEN 1 ELSE 0 END) AS checkout_hits FROM s GROUP BY customer_id, session_no ORDER BY customer_id, session_no"
    profile: iq17-default
  - id: market_basket_pairs
    sql: "WITH baskets AS (SELECT DISTINCT oi.order_id, oi.product_id FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled'), singles AS (SELECT product_id, COUNT(*) AS orders FROM baskets GROUP BY product_id), total AS (SELECT COUNT(DISTINCT order_id) AS n FROM baskets) SELECT a.product_id AS product_a, b.product_id AS product_b, COUNT(*) AS together, CAST(ROUND(100.0 * COUNT(*) / MAX(t.n), 2) AS NUMERIC(6,2)) AS support_pct, CAST(ROUND(100.0 * COUNT(*) / MAX(sa.orders), 2) AS NUMERIC(6,2)) AS confidence_a_to_b, CAST(ROUND(1.0 * COUNT(*) * MAX(t.n) / (MAX(sa.orders) * MAX(sb.orders)), 3) AS NUMERIC(8,3)) AS lift FROM baskets a JOIN baskets b ON b.order_id = a.order_id AND b.product_id > a.product_id JOIN singles sa ON sa.product_id = a.product_id JOIN singles sb ON sb.product_id = b.product_id CROSS JOIN total t GROUP BY a.product_id, b.product_id HAVING COUNT(*) >= 2 ORDER BY together DESC, product_a, product_b"
    profile: iq17-default
  - id: payments_in_euros_at_the_days_rate
    sql: "SELECT p.id, p.paid_ts, p.amount AS usd, (SELECT r.usd_rate FROM exchange_rates r WHERE r.currency = 'EUR' AND r.rate_date = (SELECT MAX(r2.rate_date) FROM exchange_rates r2 WHERE r2.currency = 'EUR' AND r2.rate_date <= CAST(p.paid_ts AS DATE))) AS eur_rate, CAST(ROUND(p.amount / (SELECT r.usd_rate FROM exchange_rates r WHERE r.currency = 'EUR' AND r.rate_date = (SELECT MAX(r2.rate_date) FROM exchange_rates r2 WHERE r2.currency = 'EUR' AND r2.rate_date <= CAST(p.paid_ts AS DATE))), 2) AS NUMERIC(12,2)) AS eur FROM payments p WHERE p.paid_ts >= '2025-01-01' ORDER BY p.id"
    profile: iq17-default
  - id: monthly_receipts_in_pounds_by_an_as_of_join
    sql: "WITH rated AS (SELECT p.id, p.paid_ts, p.amount, MAX(r.rate_date) AS rate_date FROM payments p JOIN exchange_rates r ON r.currency = 'GBP' AND r.rate_date <= CAST(p.paid_ts AS DATE) GROUP BY p.id, p.paid_ts, p.amount) SELECT DATEFORMAT(x.paid_ts, 'yyyy-mm') AS ym, COUNT(*) AS payments, SUM(x.amount) AS usd, CAST(SUM(x.amount / r.usd_rate) AS NUMERIC(12,2)) AS gbp, MIN(r.usd_rate) AS lowest_rate, MAX(r.usd_rate) AS highest_rate FROM rated x JOIN exchange_rates r ON r.currency = 'GBP' AND r.rate_date = x.rate_date GROUP BY DATEFORMAT(x.paid_ts, 'yyyy-mm') ORDER BY ym"
    profile: iq17-default
  - id: promotion_window_sales
    sql: "SELECT pr.code, COALESCE(pr.category, 'all') AS category, pr.starts, pr.ends, DATEDIFF(DAY, pr.starts, pr.ends) + 1 AS days, COUNT(DISTINCT o.id) AS orders, SUM(CASE WHEN pr.category IS NULL OR p.category = pr.category THEN oi.quantity * oi.unit_price ELSE 0 END) AS promo_gross, CAST(ROUND(COALESCE(SUM(CASE WHEN pr.category IS NULL OR p.category = pr.category THEN oi.quantity * oi.unit_price END), 0) / (DATEDIFF(DAY, pr.starts, pr.ends) + 1), 2) AS NUMERIC(10,2)) AS promo_gross_per_day FROM promotions pr LEFT JOIN orders o ON CAST(o.order_ts AS DATE) BETWEEN pr.starts AND pr.ends AND o.status <> 'cancelled' LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON p.id = oi.product_id GROUP BY pr.code, pr.category, pr.starts, pr.ends ORDER BY pr.starts, pr.code"
    profile: iq17-default
  - id: latest_stock_per_product
    sql: "WITH snaps AS (SELECT i.product_id, i.snapshot_date, i.on_hand, i.reorder_point, ROW_NUMBER() OVER (PARTITION BY i.product_id ORDER BY i.snapshot_date DESC, i.id DESC) AS rn, LEAD(i.on_hand) OVER (PARTITION BY i.product_id ORDER BY i.snapshot_date DESC, i.id DESC) AS prior_on_hand FROM inventory i) SELECT p.id, p.sku, p.name, s.snapshot_date, s.on_hand, s.prior_on_hand, s.on_hand - s.prior_on_hand AS change, CASE WHEN s.on_hand <= s.reorder_point THEN 'reorder' WHEN s.on_hand <= 2 * s.reorder_point THEN 'watch' ELSE 'ok' END AS stock_status FROM products p JOIN snaps s ON s.product_id = p.id AND s.rn = 1 ORDER BY p.id"
    profile: iq17-default
  - id: month_over_month_retention
    sql: "WITH active AS (SELECT DISTINCT customer_id, YEAR(order_ts) AS y, MONTH(order_ts) AS mo, YEAR(order_ts) * 12 + MONTH(order_ts) AS mi FROM orders WHERE status <> 'cancelled') SELECT a.y, a.mo, COUNT(*) AS active_customers, COUNT(b.customer_id) AS retained_next_month, CAST(ROUND(100.0 * COUNT(b.customer_id) / COUNT(*), 1) AS NUMERIC(5,1)) AS retention_pct FROM active a LEFT JOIN active b ON b.customer_id = a.customer_id AND b.mi = a.mi + 1 GROUP BY a.y, a.mo, a.mi ORDER BY a.mi"
    profile: iq17-default
  - id: top_three_products_per_category
    sql: "WITH rev AS (SELECT p.category, p.id, p.name, SUM(oi.quantity * oi.unit_price) AS revenue FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.category, p.id, p.name), ranked AS (SELECT category, id, name, revenue, DENSE_RANK() OVER (PARTITION BY category ORDER BY revenue DESC) AS dr, CAST(ROUND(100 * revenue / SUM(revenue) OVER (PARTITION BY category), 1) AS NUMERIC(5,1)) AS category_share, FIRST_VALUE(name) OVER (PARTITION BY category ORDER BY revenue DESC, id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS leader FROM rev) SELECT category, dr, id, name, revenue, category_share, leader FROM ranked WHERE dr <= 3 ORDER BY category, dr, id"
    profile: iq17-default
  - id: channel_order_value_spread
    sql: "SELECT o.channel, COUNT(*) AS orders, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY t.total) AS median_total, PERCENTILE_DISC(0.9) WITHIN GROUP (ORDER BY t.total) AS p90_total, CAST(AVG(t.total) AS NUMERIC(10,2)) AS mean_total, CAST(STDDEV_SAMP(t.total) AS NUMERIC(10,2)) AS sd_total, CAST(VAR_POP(t.items) AS NUMERIC(8,3)) AS var_items FROM orders o JOIN (SELECT order_id, SUM(quantity * unit_price) AS total, SUM(quantity) AS items FROM order_items GROUP BY order_id) t ON t.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.channel ORDER BY o.channel"
    profile: iq17-default
  - id: ticket_sla_in_hours_and_minutes
    sql: "SELECT t.priority, COUNT(*) AS tickets, SUM(CASE WHEN t.closed_ts IS NULL THEN 1 ELSE 0 END) AS still_open, CAST(AVG(HOURS(t.opened_ts, t.closed_ts)) AS NUMERIC(8,1)) AS avg_hours, MAX(MINUTES(t.opened_ts, t.closed_ts)) AS longest_minutes, SUM(CASE WHEN HOURS(t.opened_ts, t.closed_ts) <= CASE t.priority WHEN 'urgent' THEN 4 WHEN 'high' THEN 24 ELSE 72 END THEN 1 ELSE 0 END) AS within_sla, MEDIAN(HOURS(t.opened_ts, t.closed_ts)) AS median_hours FROM support_tickets t GROUP BY t.priority ORDER BY MIN(CASE t.priority WHEN 'urgent' THEN 1 WHEN 'high' THEN 2 WHEN 'normal' THEN 3 ELSE 4 END)"
    profile: iq17-default
  - id: active_customers_page_two
    sql: "SELECT TOP 5 START AT 6 c.id, c.last_name || ', ' || c.first_name AS customer, c.city, c.segment, c.credit_limit FROM customers c WHERE c.is_active = 1 ORDER BY c.last_name, c.first_name, c.id"
    profile: iq17-default
