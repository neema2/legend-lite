# The IQ scale program's realistic reports (2026-10-25): whole_operations, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: reorder_plan_with_suppliers
    sql: "WITH latest AS (SELECT product_id, on_hand, reorder_point, snapshot_date, ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY snapshot_date DESC, id) AS rn FROM inventory), demand AS (SELECT oi.product_id, SUM(oi.quantity) AS units_90d FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE o.order_ts >= '2025-10-03' AND o.order_ts < '2026-01-01' AND o.status <> 'cancelled' GROUP BY oi.product_id), best AS (SELECT sp.product_id, sp.supplier_id, sp.lead_days, sp.unit_cost, sp.min_order, ROW_NUMBER() OVER (PARTITION BY sp.product_id ORDER BY sp.unit_cost, sp.lead_days, sp.id) AS rn FROM supplier_products sp) SELECT p.id, p.sku, l.snapshot_date, l.on_hand, l.reorder_point, COALESCE(d.units_90d, 0) AS units_90d, CAST(ROUND(COALESCE(d.units_90d, 0) / 90.0, 3) AS NUMERIC(8,3)) AS daily_rate, CAST(l.on_hand * 90.0 / NULLIF(d.units_90d, 0) AS NUMERIC(9,1)) AS days_of_cover, TRIM(s.name) AS supplier, b.lead_days, b.unit_cost, CASE WHEN l.on_hand > l.reorder_point THEN 0 WHEN COALESCE(b.min_order, 1) > 2 * l.reorder_point - l.on_hand THEN COALESCE(b.min_order, 1) ELSE 2 * l.reorder_point - l.on_hand END AS order_qty FROM products p JOIN latest l ON l.product_id = p.id AND l.rn = 1 LEFT JOIN demand d ON d.product_id = p.id LEFT JOIN best b ON b.product_id = p.id AND b.rn = 1 LEFT JOIN suppliers s ON s.id = b.supplier_id ORDER BY p.id"
    profile: iq17-default
  - id: last_touch_attribution
    sql: "WITH touches AS (SELECT o.id AS order_id, o.customer_id, o.order_ts, (SELECT MAX(w.event_ts) FROM web_events w WHERE w.customer_id = o.customer_id AND w.event_ts <= o.order_ts AND w.event_ts > DATEADD(DAY, -7, o.order_ts)) AS last_touch FROM orders o WHERE o.status <> 'cancelled'), attributed AS (SELECT t.order_id, t.order_ts, t.last_touch, CASE WHEN t.last_touch IS NULL THEN '(direct)' WHEN LOCATE(w.url, 'utm_source=') > 0 THEN SUBSTR(w.url || '&', LOCATE(w.url, 'utm_source=') + 11, LOCATE(w.url || '&', '&', LOCATE(w.url, 'utm_source=')) - LOCATE(w.url, 'utm_source=') - 11) WHEN w.referrer IS NOT NULL THEN 'referral' ELSE '(none)' END AS source FROM touches t LEFT JOIN web_events w ON w.customer_id = t.customer_id AND w.event_ts = t.last_touch) SELECT a.source, COUNT(*) AS orders, SUM(x.gross) AS revenue, CAST(ROUND(AVG(DATEDIFF(MINUTE, a.last_touch, a.order_ts) / 60.0), 1) AS NUMERIC(8,1)) AS avg_hours_to_convert FROM attributed a JOIN (SELECT order_id, SUM(quantity * unit_price) AS gross FROM order_items GROUP BY order_id) x ON x.order_id = a.order_id GROUP BY a.source ORDER BY orders DESC, a.source"
    profile: iq17-default
  - id: cohort_revenue_triangle
    sql: "WITH firsts AS (SELECT customer_id, MIN(order_ts) AS first_ts FROM orders WHERE status <> 'cancelled' GROUP BY customer_id), rev AS (SELECT o.customer_id, DATEDIFF(MONTH, f.first_ts, o.order_ts) AS age_m, SUM(oi.quantity * oi.unit_price) AS gross FROM orders o JOIN firsts f ON f.customer_id = o.customer_id JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id, DATEDIFF(MONTH, f.first_ts, o.order_ts)) SELECT YEAR(f.first_ts) || '-Q' || QUARTER(f.first_ts) AS cohort, COUNT(DISTINCT f.customer_id) AS customers, SUM(CASE WHEN r.age_m = 0 THEN r.gross ELSE 0 END) AS m0, SUM(CASE WHEN r.age_m = 1 THEN r.gross ELSE 0 END) AS m1, SUM(CASE WHEN r.age_m = 2 THEN r.gross ELSE 0 END) AS m2, SUM(CASE WHEN r.age_m BETWEEN 3 AND 5 THEN r.gross ELSE 0 END) AS m3_to_5, SUM(CASE WHEN r.age_m >= 6 THEN r.gross ELSE 0 END) AS m6_plus, SUM(r.gross) AS total FROM firsts f JOIN rev r ON r.customer_id = f.customer_id GROUP BY YEAR(f.first_ts) || '-Q' || QUARTER(f.first_ts) ORDER BY cohort"
    profile: iq17-default
  - id: unified_activity_timeline
    sql: "SELECT customer_id, ts, kind, ref_id, detail, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY ts, kind, ref_id) AS seq, DATEDIFF(HOUR, LAG(ts) OVER (PARTITION BY customer_id ORDER BY ts, kind, ref_id), ts) AS hours_since_previous FROM (SELECT o.customer_id, o.order_ts AS ts, 'order' AS kind, o.id AS ref_id, o.channel || ' ' || o.status AS detail FROM orders o UNION ALL SELECT o.customer_id, p.paid_ts, 'payment', p.id, p.method || ' ' || CAST(p.amount AS VARCHAR(12)) FROM payments p JOIN orders o ON o.id = p.order_id UNION ALL SELECT t.customer_id, t.opened_ts, 'ticket', t.id, t.priority || ': ' || LEFT(t.subject, 30) FROM support_tickets t UNION ALL SELECT w.customer_id, w.event_ts, 'web', w.id, w.device FROM web_events w WHERE w.customer_id IS NOT NULL) x WHERE customer_id IN (3, 7, 12) ORDER BY customer_id, ts, kind, ref_id"
    profile: iq17-default
  - id: price_change_audit
    sql: "WITH sold AS (SELECT oi.product_id, o.order_ts, oi.id AS line_id, oi.unit_price, LAG(oi.unit_price) OVER (PARTITION BY oi.product_id ORDER BY o.order_ts, oi.id) AS prev_price FROM order_items oi JOIN orders o ON o.id = oi.order_id) SELECT p.id, p.name, p.unit_price AS list_price, COUNT(*) AS lines, SUM(CASE WHEN s.prev_price IS NOT NULL AND s.unit_price <> s.prev_price THEN 1 ELSE 0 END) AS price_changes, MIN(s.unit_price) AS lowest, MAX(s.unit_price) AS highest, CAST(ROUND(100 * (p.unit_price - MIN(s.unit_price)) / p.unit_price, 1) AS NUMERIC(5,1)) AS deepest_cut_pct, MAX(CASE WHEN s.unit_price < p.unit_price THEN s.order_ts END) AS last_below_list FROM products p JOIN sold s ON s.product_id = p.id GROUP BY p.id, p.name, p.unit_price ORDER BY price_changes DESC, p.id"
    profile: iq17-default
