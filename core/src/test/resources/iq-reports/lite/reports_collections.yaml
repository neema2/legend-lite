# The IQ scale program's realistic reports (2026-10-25): collections, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: days_sales_outstanding_by_quarter
    sql: "WITH invoiced AS (SELECT o.id, o.order_ts, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS amount FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.id, o.order_ts), settled AS (SELECT order_id, MAX(paid_ts) AS paid_in_full, SUM(amount) AS paid FROM payments GROUP BY order_id) SELECT YEAR(i.order_ts) AS yr, QUARTER(i.order_ts) AS qtr, COUNT(*) AS invoices, ROUND(AVG(DATEDIFF(DAY, i.order_ts, s.paid_in_full) * 1.0), 1) AS avg_days_to_pay, MAX(DATEDIFF(DAY, i.order_ts, s.paid_in_full)) AS slowest FROM invoiced i JOIN settled s ON s.order_id = i.id GROUP BY YEAR(i.order_ts), QUARTER(i.order_ts) ORDER BY yr, qtr"
    profile: iq17-default
  - id: collection_curve
    sql: "SELECT CASE WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 1 THEN '0-1 days' WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 7 THEN '2-7 days' WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 30 THEN '8-30 days' ELSE 'over 30 days' END AS paid_within, COUNT(*) AS payments, SUM(p.amount) AS collected, SUM(SUM(p.amount)) OVER (ORDER BY MIN(DATEDIFF(DAY, o.order_ts, p.paid_ts))) AS cumulative FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY CASE WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 1 THEN '0-1 days' WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 7 THEN '2-7 days' WHEN DATEDIFF(DAY, o.order_ts, p.paid_ts) <= 30 THEN '8-30 days' ELSE 'over 30 days' END ORDER BY MIN(DATEDIFF(DAY, o.order_ts, p.paid_ts))"
    profile: iq17-default
  - id: formatted_invoice_lines
    sql: "SELECT o.id, 'INV' || RIGHT(REPEAT('0', 6) || CAST(o.id AS VARCHAR(6)), 6) AS invoice, '$' || CAST(CAST(SUM(oi.quantity * oi.unit_price - oi.line_discount) AS NUMERIC(12,2)) AS VARCHAR(20)) AS amount_text, CAST(CAST(o.discount_pct * 100 AS INTEGER) AS VARCHAR(3)) || '%' AS discount_text, UPPER(LEFT(o.status, 1)) || SUBSTRING(o.status, 2) || ' / ' || o.channel AS status_text FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.id <= 25 GROUP BY o.id, o.discount_pct, o.status, o.channel ORDER BY o.id"
    profile: iq17-default
  - id: payment_method_mix_by_segment
    sql: "SELECT c.segment, SUM(CASE WHEN p.method = 'card' THEN p.amount ELSE 0 END) AS card, SUM(CASE WHEN p.method = 'paypal' THEN p.amount ELSE 0 END) AS paypal, SUM(CASE WHEN p.method = 'invoice' THEN p.amount ELSE 0 END) AS invoice, SUM(p.amount) AS total FROM payments p JOIN orders o ON o.id = p.order_id JOIN customers c ON c.id = o.customer_id GROUP BY c.segment ORDER BY c.segment"
    profile: iq17-default
