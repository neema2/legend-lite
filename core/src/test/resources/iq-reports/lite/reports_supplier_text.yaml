# The IQ scale program's realistic reports (2026-10-25): supplier_text, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: suppliers_sorted_by_name
    sql: "SELECT id, name, country FROM suppliers ORDER BY name, id"
    profile: iq17-default
  - id: names_in_characters_and_bytes
    sql: "SELECT id, name, LENGTH(name) AS characters, BYTE_LENGTH(name) AS bytes, BYTE_LENGTH(name) - LENGTH(name) AS extra_bytes, LENGTH(TRIM(name)) AS trimmed FROM suppliers ORDER BY id"
    profile: iq17-default
  - id: folded_names
    sql: "SELECT id, name, UPPER(name) AS upper_name, LOWER(name) AS lower_name, UPPER(LEFT(TRIM(name), 1)) AS first_letter FROM suppliers ORDER BY id"
    profile: iq17-default
  - id: accented_text_searches
    sql: "SELECT id, name, city, CASE WHEN name LIKE '%ü%' OR city LIKE '%ü%' THEN 'umlaut' ELSE '' END AS has_umlaut, LOCATE(name, 'ö') AS o_umlaut_at, LOCATE(city, 'ó') AS o_acute_at, CASE WHEN name LIKE 'Caf_ Cr_me' THEN 'cafe creme' ELSE '' END AS cafe_spelling FROM suppliers ORDER BY id"
    profile: iq17-default
  - id: cut_by_characters
    sql: "SELECT id, LEFT(TRIM(name), 3) AS first_three, RIGHT(TRIM(name), 4) AS last_four, SUBSTRING(city, 2, 3) AS city_middle, LEFT(contact, LOCATE(contact, ' ') - 1) AS contact_first_name FROM suppliers WHERE contact IS NOT NULL ORDER BY id"
    profile: iq17-default
  - id: duplicate_suppliers_by_folded_name
    sql: "SELECT LOWER(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(TRIM(name), 'ä', 'ae'), 'ö', 'oe'), 'ü', 'ue'), 'ß', 'ss'), 'é', 'e'), 'è', 'e'), 'ç', 'c')) AS name_key, COUNT(*) AS suppliers, LIST(CAST(id AS VARCHAR(3)), ',' ORDER BY id) AS ids, MIN(since) AS first_since FROM suppliers GROUP BY LOWER(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(TRIM(name), 'ä', 'ae'), 'ö', 'oe'), 'ü', 'ue'), 'ß', 'ss'), 'é', 'e'), 'è', 'e'), 'ç', 'c')) HAVING COUNT(*) > 1 ORDER BY name_key"
    profile: iq17-default
  - id: fixed_width_supplier_list
    sql: "SELECT id, LEFT(TRIM(name) || REPEAT('.', 30), 30) || ' ' || RIGHT(REPEAT(' ', 12) || COALESCE(country, '?'), 12) || ' ' || COALESCE(CAST(rating AS VARCHAR(4)), ' n/a') AS line FROM suppliers ORDER BY id"
    profile: iq17-default
  - id: contact_initials_and_email_domains
    sql: "SELECT id, contact, UPPER(LEFT(contact, 1)) || UPPER(SUBSTRING(contact, LOCATE(contact, ' ') + 1, 1)) AS initials, LOWER(SUBSTRING(email, LOCATE(email, '@') + 1)) AS domain, RIGHT(LOWER(email), LOCATE(REVERSE(email), '.') - 1) AS tld FROM suppliers WHERE contact IS NOT NULL AND email IS NOT NULL ORDER BY id"
    profile: iq17-default
  - id: phone_digits_and_country_codes
    sql: "SELECT id, phone, REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(phone, '+', ''), ' ', ''), '(', ''), ')', ''), '-', ''), '.', '') AS digits, CASE WHEN phone LIKE '+%' THEN SUBSTRING(phone, 2, LOCATE(phone, ' ') - 2) ELSE '1' END AS country_code FROM suppliers WHERE phone IS NOT NULL ORDER BY id"
    profile: iq17-default
  - id: suppliers_per_country_listed
    sql: "SELECT country, COUNT(*) AS suppliers, LIST(TRIM(name), '; ' ORDER BY id) AS names, ROUND(AVG(rating), 2) AS avg_rating, MIN(since) AS longest_since FROM suppliers GROUP BY country ORDER BY suppliers DESC, country"
    profile: iq17-default
