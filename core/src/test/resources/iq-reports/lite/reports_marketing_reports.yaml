# The IQ scale program's realistic reports (2026-10-25): marketing_reports, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: rfm_segments
    sql: "WITH base AS ( SELECT o.customer_id, MAX(CAST(o.order_ts AS DATE)) AS last_order, COUNT(*) AS orders, SUM(oi.quantity * oi.unit_price) AS spent FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id), scored AS ( SELECT customer_id, last_order, orders, spent, NTILE(3) OVER (ORDER BY last_order, customer_id) AS r, NTILE(3) OVER (ORDER BY orders, customer_id) AS f, NTILE(3) OVER (ORDER BY spent, customer_id) AS m FROM base) SELECT customer_id, r, f, m, CAST(r AS VARCHAR(1)) || CAST(f AS VARCHAR(1)) || CAST(m AS VARCHAR(1)) AS rfm, CASE WHEN r = 3 AND f = 3 AND m = 3 THEN 'champion' WHEN r = 3 AND f >= 2 THEN 'loyal' WHEN r = 1 AND m = 3 THEN 'at risk' WHEN r = 1 THEN 'lapsed' ELSE 'regular' END AS segment FROM scored ORDER BY customer_id"
    profile: iq17-default
  - id: utm_sources_of_first_events
    sql: "WITH landing AS ( SELECT w.id, w.customer_id, w.device, LOWER(w.url) AS url FROM web_events w WHERE w.referrer IS NOT NULL OR LOCATE(LOWER(w.url), 'utm_source=') > 0), parsed AS ( SELECT id, device, CASE WHEN LOCATE(url, 'utm_source=') = 0 THEN NULL ELSE SUBSTRING(url, LOCATE(url, 'utm_source=') + 11, CASE WHEN LOCATE(url, '&', LOCATE(url, 'utm_source=')) = 0 THEN 40 ELSE LOCATE(url, '&', LOCATE(url, 'utm_source=')) - LOCATE(url, 'utm_source=') - 11 END) END AS source, CASE WHEN LOCATE(url, 'utm_medium=') = 0 THEN NULL ELSE SUBSTRING(url, LOCATE(url, 'utm_medium=') + 11, CASE WHEN LOCATE(url, '&', LOCATE(url, 'utm_medium=')) = 0 THEN 40 ELSE LOCATE(url, '&', LOCATE(url, 'utm_medium=')) - LOCATE(url, 'utm_medium=') - 11 END) END AS medium FROM landing) SELECT COALESCE(source, '(none)') AS utm_source, COALESCE(medium, '(none)') AS utm_medium, COUNT(*) AS landings, SUM(CASE WHEN device = 'mobile' THEN 1 ELSE 0 END) AS on_mobile FROM parsed GROUP BY COALESCE(source, '(none)'), COALESCE(medium, '(none)') ORDER BY landings DESC, 1, 2"
    profile: iq17-default
  - id: traffic_heatmap_hour_by_weekday
    sql: "SELECT DATEPART(HOUR, w.event_ts) / 6 * 6 AS from_hour, SUM(CASE WHEN DOW(w.event_ts) = 1 THEN 1 ELSE 0 END) AS sun, SUM(CASE WHEN DOW(w.event_ts) = 2 THEN 1 ELSE 0 END) AS mon, SUM(CASE WHEN DOW(w.event_ts) = 3 THEN 1 ELSE 0 END) AS tue, SUM(CASE WHEN DOW(w.event_ts) = 4 THEN 1 ELSE 0 END) AS wed, SUM(CASE WHEN DOW(w.event_ts) = 5 THEN 1 ELSE 0 END) AS thu, SUM(CASE WHEN DOW(w.event_ts) = 6 THEN 1 ELSE 0 END) AS fri, SUM(CASE WHEN DOW(w.event_ts) = 7 THEN 1 ELSE 0 END) AS sat, COUNT(*) AS events FROM web_events w GROUP BY DATEPART(HOUR, w.event_ts) / 6 * 6 ORDER BY 1"
    profile: iq17-default
  - id: signup_cohort_month_two_retention
    sql: "WITH cohorts AS ( SELECT c.id, DATEFORMAT(c.signup_date, 'yyyy-mm') AS cohort, c.signup_date FROM customers c), active AS ( SELECT DISTINCT o.customer_id, DATEDIFF(MONTH, ch.signup_date, o.order_ts) AS months_after FROM orders o JOIN cohorts ch ON ch.id = o.customer_id WHERE o.status <> 'cancelled') SELECT ch.cohort, COUNT(*) AS customers, COUNT(DISTINCT CASE WHEN a.months_after BETWEEN 0 AND 1 THEN a.customer_id END) AS active_first_two_months, COUNT(DISTINCT CASE WHEN a.months_after BETWEEN 2 AND 12 THEN a.customer_id END) AS active_months_3_to_13 FROM cohorts ch LEFT JOIN active a ON a.customer_id = ch.id GROUP BY ch.cohort ORDER BY ch.cohort"
    profile: iq17-default
  - id: region_directory_of_segments_and_channels
    sql: "SELECT r.name AS region, COUNT(DISTINCT c.id) AS customers, LIST(DISTINCT c.segment, ', ' ORDER BY c.segment) AS segments, LIST(DISTINCT o.channel, ', ' ORDER BY o.channel) AS channels, LIST(DISTINCT c.city, ' / ' ORDER BY c.city DESC) AS cities FROM regions r JOIN customers c ON c.region_id = r.id LEFT JOIN orders o ON o.customer_id = c.id GROUP BY r.name ORDER BY r.name"
    profile: iq17-default
