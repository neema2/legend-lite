# The IQ scale program's realistic reports (2026-10-25): finance_and_people, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: receivables_aging
    sql: "WITH billed AS (SELECT o.id, o.customer_id, o.order_ts, SUM(oi.quantity * oi.unit_price) + o.shipping_fee AS billed FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status IN ('shipped', 'returned', 'pending') GROUP BY o.id, o.customer_id, o.order_ts, o.shipping_fee), paid AS (SELECT order_id, SUM(amount) AS paid FROM payments GROUP BY order_id) SELECT age_bucket, COUNT(*) AS invoices, SUM(outstanding) AS total_outstanding, MIN(order_ts) AS oldest, MAX(outstanding) AS largest FROM (SELECT b.id, b.order_ts, b.billed - COALESCE(p.paid, 0) AS outstanding, CASE WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 30 THEN 1 WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 60 THEN 2 WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 90 THEN 3 ELSE 4 END AS bucket_no, CASE WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 30 THEN '0-30' WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 60 THEN '31-60' WHEN DATEDIFF(DAY, b.order_ts, '2026-01-01') <= 90 THEN '61-90' ELSE '90+' END AS age_bucket FROM billed b LEFT JOIN paid p ON p.order_id = b.id) x WHERE outstanding > 0 GROUP BY bucket_no, age_bucket ORDER BY bucket_no"
    profile: iq17-default
  - id: customer_ledger_running_balance
    sql: "WITH entries AS (SELECT o.customer_id, CAST(o.order_ts AS DATE) AS entry_date, 'invoice' AS kind, o.id AS ref, SUM(oi.quantity * oi.unit_price) AS debit, CAST(0 AS NUMERIC(12,2)) AS credit FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id, CAST(o.order_ts AS DATE), o.id UNION ALL SELECT o.customer_id, CAST(p.paid_ts AS DATE), 'payment', p.id, 0, p.amount FROM payments p JOIN orders o ON o.id = p.order_id) SELECT customer_id, entry_date, kind, ref, debit, credit, SUM(debit - credit) OVER (PARTITION BY customer_id ORDER BY entry_date, kind, ref ROWS UNBOUNDED PRECEDING) AS balance FROM entries WHERE customer_id IN (2, 5, 9) ORDER BY customer_id, entry_date, kind, ref"
    profile: iq17-default
  - id: payment_methods_by_year
    sql: "SELECT m.method, YEAR(p.paid_ts) AS yr, COUNT(p.id) AS payments, COALESCE(SUM(p.amount), 0) AS amount FROM (SELECT 'card' AS method FROM dummy UNION ALL SELECT 'paypal' FROM dummy UNION ALL SELECT 'invoice' FROM dummy UNION ALL SELECT 'wire' FROM dummy) m LEFT JOIN payments p ON p.method = m.method GROUP BY m.method, YEAR(p.paid_ts) ORDER BY m.method, yr"
    profile: iq17-default
  - id: headcount_and_payroll_by_month
    sql: "SELECT g.row_num AS month_no, DATEADD(MONTH, g.row_num - 1, CAST('2025-01-01' AS DATE)) AS month_start, COUNT(e.id) AS headcount, CAST(COALESCE(SUM(e.salary), 0) / 12 AS NUMERIC(12,2)) AS monthly_payroll, SUM(CASE WHEN e.hire_date >= DATEADD(MONTH, g.row_num - 1, CAST('2025-01-01' AS DATE)) THEN 1 ELSE 0 END) AS hired_this_month FROM sa_rowgenerator(1, 12) g LEFT JOIN employees e ON e.hire_date < DATEADD(MONTH, g.row_num, CAST('2025-01-01' AS DATE)) GROUP BY g.row_num ORDER BY g.row_num"
    profile: iq17-default
  - id: salary_bands_by_title
    sql: "SELECT e.title, COUNT(*) AS staff, MIN(e.salary) AS low, MAX(e.salary) AS high, CAST(AVG(e.salary) AS NUMERIC(10,2)) AS mean, MAX(e.salary) - MIN(e.salary) AS spread, LIST(e.last_name, ', ' ORDER BY e.salary DESC, e.id) AS by_salary, CAST(AVG(DATEDIFF(MONTH, e.hire_date, CAST('2026-01-01' AS DATE))) / 12.0 AS NUMERIC(5,1)) AS avg_tenure_years FROM employees e GROUP BY e.title ORDER BY high DESC, e.title"
    profile: iq17-default
  - id: managers_span_of_control
    sql: "SELECT m.id, m.first_name || ' ' || m.last_name AS manager, m.title, COUNT(e.id) AS direct_reports, (SELECT COUNT(*) FROM employees x WHERE x.manager_id IN (SELECT y.id FROM employees y WHERE y.manager_id = m.id)) AS skip_level_reports, COALESCE(SUM(e.salary), 0) AS team_salary, CASE WHEN COUNT(e.id) = 0 THEN 'individual contributor' WHEN COUNT(e.id) >= 2 THEN 'manager of many' ELSE 'manager' END AS kind FROM employees m LEFT JOIN employees e ON e.manager_id = m.id GROUP BY m.id, m.first_name, m.last_name, m.title ORDER BY m.id"
    profile: iq17-default
  - id: sales_rep_commission_tiers
    sql: "WITH rev AS (SELECT o.sales_rep_id, YEAR(o.order_ts) AS yr, SUM(oi.quantity * oi.unit_price * (1 - o.discount_pct)) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status = 'shipped' AND o.sales_rep_id IS NOT NULL GROUP BY o.sales_rep_id, YEAR(o.order_ts)) SELECT r.sales_rep_id, e.last_name, r.yr, CAST(r.revenue AS NUMERIC(12,2)) AS revenue, CASE WHEN r.revenue >= 20000 THEN 'gold' WHEN r.revenue >= 10000 THEN 'silver' ELSE 'bronze' END AS tier, CAST(r.revenue * CASE WHEN r.revenue >= 20000 THEN 0.08 WHEN r.revenue >= 10000 THEN 0.05 ELSE 0.03 END AS NUMERIC(10,2)) AS commission, CAST(r.revenue - LAG(r.revenue) OVER (PARTITION BY r.sales_rep_id ORDER BY r.yr) AS NUMERIC(12,2)) AS change_vs_prior_year FROM rev r JOIN employees e ON e.id = r.sales_rep_id ORDER BY r.sales_rep_id, r.yr"
    profile: iq17-default
  - id: fulfilment_lead_time_by_weekday
    sql: "SELECT o.channel, DOW(o.order_ts) AS dow, DATENAME(WEEKDAY, o.order_ts) AS weekday, COUNT(*) AS orders, SUM(CASE WHEN o.ship_date IS NULL THEN 1 ELSE 0 END) AS unshipped, CAST(AVG(DATEDIFF(DAY, o.order_ts, o.ship_date)) AS NUMERIC(6,2)) AS avg_days, MAX(DATEDIFF(DAY, o.order_ts, o.ship_date)) AS worst_days FROM orders o WHERE o.status <> 'cancelled' GROUP BY o.channel, DOW(o.order_ts), DATENAME(WEEKDAY, o.order_ts) ORDER BY o.channel, dow"
    profile: iq17-default
  - id: fiscal_quarters_from_april
    sql: "SELECT 'FY' || CAST(f.fy AS VARCHAR(4)) || '-Q' || CAST(f.fq AS VARCHAR(1)) AS fiscal_quarter, COUNT(DISTINCT f.id) AS orders, SUM(oi.quantity * oi.unit_price) AS revenue, MIN(f.d) AS first_day, MAX(f.d) AS last_day FROM (SELECT id, CAST(order_ts AS DATE) AS d, YEAR(DATEADD(MONTH, 9, order_ts)) AS fy, QUARTER(DATEADD(MONTH, -3, order_ts)) AS fq FROM orders WHERE status <> 'cancelled') f JOIN order_items oi ON oi.order_id = f.id GROUP BY f.fy, f.fq ORDER BY f.fy, f.fq"
    profile: iq17-default
  - id: weeks_starting_monday
    sql: "SELECT w.week_start, DATEFORMAT(w.week_start, 'Mmm dd') AS label, COUNT(DISTINCT w.id) AS orders, SUM(oi.quantity) AS units FROM (SELECT o.id, DATEADD(DAY, -MOD(DOW(o.order_ts) + 5, 7), CAST(o.order_ts AS DATE)) AS week_start FROM orders o WHERE o.order_ts >= '2025-09-01') w JOIN order_items oi ON oi.order_id = w.id GROUP BY w.week_start ORDER BY w.week_start"
    profile: iq17-default
  - id: customer_age_bands_with_birthdays
    sql: "SELECT CASE WHEN age < 30 THEN 'under 30' WHEN age < 45 THEN '30-44' WHEN age < 60 THEN '45-59' ELSE '60+' END AS band, COUNT(*) AS customers, CAST(AVG(credit_limit) AS NUMERIC(10,2)) AS avg_credit, MIN(age) AS youngest, MAX(age) AS oldest FROM (SELECT id, credit_limit, DATEDIFF(YEAR, birth_date, CAST('2026-01-01' AS DATE)) - CASE WHEN MONTH(birth_date) * 100 + DAY(birth_date) > 101 THEN 1 ELSE 0 END AS age FROM customers WHERE birth_date IS NOT NULL) c GROUP BY CASE WHEN age < 30 THEN 'under 30' WHEN age < 45 THEN '30-44' WHEN age < 60 THEN '45-59' ELSE '60+' END ORDER BY MIN(age)"
    profile: iq17-default
