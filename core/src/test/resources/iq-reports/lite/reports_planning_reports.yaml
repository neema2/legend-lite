# The IQ scale program's realistic reports (2026-10-25): planning_reports, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: fiscal_year_starting_july
    sql: "SELECT YEAR(DATEADD(MONTH, 6, o.order_ts)) AS fiscal_year, 'Q' || CAST(QUARTER(DATEADD(MONTH, 6, o.order_ts)) AS VARCHAR(1)) AS fiscal_quarter, COUNT(DISTINCT o.id) AS orders, SUM(oi.quantity * oi.unit_price) AS revenue, MIN(CAST(o.order_ts AS DATE)) AS first_day, MAX(CAST(o.order_ts AS DATE)) AS last_day FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY YEAR(DATEADD(MONTH, 6, o.order_ts)), QUARTER(DATEADD(MONTH, 6, o.order_ts)) ORDER BY 1, 2"
    profile: iq17-default
  - id: category_top_three_by_revenue
    sql: "WITH ranked AS ( SELECT p.category, p.id, p.name, SUM(oi.quantity) AS units, SUM(oi.quantity * oi.unit_price) AS revenue, ROW_NUMBER() OVER (PARTITION BY p.category ORDER BY SUM(oi.quantity * oi.unit_price) DESC, p.id) AS rn FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.category, p.id, p.name) SELECT category, rn, id, name, units, revenue, CAST(100 * revenue / SUM(revenue) OVER (PARTITION BY category) AS NUMERIC(5,1)) AS share_of_top_three FROM ranked WHERE rn <= 3 ORDER BY category, rn"
    profile: iq17-default
  - id: median_days_to_ship_by_channel
    sql: "SELECT o.channel, COUNT(*) AS shipped, MEDIAN(DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date)) AS median_days, MIN(DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date)) AS fastest, MAX(DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date)) AS slowest, SUM(CASE WHEN DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) > 5 THEN 1 ELSE 0 END) AS over_five_days FROM orders o WHERE o.ship_date IS NOT NULL GROUP BY o.channel ORDER BY o.channel"
    profile: iq17-default
  - id: reorder_plan_against_lead_times
    sql: "WITH latest AS ( SELECT i.product_id, i.on_hand, i.reorder_point, ROW_NUMBER() OVER (PARTITION BY i.product_id ORDER BY i.snapshot_date DESC, i.id DESC) AS rn FROM inventory i), best_supplier AS ( SELECT sp.product_id, sp.supplier_id, sp.lead_days, sp.unit_cost, COALESCE(sp.min_order, 1) AS min_order, ROW_NUMBER() OVER (PARTITION BY sp.product_id ORDER BY sp.lead_days, sp.unit_cost, sp.id) AS pick FROM supplier_products sp) SELECT p.id, p.name, l.on_hand, l.reorder_point, b.supplier_id, b.lead_days, GREATER(l.reorder_point * 2 - l.on_hand, b.min_order) AS order_qty, CAST(GREATER(l.reorder_point * 2 - l.on_hand, b.min_order) * b.unit_cost AS NUMERIC(10,2)) AS order_cost, DATEADD(DAY, b.lead_days, CAST('2025-12-31' AS DATE)) AS expected_arrival FROM products p JOIN latest l ON l.product_id = p.id AND l.rn = 1 JOIN best_supplier b ON b.product_id = p.id AND b.pick = 1 WHERE l.on_hand <= l.reorder_point ORDER BY b.lead_days DESC, p.id"
    profile: iq17-default
  - id: sales_rep_leaderboard
    sql: "WITH reps AS ( SELECT e.id, TRIM(e.first_name) || ' ' || TRIM(e.last_name) AS rep, r.name AS region, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(oi.quantity * oi.unit_price), 0) AS revenue FROM employees e LEFT JOIN regions r ON r.id = e.region_id LEFT JOIN orders o ON o.sales_rep_id = e.id AND o.status <> 'cancelled' LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY e.id, e.first_name, e.last_name, r.name) SELECT RANK() OVER (ORDER BY revenue DESC) AS place, rep, COALESCE(region, '(none)') AS region, orders, revenue, MAX(revenue) OVER () - revenue AS behind_leader, CAST(CASE WHEN orders = 0 THEN NULL ELSE revenue / orders END AS NUMERIC(10,2)) AS average_order FROM reps ORDER BY revenue DESC, id"
    profile: iq17-default
  - id: orders_with_open_tickets_and_late_shipping
    sql: "SELECT o.id, o.customer_id, o.status, CAST(o.order_ts AS DATE) AS ordered, DATEDIFF(DAY, CAST(o.order_ts AS DATE), COALESCE(o.ship_date, CAST('2025-12-31' AS DATE))) AS days_waiting, (SELECT COUNT(*) FROM support_tickets t WHERE t.order_id = o.id AND t.closed_ts IS NULL) AS open_tickets, (SELECT MAX(t.priority) FROM support_tickets t WHERE t.order_id = o.id) AS top_priority FROM orders o WHERE EXISTS (SELECT 1 FROM support_tickets t WHERE t.order_id = o.id) AND (o.ship_date IS NULL OR o.ship_date > CAST(o.order_ts AS DATE)) ORDER BY days_waiting DESC, o.id"
    profile: iq17-default
