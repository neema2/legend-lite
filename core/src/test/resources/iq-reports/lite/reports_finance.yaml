# The IQ scale program's realistic reports (2026-10-25): finance, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: invoice_aging_buckets
    sql: "WITH totals AS ( SELECT o.id, o.customer_id, CAST(o.order_ts AS DATE) AS order_date, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS gross FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.id, o.customer_id, CAST(o.order_ts AS DATE), o.discount_pct), paid AS (SELECT order_id, SUM(amount) AS paid FROM payments GROUP BY order_id), open_items AS ( SELECT t.id, t.customer_id, ROUND(t.gross * (1 - t.discount_pct), 2) - COALESCE(p.paid, 0) AS open_amount, DATEDIFF(DAY, t.order_date, '2026-01-31') AS age_days FROM totals t LEFT JOIN paid p ON p.order_id = t.id) SELECT c.id, TRIM(c.first_name) || ' ' || c.last_name AS customer, SUM(CASE WHEN x.age_days <= 30 THEN x.open_amount ELSE 0 END) AS current_0_30, SUM(CASE WHEN x.age_days BETWEEN 31 AND 60 THEN x.open_amount ELSE 0 END) AS days_31_60, SUM(CASE WHEN x.age_days BETWEEN 61 AND 90 THEN x.open_amount ELSE 0 END) AS days_61_90, SUM(CASE WHEN x.age_days > 90 THEN x.open_amount ELSE 0 END) AS over_90, SUM(x.open_amount) AS total_open FROM open_items x JOIN customers c ON c.id = x.customer_id WHERE x.open_amount > 0.01 GROUP BY c.id, c.first_name, c.last_name ORDER BY total_open DESC, c.id"
    profile: iq17-default
  - id: running_customer_balance
    sql: "WITH ledger AS ( SELECT o.customer_id, o.order_ts AS entry_ts, 'invoice' AS kind, o.id AS ref, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS amount FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status = 'shipped' GROUP BY o.customer_id, o.order_ts, o.id UNION ALL SELECT o.customer_id, p.paid_ts, 'payment', p.id, -p.amount FROM payments p JOIN orders o ON o.id = p.order_id WHERE o.status = 'shipped') SELECT customer_id, entry_ts, kind, ref, amount, SUM(amount) OVER (PARTITION BY customer_id ORDER BY entry_ts, kind, ref ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS balance FROM ledger WHERE customer_id <= 4 ORDER BY customer_id, entry_ts, kind, ref"
    profile: iq17-default
  - id: sales_commission_tiers
    sql: "WITH rep_sales AS ( SELECT o.sales_rep_id, YEAR(o.order_ts) AS yr, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status IN ('shipped', 'returned') AND o.sales_rep_id IS NOT NULL GROUP BY o.sales_rep_id, YEAR(o.order_ts)) SELECT e.id, e.first_name || ' ' || e.last_name AS rep, r.yr, r.revenue, ROUND(CASE WHEN r.revenue <= 50000 THEN r.revenue * 0.05 WHEN r.revenue <= 150000 THEN 2500 + (r.revenue - 50000) * 0.08 ELSE 10500 + (r.revenue - 150000) * 0.12 END, 2) AS commission FROM rep_sales r JOIN employees e ON e.id = r.sales_rep_id ORDER BY r.yr, commission DESC, e.id"
    profile: iq17-default
  - id: payment_status_by_month
    sql: "SELECT DATEFORMAT(o.order_ts, 'yyyy-mm') AS month, SUM(CASE WHEN COALESCE(p.paid, 0) = 0 THEN 1 ELSE 0 END) AS unpaid, SUM(CASE WHEN p.payments > 1 THEN 1 ELSE 0 END) AS installments, SUM(CASE WHEN p.payments = 1 THEN 1 ELSE 0 END) AS single_payment, COUNT(*) AS orders FROM orders o LEFT JOIN (SELECT order_id, SUM(amount) AS paid, COUNT(*) AS payments FROM payments GROUP BY order_id) p ON p.order_id = o.id WHERE o.status <> 'cancelled' AND o.order_ts >= '2025-01-01' GROUP BY DATEFORMAT(o.order_ts, 'yyyy-mm') ORDER BY month"
    profile: iq17-default
  - id: gross_to_net_by_channel
    sql: "WITH lines AS (SELECT order_id, SUM(quantity * unit_price) AS gross, SUM(line_discount) AS line_disc FROM order_items GROUP BY order_id) SELECT o.channel, COUNT(*) AS orders, SUM(l.gross) AS gross, SUM(l.line_disc) AS line_discounts, SUM(ROUND((l.gross - l.line_disc) * o.discount_pct, 2)) AS order_discounts, SUM(o.shipping_fee) AS shipping, SUM(l.gross - l.line_disc - ROUND((l.gross - l.line_disc) * o.discount_pct, 2) + o.shipping_fee) AS net FROM orders o JOIN lines l ON l.order_id = o.id WHERE o.status = 'shipped' GROUP BY o.channel ORDER BY net DESC, o.channel"
    profile: iq17-default
  - id: quarterly_sales_tax
    sql: "SELECT r.country, QUARTER(o.order_ts) AS qtr, 'Q' || CAST(QUARTER(o.order_ts) AS VARCHAR(1)) || ' ' || CAST(YEAR(o.order_ts) AS VARCHAR(4)) AS period, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS taxable, ROUND(SUM(oi.quantity * oi.unit_price - oi.line_discount) * CASE r.country WHEN 'Germany' THEN 0.19 WHEN 'Canada' THEN 0.13 ELSE 0.0725 END, 2) AS tax FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON c.id = o.customer_id JOIN regions r ON r.id = c.region_id WHERE o.status = 'shipped' AND YEAR(o.order_ts) = 2025 GROUP BY r.country, YEAR(o.order_ts), QUARTER(o.order_ts) ORDER BY r.country, qtr"
    profile: iq17-default
  - id: credit_limit_exposure
    sql: "SELECT c.id, c.last_name, c.credit_limit, x.open_value, ROUND(100.0 * x.open_value / c.credit_limit, 1) AS pct_of_limit FROM customers c JOIN (SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS open_value FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status IN ('pending', 'shipped') AND o.order_ts >= '2025-07-01' GROUP BY o.customer_id) x ON x.customer_id = c.id WHERE x.open_value > 0.25 * c.credit_limit ORDER BY pct_of_limit DESC, c.id"
    profile: iq17-default
