# The IQ scale program's realistic reports (2026-10-25): depth, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: customers_above_their_regions_average
    sql: "WITH totals AS (SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS spent FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id) SELECT c.id, c.last_name, r.name AS region, t.spent, CAST((SELECT AVG(t2.spent) FROM totals t2 JOIN customers c2 ON c2.id = t2.customer_id WHERE c2.region_id = c.region_id) AS NUMERIC(12,2)) AS region_average FROM customers c JOIN regions r ON r.id = c.region_id JOIN totals t ON t.customer_id = c.id WHERE t.spent > (SELECT AVG(t3.spent) FROM totals t3 JOIN customers c3 ON c3.id = t3.customer_id WHERE c3.region_id = c.region_id) ORDER BY r.name, t.spent DESC, c.id"
    profile: iq17-default
  - id: monthly_rank_movement
    sql: "WITH monthly AS (SELECT p.category, YEAR(o.order_ts) * 100 + MONTH(o.order_ts) AS ym, SUM(oi.quantity * oi.unit_price) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE o.status <> 'cancelled' AND YEAR(o.order_ts) = 2025 GROUP BY p.category, YEAR(o.order_ts) * 100 + MONTH(o.order_ts)), ranked AS (SELECT category, ym, revenue, RANK() OVER (PARTITION BY ym ORDER BY revenue DESC, category) AS rnk FROM monthly) SELECT category, ym, revenue, rnk, LAG(rnk) OVER (PARTITION BY category ORDER BY ym) AS prior_rank, CASE WHEN LAG(rnk) OVER (PARTITION BY category ORDER BY ym) IS NULL THEN 'new' WHEN rnk < LAG(rnk) OVER (PARTITION BY category ORDER BY ym) THEN 'up' WHEN rnk > LAG(rnk) OVER (PARTITION BY category ORDER BY ym) THEN 'down' ELSE 'same' END AS movement FROM ranked ORDER BY category, ym"
    profile: iq17-default
  - id: pareto_abc_classes
    sql: "WITH rev AS (SELECT p.id, p.name, SUM(oi.quantity * oi.unit_price) AS revenue FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.id, p.name), cum AS (SELECT id, name, revenue, SUM(revenue) OVER (ORDER BY revenue DESC, id ROWS UNBOUNDED PRECEDING) AS running, SUM(revenue) OVER () AS grand FROM rev) SELECT id, name, revenue, CAST(100 * running / grand AS NUMERIC(6,2)) AS cumulative_pct, CASE WHEN 100 * (running - revenue) / grand < 80 THEN 'A' WHEN 100 * (running - revenue) / grand < 95 THEN 'B' ELSE 'C' END AS abc_class FROM cum ORDER BY revenue DESC, id"
    profile: iq17-default
  - id: order_priority_score
    sql: "SELECT o.id, o.customer_id, o.channel, o.status, CAST(ROUND(COALESCE(t.total, 0) / 100.0 * CASE c.segment WHEN 'enterprise' THEN 1.5 WHEN 'smb' THEN 1.2 ELSE 1.0 END + CASE WHEN o.ship_date IS NULL AND o.status = 'pending' THEN 25 ELSE 0 END + COALESCE(k.open_tickets, 0) * 10 - COALESCE(DATEDIFF(DAY, o.order_ts, o.ship_date), 0), 1) AS NUMERIC(10,1)) AS score, COALESCE(NULLIF(TRIM(c.phone), ''), c.email, 'no contact') AS contact FROM orders o JOIN customers c ON c.id = o.customer_id LEFT JOIN (SELECT order_id, SUM(quantity * unit_price) AS total FROM order_items GROUP BY order_id) t ON t.order_id = o.id LEFT JOIN (SELECT customer_id, COUNT(*) AS open_tickets FROM support_tickets WHERE closed_ts IS NULL GROUP BY customer_id) k ON k.customer_id = o.customer_id WHERE o.status IN ('pending', 'shipped') AND o.order_ts >= '2025-07-01' ORDER BY score DESC, o.id"
    profile: iq17-default
  - id: orders_matching_a_complex_filter
    sql: "SELECT o.id, o.customer_id, o.order_ts, o.status, o.channel FROM orders o WHERE (o.status IN ('shipped', 'returned') OR (o.status = 'pending' AND o.order_ts < '2025-06-01')) AND o.channel <> 'phone' AND o.order_ts BETWEEN '2024-01-01' AND '2025-12-31' AND NOT EXISTS (SELECT 1 FROM support_tickets t WHERE t.order_id = o.id AND t.priority IN ('urgent', 'high')) AND o.customer_id IN (SELECT c.id FROM customers c WHERE c.segment <> 'retail' OR c.credit_limit >= 50000) ORDER BY o.order_ts, o.id"
    profile: iq17-default
  - id: status_by_channel_crosstab_with_totals
    sql: "SELECT status, web, store, phone, web + store + phone AS total FROM (SELECT status, 1 AS part, SUM(CASE WHEN channel = 'web' THEN 1 ELSE 0 END) AS web, SUM(CASE WHEN channel = 'store' THEN 1 ELSE 0 END) AS store, SUM(CASE WHEN channel = 'phone' THEN 1 ELSE 0 END) AS phone FROM orders GROUP BY status UNION ALL SELECT 'all', 2, SUM(CASE WHEN channel = 'web' THEN 1 ELSE 0 END), SUM(CASE WHEN channel = 'store' THEN 1 ELSE 0 END), SUM(CASE WHEN channel = 'phone' THEN 1 ELSE 0 END) FROM orders) x ORDER BY part, status"
    profile: iq17-default
  - id: business_days_to_ship_estimate
    sql: "SELECT o.id, CAST(o.order_ts AS DATE) AS ordered, o.ship_date, DATEDIFF(DAY, o.order_ts, o.ship_date) AS calendar_days, DATEDIFF(DAY, o.order_ts, o.ship_date) - 2 * (DATEDIFF(DAY, o.order_ts, o.ship_date) / 7) - CASE WHEN MOD(DATEDIFF(DAY, o.order_ts, o.ship_date), 7) + DOW(o.order_ts) > 7 THEN 2 WHEN MOD(DATEDIFF(DAY, o.order_ts, o.ship_date), 7) + DOW(o.order_ts) = 7 THEN 1 ELSE 0 END AS business_days_estimate, DATENAME(WEEKDAY, o.order_ts) AS ordered_on, DATENAME(WEEKDAY, o.ship_date) AS shipped_on FROM orders o WHERE o.ship_date IS NOT NULL AND o.order_ts >= '2025-09-01' ORDER BY o.id"
    profile: iq17-default
  - id: repeat_purchase_after_a_ticket
    sql: "SELECT t.id AS ticket, t.customer_id, t.opened_ts, t.priority, n.next_order, CASE WHEN n.next_order IS NULL THEN 'not yet' WHEN n.next_order <= DATEADD(DAY, 30, t.opened_ts) THEN 'retained 30d' ELSE 'came back later' END AS outcome FROM support_tickets t LEFT JOIN (SELECT t2.id, MIN(o.order_ts) AS next_order FROM support_tickets t2 JOIN orders o ON o.customer_id = t2.customer_id AND o.order_ts > t2.opened_ts GROUP BY t2.id) n ON n.id = t.id ORDER BY t.customer_id, t.opened_ts, t.id"
    profile: iq17-default
