# The IQ scale program's realistic reports (2026-10-25): analyses, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: weighted_average_price_by_category
    sql: "SELECT p.category, SUM(oi.quantity) AS units, ROUND(SUM(oi.quantity * oi.unit_price) / SUM(oi.quantity), 2) AS weighted_avg_price, ROUND(AVG(oi.unit_price), 2) AS simple_avg_price FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.category ORDER BY p.category"
    profile: iq17-default
  - id: new_vs_returning_customers_by_month
    sql: "WITH firsts AS (SELECT customer_id, MIN(order_ts) AS first_ts FROM orders WHERE status <> 'cancelled' GROUP BY customer_id) SELECT DATEFORMAT(o.order_ts, 'YYYY-MM') AS ym, COUNT(DISTINCT CASE WHEN DATEFORMAT(f.first_ts, 'YYYY-MM') = DATEFORMAT(o.order_ts, 'YYYY-MM') THEN o.customer_id END) AS new_customers, COUNT(DISTINCT CASE WHEN f.first_ts < DATEADD(DAY, 1 - DAY(o.order_ts), CAST(o.order_ts AS DATE)) THEN o.customer_id END) AS returning_customers FROM orders o JOIN firsts f ON f.customer_id = o.customer_id WHERE o.status <> 'cancelled' GROUP BY DATEFORMAT(o.order_ts, 'YYYY-MM') ORDER BY ym"
    profile: iq17-default
  - id: revenue_concentration_by_quintile
    sql: "WITH spend AS (SELECT t.customer_id, SUM(t.total) AS total FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t WHERE t.status <> 'cancelled' GROUP BY t.customer_id), q AS (SELECT customer_id, total, NTILE(5) OVER (ORDER BY total DESC, customer_id) AS quintile FROM spend) SELECT quintile, COUNT(*) AS customers, SUM(total) AS revenue, ROUND(100.0 * SUM(total) / SUM(SUM(total)) OVER (), 1) AS share_pct FROM q GROUP BY quintile ORDER BY quintile"
    profile: iq17-default
  - id: pareto_of_products
    sql: "WITH r AS (SELECT p.id, p.name, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS revenue FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id WHERE o.status IN ('shipped', 'returned') GROUP BY p.id, p.name) SELECT id, name, revenue, SUM(revenue) OVER (ORDER BY revenue DESC, id ROWS UNBOUNDED PRECEDING) AS cumulative, ROUND(100.0 * SUM(revenue) OVER (ORDER BY revenue DESC, id ROWS UNBOUNDED PRECEDING) / SUM(revenue) OVER (), 1) AS cumulative_pct FROM r ORDER BY revenue DESC, id"
    profile: iq17-default
  - id: line_level_discount_pct
    sql: "SELECT oi.id, p.name, p.unit_price AS list_price, oi.unit_price AS sold_at, ROUND(100.0 * (p.unit_price - oi.unit_price) / p.unit_price, 2) AS price_cut_pct, oi.line_discount, oi.quantity * (p.unit_price - oi.unit_price) + oi.line_discount AS total_concession FROM order_items oi JOIN products p ON p.id = oi.product_id WHERE oi.unit_price < p.unit_price OR oi.line_discount > 0 ORDER BY total_concession DESC, oi.id"
    profile: iq17-default
  - id: lapsed_products
    sql: "SELECT p.id, p.name, MAX(o.order_ts) AS last_sold FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id GROUP BY p.id, p.name HAVING MAX(o.order_ts) < DATEADD(DAY, -180, '2026-01-01') ORDER BY last_sold, p.id"
    profile: iq17-default
  - id: management_chain
    sql: "SELECT e.id, e.last_name AS employee, m.last_name AS manager, mm.last_name AS managers_manager, CASE WHEN m.id IS NULL THEN 1 WHEN mm.id IS NULL THEN 2 ELSE 3 END AS level FROM employees e LEFT JOIN employees m ON m.id = e.manager_id LEFT JOIN employees mm ON mm.id = m.manager_id ORDER BY level, e.id"
    profile: iq17-default
  - id: median_and_spread_of_order_values
    sql: "SELECT t.channel, COUNT(*) AS orders, MEDIAN(t.total) AS median_total, ROUND(AVG(t.total), 2) AS mean_total, ROUND(STDDEV(CAST(t.total AS DOUBLE)), 2) AS sd_total FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t WHERE t.status <> 'cancelled' GROUP BY t.channel ORDER BY t.channel"
    profile: iq17-default
  - id: categories_with_healthy_margins
    sql: "SELECT category, products_sold, margin_pct FROM ( SELECT p.category, COUNT(DISTINCT p.id) AS products_sold, ROUND(100.0 * SUM(oi.quantity * (oi.unit_price - p.unit_cost)) / SUM(oi.quantity * oi.unit_price), 1) AS margin_pct FROM products p JOIN order_items oi ON oi.product_id = p.id GROUP BY p.category HAVING COUNT(DISTINCT p.id) >= 3) m WHERE margin_pct > 30 ORDER BY margin_pct DESC, category"
    profile: iq17-default
  - id: customers_buying_every_category
    sql: "SELECT c.id, c.last_name FROM customers c WHERE NOT EXISTS (SELECT 1 FROM products p0 WHERE NOT EXISTS ( SELECT 1 FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE o.customer_id = c.id AND p.category = p0.category)) ORDER BY c.id"
    profile: iq17-default
  - id: bought_laptops_and_phones
    sql: "SELECT c.id, c.last_name FROM customers c WHERE c.id IN (SELECT o.customer_id FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE p.subcategory = 'Laptops') AND c.id IN (SELECT o.customer_id FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE p.subcategory = 'Phones') ORDER BY c.id"
    profile: iq17-default
  - id: orders_above_customer_norm
    sql: "SELECT t.id, t.customer_id, t.total, ROUND((SELECT AVG(t2.total) FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t2 WHERE t2.customer_id = t.customer_id), 2) AS customer_avg FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t WHERE t.total / 1.5 > (SELECT AVG(t2.total) FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t2 WHERE t2.customer_id = t.customer_id) ORDER BY t.customer_id, t.id"
    profile: iq17-default
  - id: second_largest_order_per_customer
    sql: "SELECT customer_id, id, total FROM (SELECT t.customer_id, t.id, t.total, DENSE_RANK() OVER (PARTITION BY t.customer_id ORDER BY t.total DESC) AS dr FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t) x WHERE dr = 2 ORDER BY customer_id, id"
    profile: iq17-default
  - id: buying_streaks
    sql: "WITH seq AS (SELECT customer_id, id, order_ts, CASE WHEN DATEDIFF(DAY, LAG(order_ts) OVER (PARTITION BY customer_id ORDER BY order_ts, id), order_ts) <= 120 THEN 0 ELSE 1 END AS starts FROM orders WHERE status <> 'cancelled') SELECT customer_id, id, order_ts, SUM(starts) OVER (PARTITION BY customer_id ORDER BY order_ts, id ROWS UNBOUNDED PRECEDING) AS streak_no FROM seq ORDER BY customer_id, order_ts, id"
    profile: iq17-default
  - id: region_channel_grid
    sql: "SELECT r.name AS region, ch.channel, COUNT(o.id) AS orders FROM regions r CROSS JOIN (SELECT DISTINCT channel FROM orders) ch LEFT JOIN customers c ON c.region_id = r.id LEFT JOIN orders o ON o.customer_id = c.id AND o.channel = ch.channel GROUP BY r.name, ch.channel ORDER BY r.name, ch.channel"
    profile: iq17-default
  - id: favorite_category_per_customer
    sql: "SELECT customer_id, category, n FROM ( SELECT o.customer_id, p.category, COUNT(*) AS n, ROW_NUMBER() OVER (PARTITION BY o.customer_id ORDER BY COUNT(*) DESC, p.category) AS rn FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id GROUP BY o.customer_id, p.category) f WHERE rn = 1 ORDER BY customer_id"
    profile: iq17-default
  - id: top_city_per_region
    sql: "SELECT region, city, revenue FROM ( SELECT r.name AS region, c.city, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS revenue, RANK() OVER (PARTITION BY r.name ORDER BY SUM(oi.quantity * oi.unit_price - oi.line_discount) DESC, c.city) AS rk FROM regions r JOIN customers c ON c.region_id = r.id JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY r.name, c.city) x WHERE rk = 1 ORDER BY region"
    profile: iq17-default
  - id: year_over_year_month_pivot
    sql: "SELECT MONTH(o.order_ts) AS mon, SUM(CASE WHEN YEAR(o.order_ts) = 2023 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END) AS y2023, SUM(CASE WHEN YEAR(o.order_ts) = 2024 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END) AS y2024, SUM(CASE WHEN YEAR(o.order_ts) = 2025 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END) AS y2025, CASE WHEN SUM(CASE WHEN YEAR(o.order_ts) = 2024 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END) = 0 THEN NULL ELSE ROUND(100.0 * (SUM(CASE WHEN YEAR(o.order_ts) = 2025 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END) - SUM(CASE WHEN YEAR(o.order_ts) = 2024 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END)) / SUM(CASE WHEN YEAR(o.order_ts) = 2024 THEN oi.quantity * oi.unit_price - oi.line_discount ELSE 0 END), 1) END AS yoy_pct FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status IN ('shipped', 'returned') GROUP BY MONTH(o.order_ts) ORDER BY mon"
    profile: iq17-default
  - id: slow_starters
    sql: "SELECT c.id, c.signup_date FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.order_ts < DATEADD(DAY, 90, c.signup_date)) AND EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id) ORDER BY c.id"
    profile: iq17-default
  - id: three_level_derived_filters
    sql: "SELECT segment, buyers, avg_spend FROM ( SELECT segment, COUNT(*) AS buyers, ROUND(AVG(spend), 2) AS avg_spend FROM ( SELECT c.segment, c.id, SUM(t.total) AS spend FROM customers c JOIN ( SELECT * FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t0 WHERE t0.status <> 'cancelled') t ON t.customer_id = c.id WHERE c.is_active = 1 GROUP BY c.segment, c.id) per_customer WHERE spend > 100 GROUP BY segment) per_segment WHERE buyers >= 2 ORDER BY avg_spend DESC, segment"
    profile: iq17-default
  - id: discount_effectiveness
    sql: "SELECT CASE WHEN t.discount_pct > 0 THEN 'discounted' ELSE 'full price' END AS pricing, COUNT(*) AS orders, ROUND(AVG(t.total), 2) AS avg_basket, ROUND(AVG(t.total * (1 - t.discount_pct)), 2) AS avg_paid FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t WHERE t.status <> 'cancelled' GROUP BY CASE WHEN t.discount_pct > 0 THEN 'discounted' ELSE 'full price' END ORDER BY pricing"
    profile: iq17-default
  - id: payment_reconciliation
    sql: "SELECT t.id, t.status, ROUND(t.total * (1 - t.discount_pct), 2) AS billed, COALESCE(SUM(p.amount), 0) AS received, CASE WHEN t.status = 'cancelled' AND SUM(p.amount) IS NOT NULL THEN 'refund due' WHEN SUM(p.amount) IS NULL THEN 'unpaid' WHEN ABS(SUM(p.amount) - ROUND(t.total * (1 - t.discount_pct), 2)) < 0.02 THEN 'settled' WHEN SUM(p.amount) < ROUND(t.total * (1 - t.discount_pct), 2) THEN 'short' ELSE 'over' END AS state FROM (SELECT o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS total FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.channel, o.status, o.discount_pct) t LEFT JOIN payments p ON p.order_id = t.id GROUP BY t.id, t.status, t.total, t.discount_pct ORDER BY t.id"
    profile: iq17-default
