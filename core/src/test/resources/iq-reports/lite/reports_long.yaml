# The IQ scale program's realistic reports (2026-10-25): long, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: regional_scorecard
    sql: "WITH order_totals AS ( SELECT o.id, o.customer_id, o.order_ts, o.status, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS gross, o.discount_pct FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.customer_id, o.order_ts, o.status, o.discount_pct), by_region AS ( SELECT r.id AS region_id, r.name AS region, r.country, COUNT(DISTINCT ot.customer_id) AS buyers, COUNT(*) AS orders, SUM(CASE WHEN ot.status IN ('shipped', 'returned') THEN ot.gross * (1 - ot.discount_pct) ELSE 0 END) AS net_revenue, SUM(CASE WHEN ot.status = 'returned' THEN 1 ELSE 0 END) AS returns FROM order_totals ot JOIN customers c ON c.id = ot.customer_id JOIN regions r ON r.id = c.region_id GROUP BY r.id, r.name, r.country) SELECT region, country, buyers, orders, ROUND(net_revenue, 2) AS net_revenue, ROUND(net_revenue / NULLIF(orders, 0), 2) AS revenue_per_order, ROUND(100.0 * returns / NULLIF(orders, 0), 1) AS return_rate, RANK() OVER (ORDER BY net_revenue DESC) AS revenue_rank, RANK() OVER (PARTITION BY country ORDER BY net_revenue DESC) AS rank_in_country FROM by_region ORDER BY revenue_rank, region"
    profile: iq17-default
  - id: customer_360
    sql: "SELECT c.id, TRIM(c.first_name) || ' ' || UPPER(c.last_name) AS name, r.name AS region, c.segment, DATEDIFF(DAY, c.signup_date, '2026-01-01') AS tenure_days, COALESCE(stats.orders, 0) AS orders, COALESCE(stats.spend, 0) AS spend, COALESCE(pay.paid, 0) AS paid, COALESCE(stats.spend, 0) - COALESCE(pay.paid, 0) AS gap, CASE WHEN stats.orders IS NULL THEN 'prospect' WHEN stats.spend >= 5000 THEN 'vip' WHEN stats.orders >= 3 THEN 'loyal' ELSE 'occasional' END AS tier FROM customers c JOIN regions r ON r.id = c.region_id LEFT JOIN (SELECT o.customer_id, COUNT(DISTINCT o.id) AS orders, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS spend FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id) stats ON stats.customer_id = c.id LEFT JOIN (SELECT o.customer_id, SUM(p.amount) AS paid FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id) pay ON pay.customer_id = c.id ORDER BY c.id"
    profile: iq17-default
  - id: product_performance_report
    sql: "WITH sales AS ( SELECT oi.product_id, YEAR(o.order_ts) AS yr, SUM(oi.quantity) AS units, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS revenue, SUM(oi.quantity * p.unit_cost) AS cost FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id WHERE o.status IN ('shipped', 'returned') GROUP BY oi.product_id, YEAR(o.order_ts)) SELECT p.category, p.name, s.yr, s.units, s.revenue, s.revenue - s.cost AS profit, ROUND(100.0 * (s.revenue - s.cost) / NULLIF(s.revenue, 0), 1) AS margin_pct, s.revenue - LAG(s.revenue) OVER (PARTITION BY s.product_id ORDER BY s.yr) AS yoy_change FROM sales s JOIN products p ON p.id = s.product_id WHERE p.discontinued = 0 ORDER BY p.category, p.name, s.yr"
    profile: iq17-default
  - id: monthly_kpis_with_targets
    sql: "WITH monthly AS ( SELECT DATEFORMAT(o.order_ts, 'YYYY-MM') AS ym, COUNT(DISTINCT o.id) AS orders, COUNT(DISTINCT o.customer_id) AS active_customers, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS revenue FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY DATEFORMAT(o.order_ts, 'YYYY-MM')) SELECT ym, orders, active_customers, revenue, CASE WHEN revenue >= 10000 THEN 'above target' WHEN revenue >= 5000 THEN 'near target' ELSE 'below target' END AS status, SUM(revenue) OVER (ORDER BY ym ROWS BETWEEN 11 PRECEDING AND CURRENT ROW) AS trailing_12m, MAX(revenue) OVER (ORDER BY ym ROWS UNBOUNDED PRECEDING) AS best_so_far FROM monthly ORDER BY ym"
    profile: iq17-default
  - id: basket_analysis_by_size
    sql: "SELECT CASE WHEN items <= 1 THEN 'single' WHEN items <= 3 THEN 'small' ELSE 'large' END AS basket, COUNT(*) AS orders, ROUND(AVG(order_value), 2) AS avg_value, SUM(order_value) AS total_value, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct_of_orders FROM (SELECT o.id, SUM(oi.quantity) AS items, SUM(oi.quantity * oi.unit_price - oi.line_discount) AS order_value FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.id) baskets GROUP BY CASE WHEN items <= 1 THEN 'single' WHEN items <= 3 THEN 'small' ELSE 'large' END ORDER BY basket"
    profile: iq17-default
  - id: churn_risk_list
    sql: "SELECT c.id, c.first_name, c.last_name, c.email, last_o.last_order, DATEDIFF(DAY, last_o.last_order, '2026-01-01') AS days_quiet FROM customers c JOIN (SELECT customer_id, MAX(order_ts) AS last_order FROM orders WHERE status <> 'cancelled' GROUP BY customer_id) last_o ON last_o.customer_id = c.id WHERE c.is_active = 1 AND DATEDIFF(DAY, last_o.last_order, '2026-01-01') > 180 AND (c.email LIKE '%@gmail.com' OR c.email LIKE '%@yahoo.com' OR c.segment = 'enterprise') ORDER BY days_quiet DESC, c.id"
    profile: iq17-default
  - id: union_of_activity_feed
    sql: "SELECT 'order' AS kind, o.id AS ref, o.order_ts AS at_ts, o.customer_id AS who FROM orders o WHERE o.order_ts >= '2025-11-01' UNION ALL SELECT 'payment', p.id, p.paid_ts, o.customer_id FROM payments p JOIN orders o ON o.id = p.order_id WHERE p.paid_ts >= '2025-11-01' UNION ALL SELECT 'signup', c.id, CAST(c.signup_date AS TIMESTAMP), c.id FROM customers c WHERE c.signup_date >= '2024-05-01' ORDER BY 3, 1, 2"
    profile: iq17-default
