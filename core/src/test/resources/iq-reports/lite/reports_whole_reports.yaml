# The IQ scale program's realistic reports (2026-10-25): whole_reports, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: monthly_management_pack
    sql: "WITH lines AS (SELECT o.id AS order_id, DATEFORMAT(o.order_ts, 'yyyy-mm') AS ym, SUM(oi.quantity * oi.unit_price - COALESCE(oi.line_discount, 0)) AS net FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.id, DATEFORMAT(o.order_ts, 'yyyy-mm')), sales AS (SELECT ym, COUNT(*) AS orders, SUM(net) AS revenue FROM lines GROUP BY ym), cash AS (SELECT DATEFORMAT(paid_ts, 'yyyy-mm') AS ym, SUM(amount) AS collected FROM payments GROUP BY DATEFORMAT(paid_ts, 'yyyy-mm')), firsts AS (SELECT customer_id, MIN(order_ts) AS first_ts FROM orders GROUP BY customer_id), newbies AS (SELECT DATEFORMAT(first_ts, 'yyyy-mm') AS ym, COUNT(*) AS new_customers FROM firsts GROUP BY DATEFORMAT(first_ts, 'yyyy-mm')), support AS (SELECT DATEFORMAT(opened_ts, 'yyyy-mm') AS ym, COUNT(*) AS tickets, SUM(CASE WHEN priority = 'urgent' THEN 1 ELSE 0 END) AS urgent FROM support_tickets GROUP BY DATEFORMAT(opened_ts, 'yyyy-mm')) SELECT s.ym, s.orders, s.revenue, COALESCE(c.collected, 0) AS collected, COALESCE(n.new_customers, 0) AS new_customers, COALESCE(t.tickets, 0) AS tickets, COALESCE(t.urgent, 0) AS urgent, s.revenue - LAG(s.revenue) OVER (ORDER BY s.ym) AS revenue_change, SUM(s.revenue) OVER (PARTITION BY LEFT(s.ym, 4) ORDER BY s.ym ROWS UNBOUNDED PRECEDING) AS revenue_ytd, CAST(ROUND(100.0 * COALESCE(t.tickets, 0) / s.orders, 1) AS NUMERIC(6,1)) AS tickets_per_100_orders FROM sales s LEFT JOIN cash c ON c.ym = s.ym LEFT JOIN newbies n ON n.ym = s.ym LEFT JOIN support t ON t.ym = s.ym ORDER BY s.ym"
    profile: iq17-default
  - id: customer_health_dashboard
    sql: "WITH spend AS (SELECT o.customer_id, COUNT(DISTINCT o.id) AS orders, SUM(oi.quantity * oi.unit_price) AS gross, MAX(o.order_ts) AS last_ts FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id), paid AS (SELECT o.customer_id, SUM(p.amount) AS paid FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id), care AS (SELECT customer_id, COUNT(*) AS tickets, SUM(CASE WHEN closed_ts IS NULL THEN 1 ELSE 0 END) AS open_tickets FROM support_tickets GROUP BY customer_id) SELECT c.id, TRIM(c.first_name) || ' ' || c.last_name AS customer, r.name AS region, COALESCE(s.orders, 0) AS orders, COALESCE(s.gross, 0) AS gross, COALESCE(p.paid, 0) AS paid, COALESCE(s.gross, 0) - COALESCE(p.paid, 0) AS outstanding, DATEDIFF(DAY, s.last_ts, CAST('2026-01-01' AS TIMESTAMP)) AS days_since_last, COALESCE(k.tickets, 0) AS tickets, COALESCE(k.open_tickets, 0) AS open_tickets, RANK() OVER (PARTITION BY c.region_id ORDER BY COALESCE(s.gross, 0) DESC) AS rank_in_region, CASE WHEN s.orders IS NULL THEN 'never bought' WHEN DATEDIFF(DAY, s.last_ts, CAST('2026-01-01' AS TIMESTAMP)) > 365 THEN 'lapsed' WHEN COALESCE(k.open_tickets, 0) > 0 THEN 'needs care' WHEN COALESCE(s.gross, 0) - COALESCE(p.paid, 0) > 0 THEN 'owes' ELSE 'healthy' END AS status, (SELECT COUNT(*) FROM web_events w WHERE w.customer_id = c.id) AS web_events FROM customers c JOIN regions r ON r.id = c.region_id LEFT JOIN spend s ON s.customer_id = c.id LEFT JOIN paid p ON p.customer_id = c.id LEFT JOIN care k ON k.customer_id = c.id ORDER BY c.id"
    profile: iq17-default
  - id: product_profitability_waterfall
    sql: "SELECT p.id, p.name, p.category, SUM(oi.quantity) AS units, SUM(oi.quantity * oi.unit_price) AS gross, SUM(COALESCE(oi.line_discount, 0)) AS discounts, SUM(oi.quantity * p.unit_cost) AS cogs, SUM(oi.quantity * oi.unit_price) - SUM(COALESCE(oi.line_discount, 0)) - SUM(oi.quantity * p.unit_cost) AS margin, CAST(ROUND(100 * (SUM(oi.quantity * oi.unit_price) - SUM(COALESCE(oi.line_discount, 0)) - SUM(oi.quantity * p.unit_cost)) / NULLIF(SUM(oi.quantity * oi.unit_price), 0), 2) AS NUMERIC(7,2)) AS margin_pct, RANK() OVER (PARTITION BY p.category ORDER BY SUM(oi.quantity * oi.unit_price) - SUM(COALESCE(oi.line_discount, 0)) - SUM(oi.quantity * p.unit_cost) DESC) AS rank_in_category, CAST(ROUND(100 * SUM(SUM(oi.quantity * oi.unit_price)) OVER (ORDER BY SUM(oi.quantity * oi.unit_price) DESC, p.id ROWS UNBOUNDED PRECEDING) / SUM(SUM(oi.quantity * oi.unit_price)) OVER (), 2) AS NUMERIC(7,2)) AS cumulative_gross_pct FROM products p JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' GROUP BY p.id, p.name, p.category ORDER BY margin DESC, p.id"
    profile: iq17-default
  - id: sales_rep_league_table
    sql: "SELECT e.id, e.first_name || ' ' || e.last_name AS rep, m.last_name AS manager, r.name AS region, COUNT(DISTINCT o.id) AS orders, COUNT(DISTINCT o.customer_id) AS customers, SUM(oi.quantity * oi.unit_price) AS revenue, MAX(SUM(oi.quantity * oi.unit_price)) OVER () - SUM(oi.quantity * oi.unit_price) AS gap_to_leader, NTILE(4) OVER (ORDER BY SUM(oi.quantity * oi.unit_price) DESC, e.id) AS quartile, CAST(ROUND(PERCENT_RANK() OVER (ORDER BY SUM(oi.quantity * oi.unit_price)), 3) AS NUMERIC(4,3)) AS pct_rank, DENSE_RANK() OVER (PARTITION BY e.region_id ORDER BY COUNT(DISTINCT o.id) DESC) AS rank_by_orders_in_region FROM employees e LEFT JOIN employees m ON m.id = e.manager_id LEFT JOIN regions r ON r.id = e.region_id JOIN orders o ON o.sales_rep_id = e.id JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY e.id, e.first_name, e.last_name, m.last_name, r.name, e.region_id ORDER BY revenue DESC, e.id"
    profile: iq17-default
  - id: order_fulfilment_sla
    sql: "SELECT o.id, o.channel, CAST(o.order_ts AS DATE) AS ordered, o.ship_date, DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) AS days_to_ship, DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) - 2 * DATEDIFF(WEEK, CAST(o.order_ts AS DATE), o.ship_date) AS approx_business_days, (SELECT MIN(p.paid_ts) FROM payments p WHERE p.order_id = o.id) AS first_paid, (SELECT COALESCE(SUM(p.amount), 0) FROM payments p WHERE p.order_id = o.id) AS paid, CASE WHEN o.ship_date IS NULL AND o.status = 'shipped' THEN 'data issue' WHEN o.ship_date IS NULL THEN 'unshipped' WHEN DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) > 3 THEN 'late' ELSE 'on time' END AS sla, SUM(CASE WHEN DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) > 3 THEN 1 ELSE 0 END) OVER (PARTITION BY DATEFORMAT(o.order_ts, 'yyyy-mm')) AS late_in_month FROM orders o WHERE o.order_ts >= '2025-01-01' ORDER BY o.id"
    profile: iq17-default
