# The IQ scale program's realistic reports (2026-10-25): depth_combinations, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: products_one_region_buys_and_another_never
    sql: "SELECT p.id, p.name, p.category, (SELECT COUNT(DISTINCT o.id) FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON c.id = o.customer_id WHERE oi.product_id = p.id AND c.region_id = 1) AS north_orders FROM products p WHERE EXISTS (SELECT 1 FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN customers c ON c.id = o.customer_id WHERE oi.product_id = p.id AND c.region_id = 1) AND NOT EXISTS (SELECT 1 FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN customers c ON c.id = o.customer_id WHERE oi.product_id = p.id AND c.region_id = 5) ORDER BY p.id"
    profile: iq17-default
  - id: segment_kpis_with_distinct_cases
    sql: "SELECT c.segment, COUNT(DISTINCT c.id) AS customers, COUNT(DISTINCT CASE WHEN o.status = 'shipped' THEN o.customer_id END) AS buyers, COUNT(DISTINCT CASE WHEN o.status = 'returned' THEN o.customer_id END) AS returners, COUNT(DISTINCT CASE WHEN o.channel = 'web' THEN o.id END) AS web_orders, CAST(100.0 * COUNT(DISTINCT CASE WHEN o.status = 'shipped' THEN o.customer_id END) / COUNT(DISTINCT c.id) AS NUMERIC(5,1)) AS buyer_rate, SUM(CASE WHEN o.status = 'returned' THEN 1 ELSE 0 END) AS returned_orders FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.segment ORDER BY c.segment"
    profile: iq17-default
  - id: year_over_year_with_arrows
    sql: "WITH yearly AS (SELECT p.category, YEAR(o.order_ts) AS yr, SUM(oi.quantity * oi.unit_price) AS revenue, COUNT(DISTINCT o.id) AS orders FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON p.id = oi.product_id WHERE o.status <> 'cancelled' GROUP BY p.category, YEAR(o.order_ts)) SELECT category, yr, revenue, orders, LAG(revenue) OVER (PARTITION BY category ORDER BY yr) AS prior, CAST(100 * (revenue - LAG(revenue) OVER (PARTITION BY category ORDER BY yr)) / NULLIF(LAG(revenue) OVER (PARTITION BY category ORDER BY yr), 0) AS NUMERIC(8,1)) AS growth_pct, CASE WHEN LAG(revenue) OVER (PARTITION BY category ORDER BY yr) IS NULL THEN '-' WHEN revenue > LAG(revenue) OVER (PARTITION BY category ORDER BY yr) THEN '^' WHEN revenue < LAG(revenue) OVER (PARTITION BY category ORDER BY yr) THEN 'v' ELSE '=' END AS arrow, CAST(revenue / orders AS NUMERIC(10,2)) AS per_order FROM yearly ORDER BY category, yr"
    profile: iq17-default
  - id: share_thresholds_by_region
    sql: "WITH spend AS (SELECT c.region_id, c.id AS customer_id, SUM(oi.quantity * oi.unit_price) AS spent FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY c.region_id, c.id) SELECT r.name AS region, s.customer_id, s.spent, CAST(100 * s.spent / SUM(s.spent) OVER (PARTITION BY s.region_id) AS NUMERIC(6,2)) AS share_pct, CASE WHEN 100 * s.spent / SUM(s.spent) OVER (PARTITION BY s.region_id) >= 40 THEN 'dominant' WHEN 100 * s.spent / SUM(s.spent) OVER (PARTITION BY s.region_id) >= 20 THEN 'major' ELSE 'minor' END AS weight, DENSE_RANK() OVER (PARTITION BY s.region_id ORDER BY s.spent DESC) AS rank_in_region, NTILE(3) OVER (ORDER BY s.spent DESC, s.customer_id) AS overall_tercile FROM spend s JOIN regions r ON r.id = s.region_id ORDER BY r.name, rank_in_region, s.customer_id"
    profile: iq17-default
  - id: median_versus_mean_by_category
    sql: "SELECT p.category, COUNT(*) AS lines, CAST(AVG(oi.quantity * oi.unit_price) AS NUMERIC(10,2)) AS mean_line, MEDIAN(oi.quantity * oi.unit_price) AS median_line, CASE WHEN AVG(oi.quantity * oi.unit_price) > 1.5 * MEDIAN(oi.quantity * oi.unit_price) THEN 'skewed by large lines' ELSE 'balanced' END AS shape, MAX(oi.quantity * oi.unit_price) AS largest_line, MIN(oi.quantity * oi.unit_price) AS smallest_line FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.category ORDER BY p.category"
    profile: iq17-default
  - id: ticket_bursts_within_a_week
    sql: "WITH t AS (SELECT id, customer_id, opened_ts, CASE WHEN DATEDIFF(DAY, LAG(opened_ts) OVER (PARTITION BY customer_id ORDER BY opened_ts, id), opened_ts) <= 7 THEN 0 ELSE 1 END AS starts_burst FROM support_tickets), b AS (SELECT id, customer_id, opened_ts, SUM(starts_burst) OVER (PARTITION BY customer_id ORDER BY opened_ts, id ROWS UNBOUNDED PRECEDING) AS burst FROM t) SELECT customer_id, burst, COUNT(*) AS tickets, MIN(opened_ts) AS first_ticket, MAX(opened_ts) AS last_ticket FROM b GROUP BY customer_id, burst HAVING COUNT(*) >= 2 ORDER BY customer_id, burst"
    profile: iq17-default
  - id: supplier_cheapest_and_speed
    sql: "SELECT s.id, s.name, s.country, COUNT(sp.id) AS products_offered, SUM(CASE WHEN sp.unit_cost = b.best THEN 1 ELSE 0 END) AS cheapest_on, CAST(AVG(sp.lead_days) AS NUMERIC(5,1)) AS avg_lead_days, MAX(sp.lead_days) AS slowest, CASE WHEN AVG(sp.lead_days) <= 10 THEN 'fast' WHEN AVG(sp.lead_days) <= 20 THEN 'standard' ELSE 'slow' END AS speed FROM suppliers s LEFT JOIN supplier_products sp ON sp.supplier_id = s.id LEFT JOIN (SELECT product_id, MIN(unit_cost) AS best FROM supplier_products GROUP BY product_id) b ON b.product_id = sp.product_id GROUP BY s.id, s.name, s.country ORDER BY cheapest_on DESC, s.id"
    profile: iq17-default
  - id: inventory_cover_in_days
    sql: "WITH latest AS (SELECT product_id, on_hand, reorder_point, snapshot_date, ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY snapshot_date DESC, id DESC) AS rn FROM inventory), demand AS (SELECT oi.product_id, SUM(oi.quantity) AS units_90d FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' AND o.order_ts >= DATEADD(DAY, -90, CAST('2026-01-01' AS TIMESTAMP)) GROUP BY oi.product_id) SELECT p.id, p.name, l.on_hand, COALESCE(d.units_90d, 0) AS units_90d, CASE WHEN COALESCE(d.units_90d, 0) = 0 THEN NULL ELSE CAST(l.on_hand * 90.0 / d.units_90d AS NUMERIC(8,1)) END AS days_of_cover, CASE WHEN l.on_hand <= l.reorder_point THEN 'order now' WHEN COALESCE(d.units_90d, 0) > 0 AND l.on_hand * 90 / d.units_90d < 30 THEN 'order soon' ELSE 'covered' END AS action FROM products p JOIN latest l ON l.product_id = p.id AND l.rn = 1 LEFT JOIN demand d ON d.product_id = p.id ORDER BY p.id"
    profile: iq17-default
  - id: customer_lifetime_summary
    sql: "SELECT c.id, TRIM(c.first_name) || ' ' || TRIM(c.last_name) AS customer, c.segment, DATEDIFF(MONTH, c.signup_date, CAST('2026-01-01' AS DATE)) AS months_since_signup, COALESCE(x.orders, 0) AS orders, COALESCE(x.spent, 0) AS spent, CAST(COALESCE(x.spent, 0) / NULLIF(DATEDIFF(MONTH, c.signup_date, CAST('2026-01-01' AS DATE)), 0) AS NUMERIC(10,2)) AS spend_per_month, COALESCE(y.paid, 0) AS paid, COALESCE(x.spent, 0) - COALESCE(y.paid, 0) AS balance, CASE WHEN x.orders IS NULL THEN 'prospect' WHEN x.orders = 1 THEN 'one-time' WHEN x.orders <= 4 THEN 'repeat' ELSE 'loyal' END AS tier FROM customers c LEFT JOIN (SELECT o.customer_id, COUNT(DISTINCT o.id) AS orders, SUM(oi.quantity * oi.unit_price) AS spent FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id) x ON x.customer_id = c.id LEFT JOIN (SELECT o.customer_id, SUM(p.amount) AS paid FROM payments p JOIN orders o ON o.id = p.order_id GROUP BY o.customer_id) y ON y.customer_id = c.id ORDER BY c.id"
    profile: iq17-default
  - id: discount_band_effectiveness
    sql: "SELECT CASE WHEN o.discount_pct = 0 THEN 'none' WHEN o.discount_pct <= 0.10 THEN 'up to 10%' WHEN o.discount_pct <= 0.20 THEN '11-20%' ELSE 'over 20%' END AS discount_band, COUNT(DISTINCT o.id) AS orders, CAST(AVG(t.items) AS NUMERIC(6,2)) AS avg_items, CAST(AVG(t.gross) AS NUMERIC(10,2)) AS avg_gross, CAST(AVG(t.gross * (1 - o.discount_pct)) AS NUMERIC(10,2)) AS avg_net, SUM(CASE WHEN o.status = 'returned' THEN 1 ELSE 0 END) AS returns FROM orders o JOIN (SELECT order_id, SUM(quantity) AS items, SUM(quantity * unit_price) AS gross FROM order_items GROUP BY order_id) t ON t.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY CASE WHEN o.discount_pct = 0 THEN 'none' WHEN o.discount_pct <= 0.10 THEN 'up to 10%' WHEN o.discount_pct <= 0.20 THEN '11-20%' ELSE 'over 20%' END ORDER BY MIN(o.discount_pct)"
    profile: iq17-default
  - id: web_funnel_by_device
    sql: "SELECT w.device, COUNT(DISTINCT w.customer_id) AS visitors, COUNT(DISTINCT CASE WHEN w.url LIKE '%/product%' THEN w.customer_id END) AS viewed_product, COUNT(DISTINCT CASE WHEN w.url LIKE '%/cart%' THEN w.customer_id END) AS added_to_cart, COUNT(DISTINCT CASE WHEN w.url LIKE '%/checkout%' THEN w.customer_id END) AS reached_checkout, CAST(100.0 * COUNT(DISTINCT CASE WHEN w.url LIKE '%/checkout%' THEN w.customer_id END) / NULLIF(COUNT(DISTINCT w.customer_id), 0) AS NUMERIC(5,1)) AS checkout_rate FROM web_events w WHERE w.customer_id IS NOT NULL GROUP BY w.device ORDER BY w.device"
    profile: iq17-default
