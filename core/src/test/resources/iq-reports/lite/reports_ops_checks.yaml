# The IQ scale program's realistic reports (2026-10-25): ops_checks, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: gap_to_next_order
    sql: "WITH seq AS ( SELECT o.customer_id, o.id, o.order_ts, LEAD(o.order_ts) OVER (PARTITION BY o.customer_id ORDER BY o.order_ts, o.id) AS next_ts FROM orders o WHERE o.status <> 'cancelled') SELECT customer_id, COUNT(*) AS orders, COUNT(next_ts) AS repeat_orders, MIN(DATEDIFF(DAY, order_ts, next_ts)) AS shortest_gap_days, MAX(DATEDIFF(DAY, order_ts, next_ts)) AS longest_gap_days, CAST(AVG(DATEDIFF(DAY, order_ts, next_ts) * 1.0) AS NUMERIC(8,1)) AS average_gap_days FROM seq GROUP BY customer_id HAVING COUNT(next_ts) >= 2 ORDER BY customer_id"
    profile: iq17-default
  - id: first_and_last_purchase_per_customer
    sql: "SELECT DISTINCT o.customer_id, FIRST_VALUE(o.id) OVER (PARTITION BY o.customer_id ORDER BY o.order_ts, o.id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS first_order, LAST_VALUE(o.id) OVER (PARTITION BY o.customer_id ORDER BY o.order_ts, o.id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_order, COUNT(*) OVER (PARTITION BY o.customer_id) AS orders FROM orders o WHERE o.status IN ('shipped', 'returned') ORDER BY o.customer_id"
    profile: iq17-default
  - id: sold_below_list_price
    sql: "SELECT p.id, p.name, p.unit_price AS list_price, MIN(oi.unit_price) AS lowest_sold, MAX(oi.unit_price) AS highest_sold, GREATER(MAX(oi.unit_price) - p.unit_price, 0) AS most_above_list, LESSER(MIN(oi.unit_price) - p.unit_price, 0) AS most_below_list, SUM(CASE WHEN oi.unit_price < p.unit_price THEN oi.quantity ELSE 0 END) AS units_below_list FROM products p JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id, p.name, p.unit_price HAVING MIN(oi.unit_price) <> p.unit_price OR MAX(oi.unit_price) <> p.unit_price ORDER BY p.id"
    profile: iq17-default
  - id: payments_reconciled_against_orders
    sql: "WITH owed AS ( SELECT o.id, o.status, SUM(oi.quantity * oi.unit_price - COALESCE(oi.line_discount, 0)) + o.shipping_fee AS due FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.id, o.status, o.shipping_fee), paid AS (SELECT order_id, SUM(amount) AS paid, COUNT(*) AS payments FROM payments GROUP BY order_id) SELECT w.id, w.status, w.due, COALESCE(p.paid, 0) AS paid, COALESCE(p.payments, 0) AS payments, w.due - COALESCE(p.paid, 0) AS balance, CASE WHEN p.paid IS NULL THEN 'unpaid' WHEN ABS(w.due - p.paid) < 0.01 THEN 'settled' WHEN p.paid > w.due THEN 'overpaid' ELSE 'partial' END AS state FROM owed w LEFT JOIN paid p ON p.order_id = w.id WHERE w.status <> 'cancelled' AND (p.paid IS NULL OR ABS(w.due - p.paid) >= 0.01) ORDER BY w.id"
    profile: iq17-default
  - id: ticket_sla_breaches_by_agent
    sql: "WITH timed AS ( SELECT t.agent_id, t.priority, DATEDIFF(HOUR, t.opened_ts, COALESCE(t.closed_ts, CAST('2025-12-31 23:59:59' AS TIMESTAMP))) AS hours_open, CASE t.priority WHEN 'urgent' THEN 4 WHEN 'high' THEN 24 WHEN 'normal' THEN 72 ELSE 168 END AS sla_hours FROM support_tickets t WHERE t.agent_id IS NOT NULL) SELECT agent_id, COUNT(*) AS tickets, SUM(CASE WHEN hours_open > sla_hours THEN 1 ELSE 0 END) AS breaches, CAST(100.0 * SUM(CASE WHEN hours_open > sla_hours THEN 1 ELSE 0 END) / COUNT(*) AS NUMERIC(5,1)) AS breach_pct, MAX(hours_open - sla_hours) AS worst_overrun_hours FROM timed GROUP BY agent_id ORDER BY breach_pct DESC, agent_id"
    profile: iq17-default
  - id: promotions_overlapping_in_category
    sql: "SELECT a.code AS first_code, b.code AS second_code, COALESCE(a.category, 'all') AS category, GREATER(a.starts, b.starts) AS overlap_starts, LESSER(a.ends, b.ends) AS overlap_ends, DATEDIFF(DAY, GREATER(a.starts, b.starts), LESSER(a.ends, b.ends)) + 1 AS overlap_days FROM promotions a JOIN promotions b ON a.id < b.id AND a.starts <= b.ends AND b.starts <= a.ends AND (a.category = b.category OR a.category IS NULL OR b.category IS NULL) ORDER BY a.code, b.code"
    profile: iq17-default
  - id: exchange_rate_feed_gaps
    sql: "WITH feed AS ( SELECT currency, rate_date, usd_rate, LAG(rate_date) OVER (PARTITION BY currency ORDER BY rate_date) AS prior_date, LAG(usd_rate) OVER (PARTITION BY currency ORDER BY rate_date) AS prior_rate FROM exchange_rates) SELECT currency, prior_date, rate_date, DATEDIFF(DAY, prior_date, rate_date) AS days_between, CAST(100 * (usd_rate - prior_rate) / prior_rate AS NUMERIC(7,3)) AS change_pct FROM feed WHERE prior_date IS NOT NULL AND (DATEDIFF(DAY, prior_date, rate_date) > 31 OR ABS(usd_rate - prior_rate) / prior_rate > 0.02) ORDER BY currency, rate_date"
    profile: iq17-default
  - id: second_highest_salary_per_region
    sql: "SELECT r.name AS region, (SELECT MAX(e.salary) FROM employees e WHERE e.region_id = r.id) AS highest, (SELECT MAX(e.salary) FROM employees e WHERE e.region_id = r.id AND e.salary < (SELECT MAX(e2.salary) FROM employees e2 WHERE e2.region_id = r.id)) AS second_highest, (SELECT COUNT(*) FROM employees e WHERE e.region_id = r.id) AS headcount FROM regions r ORDER BY r.name"
    profile: iq17-default
  - id: days_of_cover_and_runout_date
    sql: "WITH daily AS ( SELECT oi.product_id, SUM(oi.quantity) * 1.0 / 90 AS units_per_day FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE o.status <> 'cancelled' AND o.order_ts >= '2025-10-01' AND o.order_ts < '2025-12-30' GROUP BY oi.product_id), latest AS ( SELECT i.product_id, i.snapshot_date, i.on_hand, i.reorder_point FROM inventory i WHERE i.snapshot_date = (SELECT MAX(i2.snapshot_date) FROM inventory i2 WHERE i2.product_id = i.product_id)) SELECT l.product_id, l.snapshot_date, l.on_hand, l.reorder_point, CAST(d.units_per_day AS NUMERIC(8,3)) AS units_per_day, CASE WHEN d.units_per_day IS NULL OR d.units_per_day = 0 THEN NULL ELSE CAST(FLOOR(l.on_hand / d.units_per_day) AS INTEGER) END AS days_of_cover, CASE WHEN d.units_per_day IS NULL OR d.units_per_day = 0 THEN NULL ELSE DATEADD(DAY, CAST(FLOOR(l.on_hand / d.units_per_day) AS INTEGER), l.snapshot_date) END AS runout_date FROM latest l LEFT JOIN daily d ON d.product_id = l.product_id ORDER BY l.product_id"
    profile: iq17-default
  - id: orders_shipped_on_weekends
    sql: "SELECT DATENAME(WEEKDAY, o.ship_date) AS ship_day, COUNT(*) AS orders, CAST(AVG(DATEDIFF(DAY, CAST(o.order_ts AS DATE), o.ship_date) * 1.0) AS NUMERIC(6,2)) AS average_lead_days, MIN(o.ship_date) AS first_ship, MAX(o.ship_date) AS last_ship FROM orders o WHERE o.ship_date IS NOT NULL AND DOW(o.ship_date) IN (1, 7) GROUP BY DATENAME(WEEKDAY, o.ship_date) ORDER BY 1"
    profile: iq17-default
  - id: customer_activity_bits_by_quarter
    sql: "WITH q AS ( SELECT o.customer_id, SUM(DISTINCT CASE QUARTER(o.order_ts) WHEN 1 THEN 1 WHEN 2 THEN 2 WHEN 3 THEN 4 ELSE 8 END) AS quarters FROM orders o WHERE YEAR(o.order_ts) = 2025 AND o.status <> 'cancelled' GROUP BY o.customer_id) SELECT q.quarters, (q.quarters & 1) + (q.quarters & 2) / 2 + (q.quarters & 4) / 4 + (q.quarters & 8) / 8 AS active_quarters, COUNT(*) AS customers FROM q GROUP BY q.quarters ORDER BY q.quarters"
    profile: iq17-default
  - id: lifetime_value_bands_with_running_share
    sql: "WITH ltv AS ( SELECT o.customer_id, SUM(oi.quantity * oi.unit_price) AS value FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.customer_id), banded AS ( SELECT customer_id, value, CASE WHEN value >= 5000 THEN 'platinum' WHEN value >= 2000 THEN 'gold' WHEN value >= 500 THEN 'silver' ELSE 'bronze' END AS band FROM ltv) SELECT band, COUNT(*) AS customers, SUM(value) AS band_value, CAST(100 * SUM(value) / SUM(SUM(value)) OVER () AS NUMERIC(6,2)) AS value_share_pct, CAST(100 * SUM(SUM(value)) OVER (ORDER BY MIN(value) DESC ROWS UNBOUNDED PRECEDING) / SUM(SUM(value)) OVER () AS NUMERIC(6,2)) AS running_share_pct FROM banded GROUP BY band ORDER BY MIN(value) DESC"
    profile: iq17-default
  - id: product_names_normalized
    sql: "SELECT p.id, p.name, UPPER(LEFT(p.category, 1)) || LOWER(SUBSTRING(p.category, 2)) || ' / ' || p.subcategory AS path, LENGTH(p.name) - LENGTH(REPLACE(p.name, ' ', '')) + 1 AS words, CASE WHEN PATINDEX('%[0-9]%', p.name) > 0 THEN 'has digits' ELSE 'letters only' END AS digits, REPLACE(LOWER(TRIM(p.name)), ' ', '-') AS slug FROM products p ORDER BY p.id"
    profile: iq17-default
