# The IQ scale program's realistic reports (2026-10-25): customer_hygiene_reports, as analysts write them, over the retail
# schema (iq-reports/schema.yaml), judged by the live IQ (iq17-default). tools/iq-oracle's README.md has the keys.
tests:
  - id: email_domain_breakdown
    sql: "SELECT LOWER(SUBSTRING(email, LOCATE(email, '@') + 1)) AS domain, CASE WHEN LOWER(SUBSTRING(email, LOCATE(email, '@') + 1)) IN ('gmail.com', 'yahoo.com', 'outlook.com') THEN 'consumer' ELSE 'business' END AS kind, COUNT(*) AS customers, SUM(CASE WHEN is_active = 1 THEN 1 ELSE 0 END) AS active, SUM(CASE WHEN email <> LOWER(email) THEN 1 ELSE 0 END) AS not_lower_case FROM customers WHERE email IS NOT NULL GROUP BY LOWER(SUBSTRING(email, LOCATE(email, '@') + 1)) ORDER BY customers DESC, domain"
    profile: iq17-default
  - id: phone_numbers_normalized
    sql: "WITH cleaned AS ( SELECT id, TRIM(first_name) || ' ' || TRIM(last_name) AS customer, phone, REPLACE(REPLACE(REPLACE(REPLACE(phone, '(', ''), ')', ''), '-', ''), ' ', '') AS digits FROM customers WHERE phone IS NOT NULL) SELECT id, customer, phone, digits, '(' || LEFT(digits, 3) || ') ' || SUBSTRING(digits, 4, 3) || '-' || RIGHT(digits, 4) AS formatted, CASE WHEN LENGTH(digits) = 10 THEN 'ok' ELSE 'check' END AS validity, LEFT(digits, 3) AS area_code FROM cleaned ORDER BY area_code, id"
    profile: iq17-default
  - id: duplicate_customer_candidates
    sql: "SELECT a.id AS first_id, b.id AS second_id, TRIM(a.first_name) || ' ' || TRIM(a.last_name) AS first_customer, TRIM(b.first_name) || ' ' || TRIM(b.last_name) AS second_customer, CASE WHEN LOWER(a.email) = LOWER(b.email) THEN 'same e-mail' WHEN TRIM(a.last_name) = TRIM(b.last_name) AND a.city = b.city THEN 'same name and city' ELSE 'similar name, same region' END AS reason FROM customers a JOIN customers b ON a.id < b.id AND (LOWER(a.email) = LOWER(b.email) OR TRIM(a.last_name) = TRIM(b.last_name) AND a.city = b.city OR SOUNDEX(a.last_name) = SOUNDEX(b.last_name) AND a.region_id = b.region_id) ORDER BY a.id, b.id"
    profile: iq17-default
  - id: age_bands_by_segment
    sql: "WITH ages AS ( SELECT id, segment, credit_limit, 2025 - YEAR(birth_date) - CASE WHEN MONTH(birth_date) * 100 + DAY(birth_date) > 630 THEN 1 ELSE 0 END AS age FROM customers WHERE birth_date IS NOT NULL) SELECT CASE WHEN age < 35 THEN 'under 35' WHEN age < 50 THEN '35-49' WHEN age < 65 THEN '50-64' ELSE '65+' END AS age_band, segment, COUNT(*) AS customers, CAST(AVG(credit_limit) AS NUMERIC(10,2)) AS average_limit, MIN(age) AS youngest, MAX(age) AS oldest FROM ages GROUP BY CASE WHEN age < 35 THEN 'under 35' WHEN age < 50 THEN '35-49' WHEN age < 65 THEN '50-64' ELSE '65+' END, segment ORDER BY 1, 2"
    profile: iq17-default
  - id: birthdays_in_the_next_45_days
    sql: "WITH birthdays AS ( SELECT id, TRIM(first_name) || ' ' || TRIM(last_name) AS customer, birth_date, CASE WHEN DATEADD(YEAR, 2025 - YEAR(birth_date), birth_date) >= '2025-11-20' THEN DATEADD(YEAR, 2025 - YEAR(birth_date), birth_date) ELSE DATEADD(YEAR, 2026 - YEAR(birth_date), birth_date) END AS upcoming FROM customers WHERE birth_date IS NOT NULL) SELECT id, customer, birth_date, CAST(upcoming AS DATE) AS upcoming_birthday, DATEDIFF(DAY, CAST('2025-11-20' AS DATE), upcoming) AS days_away, DATENAME(WEEKDAY, upcoming) AS weekday FROM birthdays WHERE DATEDIFF(DAY, CAST('2025-11-20' AS DATE), upcoming) <= 45 ORDER BY days_away, id"
    profile: iq17-default
  - id: customer_status_by_subqueries
    sql: "SELECT c.id, TRIM(c.last_name) AS customer, c.signup_date, DATEDIFF(MONTH, c.signup_date, CAST('2025-12-31' AS DATE)) AS tenure_months, (SELECT COUNT(*) FROM orders o WHERE o.customer_id = c.id AND o.status <> 'cancelled') AS order_count, (SELECT MAX(CAST(o.order_ts AS DATE)) FROM orders o WHERE o.customer_id = c.id) AS last_order, COALESCE((SELECT SUM(p.amount) FROM payments p JOIN orders o ON o.id = p.order_id WHERE o.customer_id = c.id), 0) AS total_paid, CASE WHEN NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id) THEN 'never ordered' WHEN (SELECT MAX(o.order_ts) FROM orders o WHERE o.customer_id = c.id) < '2025-01-01' THEN 'dormant' ELSE 'active' END AS customer_status FROM customers c ORDER BY c.id"
    profile: iq17-default
  - id: open_balances_billed_against_paid
    sql: "WITH billed AS ( SELECT o.id, o.customer_id, SUM(oi.quantity * oi.unit_price - oi.line_discount) * (1 - o.discount_pct) AS amount_billed FROM orders o JOIN order_items oi ON oi.order_id = o.id WHERE o.status <> 'cancelled' GROUP BY o.id, o.customer_id, o.discount_pct), paid AS (SELECT order_id, SUM(amount) AS amount_paid, COUNT(*) AS payment_count FROM payments GROUP BY order_id) SELECT b.customer_id, COUNT(*) AS orders_billed, SUM(b.amount_billed) AS total_billed, SUM(COALESCE(p.amount_paid, 0)) AS total_paid, SUM(b.amount_billed) - SUM(COALESCE(p.amount_paid, 0)) AS open_balance, SUM(CASE WHEN p.order_id IS NULL THEN 1 ELSE 0 END) AS unpaid_orders FROM billed b LEFT JOIN paid p ON p.order_id = b.id GROUP BY b.customer_id HAVING SUM(b.amount_billed) - SUM(COALESCE(p.amount_paid, 0)) > 1 ORDER BY open_balance DESC, b.customer_id"
    profile: iq17-default
