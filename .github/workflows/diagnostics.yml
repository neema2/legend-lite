# THE DIAGNOSTICS BATTERY — parser-equivalence's censuses, sizers and parse-speed
# benchmark: MEASUREMENTS, not gates, run on the triggers that change their inputs
# (a pin, the corpus, the parser, the protocol, parser-equivalence itself).
# `bazel test //parser-equivalence:diagnostics` names every class, so a renamed
# or deleted diagnostic fails the run instead of silently shrinking the battery.
name: diagnostics
on:
  push:
    branches: [main]
    paths:
      - MODULE.bazel
      - tools/oracle-pins.env
      - parser-equivalence/**
      - core/src/main/java/com/legend/parser/**
      - core/src/main/java/com/legend/lexer/**
      - core/src/main/java/com/legend/protocol/**
  pull_request:
    paths:
      - MODULE.bazel
      - tools/oracle-pins.env
      - parser-equivalence/**
      - core/src/main/java/com/legend/parser/**
      - core/src/main/java/com/legend/lexer/**
      - core/src/main/java/com/legend/protocol/**
  workflow_dispatch:

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: diagnostics battery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-linux-${{ hashFiles('MODULE.bazel.lock', 'maven_*_install.json', '.bazelversion') }}-diagnostics
          restore-keys: |
            bazel-linux-${{ hashFiles('MODULE.bazel.lock', 'maven_*_install.json', '.bazelversion') }}-
            bazel-linux-
      - name: run the battery
        run: >-
          bazel test --config=ci --repository_cache="$HOME/.cache/bazel-repo"
          --disk_cache="$HOME/.cache/bazel-disk" //parser-equivalence:diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-reports
          path: |
            bazel-testlogs/parser-equivalence/diagnostics/test.log
            bazel-testlogs/parser-equivalence/diagnostics/test.outputs/**
          if-no-files-found: ignore
