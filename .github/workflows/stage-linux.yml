# THROWAWAY (2026-11-16, the owner's word): Linux-only gates on every push to D's staging branch while D's pieces
# land. Remove before D's PR is opened for review; never for main.
name: stage-linux
on:
  push:
    branches: [claude/total-wall-d-stage]
    paths-ignore:
      - "**/*.md"
      - progress*.txt
  workflow_dispatch:
concurrency:
  group: stage-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    uses: ./.github/workflows/gates-run.yml
    secrets: inherit
    with:
      runs-on: ubuntu-24.04
      platform: linux
      linux-only-tests: ci-policy
      gates: ""
