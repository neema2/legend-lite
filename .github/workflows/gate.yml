# THE STANDING GATE — every gate (docs/GATES.md) on Linux, macOS and Windows,
# in parallel, on every push: `bazel test` on each gate's targets, one lane per
# gate (gates-run.yml). Gate policy lives in the BUILD files — each gate is a
# test target — so adding a gate adds a target and a lane, never a script.
#
# WHY THREE PLATFORMS. On 2026-09-09 the first CI run found that DuckDB's
# percentile_cont returns a different double on x86_64 than on arm64, reddening
# three lanes. A single-platform pipeline cannot see that class of bug by
# construction. The three are independent jobs, so the wall clock is the SLOWEST
# platform rather than the sum, and the runners are free for a public repository.
#
# macOS is arm64 — the architecture the rosters and goldens were minted on, so it
# is the reference configuration. Windows is the genuinely new surface;
# gates-run.yml carries its checkout guards (autocrlf would rewrite the .pure
# corpus and break byte-exact parser parity; the upstream trees' deep paths need
# core.longpaths).
name: gates
on:
  push:
    branches: [main]
    # Prose cannot change a gate's verdict, and a lane costs runner minutes — a
    # documentation commit must not spend them.
    paths-ignore:
      - "**/*.md"
      - progress*.txt
  pull_request:
    paths-ignore:
      - "**/*.md"
      - progress*.txt
  # Every night on main. A PR merged up to date carries [skip ci] in its merge message (its run already tested
  # exactly the merged result), so this is main's own verdict, and it refreshes the build cache every PR run
  # starts from (a PR's run can read main's cache; main cannot read a PR's).
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      gates:
        description: "Comma-separated lanes to run (empty = all): 1,checks,3,4,5,6,7,7p,8,9,10,app,misc,build,native,browser (4 includes the judge differential, once gate 11; browser is Linux only)."
        default: ""
        type: string
      platforms:
        description: "Which platforms to run."
        default: all
        type: choice
        options: [all, linux, macos, windows, linux-arm]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  # Only a PR's superseded run is cancelled: every commit on main gets a verdict, so `gates green` is never
  # red merely because a newer push cancelled it (revert-on-red would revert a good commit).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A workflow whose OWN file is invalid never runs (GitHub reports zero jobs
  # and names the run after the file path — how the first version of this file
  # failed). So workflows are linted LOCALLY before a push, and here as well,
  # which catches an edit to any OTHER workflow before it is merged.
  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: ubuntu-latest
      platform: linux
      gates: ${{ inputs.gates }}

  macos:
    # macos-14 and later are arm64. Pinned rather than -latest so a runner
    # image flip is a deliberate commit, like the upstream pins.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: macos-14
      platform: macos
      # 3 vCPU / 7 GB TOTAL: one test JVM at a time
      low-memory: true
      gates: ${{ inputs.gates }}

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: windows-2022
      platform: windows
      gates: ${{ inputs.gates }}

  # LINUX ARM64 (Bazel workplan P1-13): the native warehouse on a real arm64 runner, with the hermetic C
  # toolchain. CI had never run Linux arm64; the native-image crash seen under Docker Desktop on Apple silicon
  # does not happen on real hardware (run 37139357779). The native lane only, until P5-03.
  linux-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux-arm' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: ubuntu-24.04-arm
      platform: linux-arm
      gates: native

  # THE ONE REQUIRED CHECK (Bazel workplan P0-14, D17): main's ruleset requires this job, not the ~50 lane
  # jobs, whose names move with every lane change. It fails unless every job above succeeded. It does not
  # run on workflow_dispatch: a dispatch can choose a subset of lanes or platforms, and its green would
  # satisfy the required check on that commit.
  green:
    name: gates green
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [workflows, linux, macos, windows, linux-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          if echo "$RESULTS" | grep -q -E '"(failure|cancelled)"'; then
            echo "::error ::a gate job did not succeed: $RESULTS"
            exit 1
          fi
