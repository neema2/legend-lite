# THE STANDING GATE — every gate (docs/GATES.md) on Linux, macOS and Windows,
# in parallel, on every push: `bazel test` on each gate's targets, one lane per
# gate (gates-run.yml). Gate policy lives in the BUILD files — each gate is a
# test target — so adding a gate adds a target and a lane, never a script.
#
# WHY THREE PLATFORMS. On 2026-09-09 the first CI run found that DuckDB's
# percentile_cont returns a different double on x86_64 than on arm64, reddening
# three lanes. A single-platform pipeline cannot see that class of bug by
# construction. The three are independent jobs, so the wall clock is the SLOWEST
# platform rather than the sum, and the runners are free for a public repository.
#
# macOS is arm64 — the architecture the rosters and goldens were minted on, so it
# is the reference configuration. Windows is the genuinely new surface;
# gates-run.yml carries its checkout guards (autocrlf would rewrite the .pure
# corpus and break byte-exact parser parity; the upstream trees' deep paths need
# core.longpaths).
name: gates
on:
  push:
    branches: [main]
    # Prose cannot change a gate's verdict, and a lane costs runner minutes — a
    # documentation commit must not spend them.
    paths-ignore:
      - "**/*.md"
      - progress*.txt
  pull_request:
    paths-ignore:
      - "**/*.md"
      - progress*.txt
  workflow_dispatch:
    inputs:
      gates:
        description: "Comma-separated lanes to run (empty = all): 1,checks,3,4,5,6,7,8,9,10,11."
        default: ""
        type: string
      platforms:
        description: "Which platforms to run."
        default: all
        type: choice
        options: [all, linux, macos, windows]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow whose OWN file is invalid never runs (GitHub reports zero jobs
  # and names the run after the file path — how the first version of this file
  # failed). So workflows are linted LOCALLY before a push, and here as well,
  # which catches an edit to any OTHER workflow before it is merged.
  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: ubuntu-latest
      platform: linux
      gates: ${{ inputs.gates }}

  macos:
    # macos-14 and later are arm64. Pinned rather than -latest so a runner
    # image flip is a deliberate commit, like the upstream pins.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: macos-14
      platform: macos
      # 3 vCPU / 7 GB TOTAL: one test JVM at a time, one PCT suite per JVM
      low-memory: true
      gates: ${{ inputs.gates }}

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    uses: ./.github/workflows/gates-run.yml
    with:
      runs-on: windows-2022
      platform: windows
      gates: ${{ inputs.gates }}
