# ONE PLATFORM'S GATES, as parallel lanes: each lane is `bazel test` on the
# targets of one gate (docs/GATES.md). Called by gate.yml once per platform.
#
# Nothing here installs Java, Maven or the upstream checkouts: Bazel fetches the
# pinned JDK, the jar pools and the legend-engine / legend-pure release archives
# itself (MODULE.bazel), from their lock files and sha256s. The cache below only
# saves the downloads and outputs between runs; a cold cache gives the same answer.
name: gates (run)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for every job."
        required: true
        type: string
      platform:
        description: "Short label for job and artifact names (linux/macos/windows)."
        required: true
        type: string
      gates:
        description: "Comma-separated lane keys to run (empty = all)."
        default: ""
        type: string
      low-memory:
        description: >-
          The 7 GB macOS runner: one test JVM at a time, and the PCT suites each
          in their own JVM (a suite's Pure graph is a 2.0-2.8 GB live set).
        default: false
        type: boolean

jobs:
  setup:
    name: lane matrix
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.gates }}
          LOW_MEMORY: ${{ inputs.low-memory }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ "$LOW_MEMORY" = "true" ]; then
            pct6='//pct:pct_duckdb_essential //pct:pct_duckdb_grammar //pct:pct_duckdb_relation //pct:pct_duckdb_standard //pct:pct_duckdb_unclassified //pct:pct_discipline'
            pct7p='//pct:pct_postgres_essential //pct:pct_postgres_grammar //pct:pct_postgres_relation //pct:pct_postgres_standard //pct:pct_postgres_unclassified //core:postgres_arm_test'
          else
            pct6='//pct:pct_duckdb'
            pct7p='//pct:pct_postgres //core:postgres_arm_test'
          fi
          all=$(jq -nc --arg pct6 "$pct6" --arg pct7p "$pct7p" '[
            {"key":"1",      "name":"gate 1 core suite",               "targets":"//core:core_tests"},
            {"key":"checks", "name":"generated files, dependency guards, source checks", "targets":"//:generated //tools/deps:all //core:guardrails //core:census"},
            {"key":"3",      "name":"gate 3 spec parity",              "targets":"//spec:spec_tests"},
            {"key":"4",      "name":"gates 4+11 DuckDB corpus, both judges", "targets":"//spec:corpus_duckdb"},
            {"key":"5",      "name":"gate 5 H2 corpus, both judges",   "targets":"//spec:corpus_h2"},
            {"key":"6",      "name":"gate 6 PCT DuckDB",               "targets":$pct6},
            {"key":"7",      "name":"gate 7 PCT H2 relation",          "targets":"//pct:pct_h2"},
            {"key":"7p",     "name":"gate 7P PCT Postgres 16",         "targets":$pct7p},
            {"key":"8",      "name":"gate 8 parser equivalence",       "targets":"//parser-equivalence:parser_parity"},
            {"key":"9",      "name":"gate 9 Channel B dual-verdict",   "targets":"//pct:pct_channel_b"},
            {"key":"10",     "name":"gate 10 stress corpus",           "targets":"//core:stress_suites"},
            {"key":"app",    "name":"DataCube app, WASM planner, warehouse", "targets":"//datacube:tests //wasm:all //warehouse:tests //query-store:lite_test"},
            {"key":"misc",   "name":"json, pure-protocol, query, query-store", "targets":"//json:tests //pure-protocol:twins_test //query:tests //query-store:local_test //query-store:share_test"},
            {"key":"build",  "name":"bazel build //... (every target builds)", "targets":"//..."},
            {"key":"native", "name":"warehouse as a native image, and its launcher", "targets":"//warehouse:tests_native //warehouse:launcher_test //datacube:app"},
            {"key":"browser", "name":"DataCube in a real browser, and live against the warehouse", "targets":"//datacube:live_snap_test"},
            {"key":"heavy",  "name":"one-off: the manual heavy targets (P1-02)", "targets":"//core:scale_profilebuildcost //core:scale_stresstest100k //core:scale_stresstest10k //core:scale_stresstestchaotic //core:scale_stresstestcomplexqueries //core:scale_stresstestdense //parser-equivalence:diagnostics //spec:corpus_warehouse //spec:reference_lane"},
            {"key":"heavy-pct", "name":"one-off: the manual per-suite PCT targets (P1-02)", "targets":"//pct:pct_discipline //pct:pct_duckdb_essential //pct:pct_duckdb_grammar //pct:pct_duckdb_relation //pct:pct_duckdb_standard //pct:pct_duckdb_unclassified //pct:pct_postgres_essential //pct:pct_postgres_grammar //pct:pct_postgres_relation //pct:pct_postgres_standard //pct:pct_postgres_unclassified"}
          ]')
          # ONE-OFF (Bazel workplan P1-02, gap G-08): the heavy lanes run only when a dispatch names them, so
          # the runner change is compared on the manual heavy targets too. P5-08 replaces them with a weekly
          # //gates:heavy run and deletes them.
          if [ -z "${WANT:-}" ]; then all=$(printf '%s' "$all" | jq -c '[.[] | select(.key != "heavy" and .key != "heavy-pct")]'); fi
          # the browser lane runs on Linux only: its harnesses drive DuckDB-WASM in Chromium, the same on
          # every platform, and live-vs-snap compares the native warehouse on x86_64 with the arm64 laptops'
          if [ "$PLATFORM" != linux ]; then all=$(printf '%s' "$all" | jq -c '[.[] | select(.key != "browser")]'); fi
          if [ -n "${WANT:-}" ]; then
            lanes=$(printf '%s' "$all" | jq -c --arg w ",$WANT," '[.[] | . as $e | select($w | contains("," + $e.key + ","))]')
          else
            lanes=$all
          fi
          [ "$(printf '%s' "$lanes" | jq 'length')" -gt 0 ] || {
            echo "::error ::no lane matches gates='${WANT:-}' — valid keys: 1,checks,3,4,5,6,7,7p,8,9,10,app,misc,build,native,browser,heavy,heavy-pct"
            exit 1
          }
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes" | jq -r '.[] | "lane: \(.name) -> \(.targets)"'

  lanes:
    name: ${{ matrix.lane.name }} (${{ inputs.platform }})
    needs: [setup]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    # Git Bash on Windows (MSYS) rewrites an argument that starts with '/' as a
    # path: '//core:core_tests' reached Bazel as '/core:core_tests' and every
    # Windows lane refused its targets (first Bazel CI run, 2026-09-23). Only the
    # '//' labels are exempted: switching conversion off wholesale (MSYS_NO_PATHCONV)
    # handed Bazel the cache paths in MSYS form, '/c/Users/...', which Windows
    # Bazel cannot read (second run). No-op elsewhere.
    env:
      MSYS2_ARG_CONV_EXCL: "//"
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.setup.outputs.lanes) }}
    steps:
      - name: line endings and long paths (a Windows checkout would corrupt the corpus)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Bazel downloads and outputs, keyed by the lock files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ inputs.platform }}-${{ hashFiles('MODULE.bazel.lock', 'maven_*_install.json', '.bazelversion') }}-${{ matrix.lane.key }}
          restore-keys: |
            bazel-${{ inputs.platform }}-${{ hashFiles('MODULE.bazel.lock', 'maven_*_install.json', '.bazelversion') }}-
            bazel-${{ inputs.platform }}-
      - name: a zone that is not UTC (the Windows app lane)
        # The hosted runners are UTC, which hides a test that reads the machine's zone where it should set its
        # own: on Windows DuckDB reads the system zone and ignores TZ (WarehouseJdbcTest's reference session,
        # found on an Eastern-time desk, 2026-10-02). This lane runs in Eastern time so that fix is exercised
        # (review of neema2/legend-lite#14, 2026-10-03).
        if: inputs.platform == 'windows' && matrix.lane.key == 'app'
        shell: pwsh
        run: |
          tzutil /s "Eastern Standard Time"
          tzutil /g
      - name: pyarrow, the warehouse's Arrow test's standard reader (test-only)
        if: matrix.lane.key == 'app' || matrix.lane.key == 'native'
        run: |
          set -euo pipefail
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" -m pip install --quiet --target "$RUNNER_TEMP/pyarrow" pyarrow==23.0.1
      - name: Chromium for the browser harnesses (Playwright's, at the lock file's version)
        if: matrix.lane.key == 'browser'
        run: bazel run --config=ci --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk" //datacube:install_browser -- --with-deps
      - name: bazel test ${{ matrix.lane.targets }}
        env:
          LANE_TARGETS: ${{ matrix.lane.targets }}
          LOW_MEMORY: ${{ inputs.low-memory }}
        run: |
          set -euo pipefail
          flags=(--config=ci --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk")
          if [ "$LOW_MEMORY" = "true" ]; then flags+=(--config=ci-small --local_test_jobs=1); fi
          # the one-off heavy lanes (P1-02): untagged JVMs at CI's -Xmx8g each, so one at a time
          case "${{ matrix.lane.key }}" in heavy|heavy-pct) flags+=(--local_test_jobs=1) ;; esac
          # the warehouse's Arrow test finds python with pyarrow, and FAILS (rather than skips) without it
          if [ "${{ matrix.lane.key }}" = app ] || [ "${{ matrix.lane.key }}" = native ]; then
            flags+=(--test_env=PATH --test_env=PYTHONPATH="$RUNNER_TEMP/pyarrow" --test_env=WAREHOUSE_ARROW_CHECK=required)
          fi
          read -r -a targets <<< "$LANE_TARGETS"
          echo "targets: ${targets[*]}"
          # the build lane builds every target (non-test targets included); every other lane tests
          if [ "${{ matrix.lane.key }}" = build ]; then cmd="build"; else cmd="test"; fi
          bazel "$cmd" "${flags[@]}" "${targets[@]}"
      - name: the browser harnesses (every //datacube, //query and //site target tagged browser-ci)
        if: matrix.lane.key == 'browser'
        run: |
          set -euo pipefail
          flags=(--config=ci --repository_cache="$HOME/.cache/bazel-repo" --disk_cache="$HOME/.cache/bazel-disk")
          mkdir -p harness-logs
          failed=()
          # the list first, so a failed query fails the step instead of running no harness at all
          harnesses=$(bazel query --repository_cache="$HOME/.cache/bazel-repo" 'attr(tags, "browser-ci", //datacube:* + //query:* + //site:*)')
          [ -n "$harnesses" ] || { echo "::error ::no browser-ci harness found"; exit 1; }
          # one at a time: each serves the site and drives its own browser
          for t in $harnesses; do
            name=${t##*:}
            echo "::group::$t"
            if bazel run "${flags[@]}" "$t" 2>&1 | tee "harness-logs/$name.log"; then :; else failed+=("$t"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error ::harnesses failed: ${failed[*]}"; exit 1; fi
      - name: test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-lane-${{ matrix.lane.key }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.outputs/**
            harness-logs/**
          if-no-files-found: ignore
