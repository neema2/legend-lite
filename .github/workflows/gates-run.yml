# ONE PLATFORM'S GATES, as parallel lanes: each lane is `bazel test` on one suite of gates/BUILD.bazel
# (`//gates:<lane>`), and the product job is `bazel build` of the product. Called by gate.yml once per platform.
# The lane set is docs/build-inventory/program/PHASE_8.md §8 (the build rebuild's first landing).
#
# Nothing here installs Java, Maven or the upstream checkouts: Bazel fetches the
# pinned JDK, the jar pools and the legend-engine / legend-pure release archives
# itself (MODULE.bazel), from their lock files and sha256s. The cache below only
# saves the downloads between runs; a cold cache gives the same answer.
name: gates (run)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for every job."
        required: true
        type: string
      platform:
        description: "Short label for job and artifact names (linux/linux-arm/macos/windows)."
        required: true
        type: string
      gates:
        description: "Comma-separated lane keys to run (empty = all)."
        default: ""
        type: string
      low-memory:
        description: >-
          The 7 GB macOS runner: one test JVM at a time (--config=ci-small). The
          PCT suites are one target per suite on every runner (P3-09).
        default: false
        type: boolean
      linux-only-tests:
        description: >-
          What macOS and Windows do with the tests tagged ci-linux-only (the browser harnesses): "ci-policy" skips
          them, as every push does; "everywhere" runs them, for a throwaway run that measures them on every platform.
        default: ci-policy
        type: string

jobs:
  setup:
    name: lane matrix
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.gates }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          # every lane is `bazel test //gates:<key>` (gates/BUILD.bazel says what each holds); the product job builds
          # the product, then analyses everything and checks that every test has a lane (below)
          all=$(jq -nc '[
            {"key":"product",            "cmd":"build", "name":"the product compiles: the servers, the web bundles, the WebAssembly, the native image, the sites, the app"},
            {"key":"core",               "cmd":"test",  "name":"core: the compiler, spec parity, json, protocol, the engine-runner launchers"},
            {"key":"checks",             "cmd":"test",  "name":"checks: generated files, the model projects, the guards, the pins, the corpus ratchets"},
            {"key":"corpus_duckdb",      "cmd":"test",  "name":"the relational corpus on DuckDB, both judges"},
            {"key":"corpus_h2",          "cmd":"test",  "name":"the relational corpus on H2, both judges"},
            {"key":"pct_duckdb",         "cmd":"test",  "name":"PCT on DuckDB"},
            {"key":"pct_h2",             "cmd":"test",  "name":"PCT on H2"},
            {"key":"pct_postgres",       "cmd":"test",  "name":"PCT on Postgres 16"},
            {"key":"pct_channel_b",      "cmd":"test",  "name":"PCT Channel B, the dual verdict"},
            {"key":"parser_equivalence", "cmd":"test",  "name":"parser equivalence"},
            {"key":"stress",             "cmd":"test",  "name":"the stress corpus"},
            {"key":"warehouse",          "cmd":"test",  "name":"the warehouse (on the JVM, as a native image, its launcher, live Postgres) and the legend-lite compiler as a native library"},
            {"key":"datacube",           "cmd":"test",  "name":"DataCube, and the planner in WebAssembly"},
            {"key":"ui",                 "cmd":"test",  "name":"Studio, Query, the saved-query store"},
            {"key":"sdlc",               "cmd":"test",  "name":"the model home: SDLC and Depot, server and page"}
          ]')
          if [ -n "${WANT:-}" ]; then
            lanes=$(printf '%s' "$all" | jq -c --arg w ",$WANT," '[.[] | . as $e | select($w | contains("," + $e.key + ","))]')
          else
            lanes=$all
          fi
          [ "$(printf '%s' "$lanes" | jq 'length')" -gt 0 ] || {
            echo "::error ::no lane matches gates='${WANT:-}' — valid keys: product,core,checks,corpus_duckdb,corpus_h2,pct_duckdb,pct_h2,pct_postgres,pct_channel_b,parser_equivalence,stress,warehouse,datacube,ui,sdlc"
            exit 1
          }
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes" | jq -r '.[] | "lane: \(.key) -> bazel \(.cmd) (\(.name))"'

  lanes:
    name: ${{ matrix.lane.key }} (${{ inputs.platform }})
    needs: [setup]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    # Git Bash on Windows (MSYS) rewrites an argument that starts with '/' as a
    # path: '//core:core_tests' reached Bazel as '/core:core_tests' and every
    # Windows lane refused its targets (first Bazel CI run, 2026-09-23). Only the
    # '//' labels are exempted: switching conversion off wholesale (MSYS_NO_PATHCONV)
    # handed Bazel the cache paths in MSYS form, '/c/Users/...', which Windows
    # Bazel cannot read (second run). No-op elsewhere.
    env:
      MSYS2_ARG_CONV_EXCL: "//"
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.setup.outputs.lanes) }}
    steps:
      - name: line endings and long paths (a Windows checkout would corrupt the corpus)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      # THE PRODUCT'S DOWNLOADS ONLY (docs/build-inventory/program/evidence/phase8/CI_LANES_2026_10_07.md §4 and §8):
      # Bazel's repository cache as the product build leaves it (the JDK, the product's jars, GraalVM, esbuild, Node
      # and the bundles' npm packages), one entry per platform shared by every lane, keyed by every pin (the lock
      # files, the product jars' table and MODULE.bazel's own archives, which no lock file records). Not in the key:
      # the runner image's version (GitHub rotates images run to run, so such a key almost never matched twice), and
      # the separator is '=' so one platform's prefix cannot match another's (linux matched linux-arm once). Not
      # cached: build outputs (GitHub keeps 10 GB per repository), and the test pools' jars (the product job saves
      # right after the product build, before its analysis of //... fetches every pool: that cache was 19 GB). Every
      # lane restores the entry; only the product job saves it, since actions/cache never adds to an existing key.
      # linux-arm has no product job, so its one lane (warehouse) saves at its end. What is saved is the downloads folder
      # itself, `content_addressable/`, and not `contents/` beside it: Bazel 9's repo contents cache, the UNPACKED
      # repositories (13 of Linux's 16 GB in L1c's run, evidence §10). A negated pattern (`!~/.cache/bazel-repo/contents`)
      # was tried first and saved everything (L1e's warm run: Linux 6.28 GB again, evidence §11): `path` matches entries,
      # not trees, so the folder's own entry matched and tar archived everything beneath it, and the negation had nothing
      # to remove; a positive path has nothing to get wrong. Bazel keeps using its contents cache during the job: the first cut of L1d
      # disabled it instead, and on Windows the product job's `--config=bazel10` command, whose incompatible flags make
      # Bazel refetch every repository, then re-extracted the JDK over its own java.dll, held open by a worker
      # ("Permission denied", the cold run of L1e, 2026-10-07); re-linking from the contents cache has no such step.
      - name: Bazel downloads, keyed by the pins
        id: repo
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: bazel-repo-${{ inputs.platform }}=${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'maven_*_install.json', 'tools/deps/jars*.bzl', '.bazelversion', '**/pnpm-lock.yaml', 'tools/python/requirements_lock.txt', 'tools/postgres/postgres.bzl') }}
          restore-keys: |
            bazel-repo-${{ inputs.platform }}=
      - name: a zone that is not UTC (the Windows warehouse, datacube and ui lanes)
        # The hosted runners are UTC, which hides a test that reads the machine's zone where it should set its
        # own: on Windows DuckDB reads the system zone and ignores TZ (WarehouseJdbcTest's reference session,
        # found on an Eastern-time desk, 2026-10-02). These lanes (the old app lane's members) run in Eastern time
        # so that fix is exercised (review of neema2/legend-lite#14, 2026-10-03).
        if: inputs.platform == 'windows' && (matrix.lane.key == 'warehouse' || matrix.lane.key == 'datacube' || matrix.lane.key == 'ui')
        shell: pwsh
        run: |
          tzutil /s "Eastern Standard Time"
          tzutil /g
      - name: Linux host prerequisites of the hermetic toolchain (D7) and bazelisk where the image has none
        if: startsWith(inputs.platform, 'linux')
        run: |
          set -euo pipefail
          # LLVM's prebuilt ld.lld links libxml2.so.2: the C toolchain's one recorded host library (MODULE.bazel)
          ldconfig -p | grep -q 'libxml2\.so\.2' || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxml2; }
          # the arm64 image may carry no bazelisk: the pinned one, by sha256 (spike S3's)
          if ! command -v bazel >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64)  arch=amd64; sha=5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992 ;;
              aarch64) arch=arm64; sha=e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010 ;;
            esac
            sudo curl -fsSL -o /usr/local/bin/bazel "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-$arch"
            echo "$sha  /usr/local/bin/bazel" | sha256sum -c -
            sudo chmod +x /usr/local/bin/bazel
          fi
      # THE REMOTE CACHE (the build rebuild's L1e, 2026-10-07; OD-5): BuildBuddy, read and written by every CI job, so a
      # lane downloads what the product job or an earlier run built (the native image, the WebAssembly planner, the
      # bundles) instead of building it again on its own runner. The key is the repository secret BUILDBUDDY_API_KEY
      # (gate.yml passes the secrets through); it goes into the runner's own ~/.bazelrc with the `remote` config
      # (.bazelrc), never onto a command line or into a log; on both the cache's and the event service's headers. CI's rc
      # also turns uploads on: the `remote` config itself uploads nothing, so only CI writes to the cache. Without the
      # secret (a fork, a desk) Bazel builds as before.
      - name: the remote cache (BuildBuddy)
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            printf 'common --config=remote\ncommon --remote_header=x-buildbuddy-api-key=%s\ncommon --bes_header=x-buildbuddy-api-key=%s\ncommon --remote_upload_local_results\n' \
              "$BUILDBUDDY_API_KEY" "$BUILDBUDDY_API_KEY" >> "$HOME/.bazelrc"
            echo "the remote cache is on (BuildBuddy)"
          else
            echo "::warning ::no BUILDBUDDY_API_KEY secret: building without the remote cache"
          fi
      # THE PRODUCT (docs/BUILD_REBUILD_DESIGN_2026_10_05.md §4.1): the compile targets and the app's packaging, nothing
      # else; //tools/guards:compile_only_test holds them to compiles and file plumbing. A step of its own, so the
      # downloads cache is saved right after it (below), before the analysis of everything fetches every pool.
      - name: bazel build product
        if: matrix.lane.key == 'product'
        # what tools/ci/lane-flags.sh reads, as every step that sources it is given it
        env:
          LOW_MEMORY: ${{ inputs.low-memory }}
          PLATFORM: ${{ inputs.platform }}
          LINUX_ONLY_TESTS: ${{ inputs.linux-only-tests }}
        run: |
          set -euo pipefail
          # the lane's Bazel flags, one file for every step (tools/ci/lane-flags.sh)
          . tools/ci/lane-flags.sh
          # the app package too (L1c, 2026-10-07): packaging, so the product job's (the datacube lane builds it again, as
          # package_test's data). The compiler as a native library (//native:compiler) is named on its own, never in
          # //:native: it does not build on Windows yet, and an incompatible member would make //:native, and so the
          # warehouse's image, skipped there; --skip_incompatible_explicit_targets skips the library alone
          bazel build "${flags[@]}" --skip_incompatible_explicit_targets //:java //:web //:wasm //:native //:sites \
            //datacube:app //datacube:app_package //native:compiler
          # the folder, what is saved (content_addressable/, the downloads: 3.1 GB on Linux, about 1 GB on macOS and Windows in
          # the cold run of L1e, under the 10 GB cap) and what is not (contents/, the unpacked repositories)
          du -sh "$HOME/.cache/bazel-repo" "$HOME/.cache/bazel-repo/content_addressable" "$HOME/.cache/bazel-repo/contents" 2>/dev/null || true
      # the downloads saved once per platform and pin hash, by the product job once the product is built (above);
      # the lanes never save (actions/cache never adds to an existing key: the first saver would fix the content)
      - name: Bazel downloads, saved by the product job
        if: matrix.lane.key == 'product' && steps.repo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: bazel-repo-${{ inputs.platform }}=${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'maven_*_install.json', 'tools/deps/jars*.bzl', '.bazelversion', '**/pnpm-lock.yaml', 'tools/python/requirements_lock.txt', 'tools/postgres/postgres.bzl') }}
      - name: the warehouse lane's two native images, built before its tests
        # TWO NATIVE IMAGES in this lane, the warehouse's and the compiler's (//native:compiler, for //python's tests):
        # each is a whole-machine build, so they are built first, one after the other, and the tests run after. A test
        # beside an image build timed out (//warehouse:tests_native, run 37830923226, 2026-10-08), and two images at
        # once on a 7 GB runner risk its memory. The compiler's image is skipped where it does not build (Windows, for
        # now). A step of its own: inside the lane step's script, shellcheck never finished on Windows
        # (//tools/guards:workflows_test timed out, probe run 37848560951). Its flags are the lane's, one file for both
        # steps (tools/ci/lane-flags.sh), so the tests reuse what is built here.
        if: matrix.lane.key == 'warehouse'
        env:
          LOW_MEMORY: ${{ inputs.low-memory }}
          PLATFORM: ${{ inputs.platform }}
          LINUX_ONLY_TESTS: ${{ inputs.linux-only-tests }}
        run: |
          set -euo pipefail
          . tools/ci/lane-flags.sh
          bazel build "${tflags[@]}" --skip_incompatible_explicit_targets //native:compiler
          bazel build "${tflags[@]}" --build_tests_only //gates:warehouse
      - name: bazel ${{ matrix.lane.cmd }} ${{ matrix.lane.key }}
        env:
          LOW_MEMORY: ${{ inputs.low-memory }}
          PLATFORM: ${{ inputs.platform }}
          LINUX_ONLY_TESTS: ${{ inputs.linux-only-tests }}
        run: |
          set -euo pipefail
          # the lane's Bazel flags -- flags, qflags (the queries'), tflags (the builds' and tests') -- one file for every
          # step (tools/ci/lane-flags.sh says what each holds and why)
          . tools/ci/lane-flags.sh
          if [ "${{ matrix.lane.key }}" = product ]; then
            # the product is built (the step above); here everything is analysed, and every test's lane checked
            # G14 (Bazel workplan P6-14): every target still analyzes under Bazel 10's incompatible flags (.bazelrc);
            # the manual hand targets by name, since //... leaves them out and no lane reaches them
            bazel build --nobuild --config=bazel10 "${flags[@]}" //... //:update_generated //tools/census:render_census //tools/census:lanes_diff //tools/junit:compare_testcases //wasm:startup
            # A25 (Bazel workplan P1-19, tools/platforms/BUILD.bazel): every non-test target of the native packages
            # analyzes for a platform none of them supports, the platform-specific ones skipped as incompatible
            S='//warehouse/... + //pct/... + //datacube/...'
            # the list first, so a failed query fails the step (a process substitution would hide its status)
            # the queries with the same flags as the builds (L1e): the same repository cache, so they fetch nothing twice
            list=$(bazel query "${qflags[@]}" "($S) except tests($S) except kind(test_suite, $S)" | grep -v '\.aspect_rules_js')
            [ -n "$list" ] || { echo "A25: the query returned no targets"; exit 1; }
            unlisted=()  # a read loop, not mapfile: macOS's bash is 3.2
            while IFS= read -r t; do unlisted+=("$t"); done <<< "$list"
            bazel build --nobuild --skip_incompatible_explicit_targets --platforms=//tools/platforms:unlisted_test "${flags[@]}" "${unlisted[@]}"
            # THE LANE GUARD (gates/BUILD.bazel): every test of the repository is in some lane, or in `heavy` (a
            # query's //... includes manual targets, unlike a build's): a new test goes into a suite, never nowhere
            unlaned=$(bazel query "${qflags[@]}" 'tests(//...) except tests(//gates:lanes) except tests(//gates:heavy)')
            [ -z "$unlaned" ] || { echo "::error ::tests in no lane of gates/BUILD.bazel:"; echo "$unlaned"; exit 1; }
          else
            bazel test "${tflags[@]}" "//gates:${{ matrix.lane.key }}"
            if [ "${{ matrix.lane.key }}" = warehouse ]; then
              # L1c (2026-10-07): the native server started by `bazel run` itself, with no script between, keeps an
              # argument holding '&' and a space intact, on every platform (PHASE_8.md U-6; what the launcher test
              # judged before the launcher went): the server's own refusal quotes the argument back, and exits 2
              set +e
              said=$(bazel run "${flags[@]}" //warehouse:serve -- --port 'x&y z' 2>&1)
              code=$?
              set -e
              printf '%s\n' "$said" | tail -2
              [ "$code" = 2 ] || { echo "::error ::bazel run //warehouse:serve exited $code, not 2 (the refusal)"; exit 1; }
              printf '%s\n' "$said" | grep -F "takes a number, not 'x&y z'" > /dev/null \
                || { echo "::error ::the argument did not reach the server intact"; exit 1; }
            fi
          fi
      - name: test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-lane-${{ matrix.lane.key }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.outputs/**
            bazel-bin/spec/judge_host_*/host.log
            bazel-bin/spec/judge_host_*/verdict.txt
            bazel-bin/spec/judge_database_*/database.log
            bazel-bin/spec/judge_database_*/verdict.txt
            bazel-bin/spec/judge_*/*-*.txt
          if-no-files-found: ignore
      # linux-arm has no product job: its one lane (warehouse) saves the downloads at its end, even after a red test
      # (the downloads are the pins', not the tests')
      - name: Bazel downloads, saved by the linux-arm lane
        if: always() && inputs.platform == 'linux-arm' && steps.repo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: bazel-repo-${{ inputs.platform }}=${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'maven_*_install.json', 'tools/deps/jars*.bzl', '.bazelversion', '**/pnpm-lock.yaml', 'tools/python/requirements_lock.txt', 'tools/postgres/postgres.bzl') }}
