# gate-env — everything a gate job needs beyond the legend-lite checkout:
#   * Java + a Maven cache
#   * the two ORACLE checkouts (legend-engine, legend-pure) at EXACTLY the
#     commits pinned in tools/oracle-pins.env, as siblings of legend-lite
#     (the same layout as a developer's ~/legend), shallow, by SHA
#   * LEGEND_ENGINE_ROOT / LEGEND_PURE_ROOT exported for tools/allgates.sh
#     and tools/diagnostics.sh, which then run unchanged.
# Expects the legend-lite repository to be checked out at ./legend-lite.
name: gate environment
description: Java, Maven cache, and the pinned legend-engine / legend-pure oracle checkouts
inputs:
  java-version:
    description: JDK to run the gates on
    default: "25"
runs:
  using: composite
  steps:
    - name: read oracle pins
      shell: bash
      run: |
        set -eu
        # KEY=VALUE lines only; comments and blanks dropped
        grep -E '^[A-Z_]+=' legend-lite/tools/oracle-pins.env >> "$GITHUB_ENV"
        # On Windows GITHUB_WORKSPACE is a backslash path (D:\a\...), which
        # bash reads as escapes and `git -C` chokes on. Forward slashes work
        # for the JVM, for git and for bash on all three platforms.
        ws=${GITHUB_WORKSPACE//\\//}
        echo "LEGEND_ENGINE_ROOT=$ws/oracles/legend-engine" >> "$GITHUB_ENV"
        echo "LEGEND_PURE_ROOT=$ws/oracles/legend-pure" >> "$GITHUB_ENV"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: legend-lite/**/pom.xml
    - name: checkout legend-engine (oracle, pinned)
      uses: actions/checkout@v4
      with:
        repository: ${{ env.LEGEND_ENGINE_REPO }}
        ref: ${{ env.LEGEND_ENGINE_SHA }}
        path: oracles/legend-engine
        fetch-depth: 1
    - name: checkout legend-pure (oracle, pinned)
      uses: actions/checkout@v4
      with:
        repository: ${{ env.LEGEND_PURE_REPO }}
        ref: ${{ env.LEGEND_PURE_SHA }}
        path: oracles/legend-pure
        fetch-depth: 1
    # No roots check here: the clones above ARE the pinned SHAs, so "present
    # and on the pin" holds by construction (tools/allgates.sh still runs
    # oracle_roots_check on entry — the laptop guard, a no-op comparison in
    # CI). The one check worth running in CI is the pins file against the
    # poms, the fixture and the REMOTE tags — no git against the clones.
    - name: upstream is ONE release (pins, poms, fixture, remote tags agree)
      shell: bash
      working-directory: legend-lite
      run: tools/version-report.sh --check
