# THE GS-QUANT ORACLE'S MAPPING (CLAUDE.local.md's contract; docs/TS_GSQUANT_ORACLE_2026_11_01.md is the first oracle's
# account): each word of docs/timeseries/WORDS.md (84 on upstream/claude/timeseries-language c047d41b0) to the
# gs_quant.timeseries function that computes it, and the cases the oracle runs: each case a lite `#TS` item and the
# gs-quant call that is its twin, written side by side so that one list drives both sides (snap.py runs `gs`;
# //core:ts_gsquant_parity_test runs `ts`). A word gs-quant has no function for is SKIP, its reason said.
#
# gs-quant at the pin (pins.env's GS_QUANT_VERSION, the one place the release is written), read from its installed
# sources (`src`: file:line under gs_quant/timeseries/).
#
# A CASE is [args, ts, gs] or [args, ts, gs, column]:
#   args    the case's name within its word (`w=20`, `default`), the answers' and the ledger's key `<word> <args>`
#   ts      a #TS item: written as `SELECT <ts> AS ts_value FROM px ON date` over the samples, `{x}` read as
#           close[symbol = 'NVDA'] and `{y}` as close[symbol = 'SPX']; or, starting `WITH`, the whole statement
#   gs      `printed`: the gs-quant call is Show Python's -- the case's #TS item as the tile's printer prints it
#           (calls.tsv, which //datacube:timeseries_builder_test writes and holds: {x} as column('close', 'NVDA'), {y}
#           as column('close', 'SPX'), each word gs-quant's own function by its tags), so the code the tile shows is the
#           code gs-quant answers (docs/TS_DECISIONS_2026_11_07.md item 14f, step 2, 2026-11-09). Else, where the printer
#           prints no call (a whole statement; a form gs-quant has no call for, calls.tsv's REFUSED), the call written
#           here: a Python expression over gs_quant.timeseries as `ts` (and its enums, `Window`, `dt`), `x` and `y` the
#           same two lines as pandas Series (dates the index, float values), `cpi` macro's CPI (monthly), `px` the
#           prices frame. Either answers a Series (one value a date), a DataFrame (`column` picks one) or a number (on
#           every date of x)
#   column  a struct word's field: lite's `ts_value_<column>`, gs-quant's DataFrame column by position (0 lower, 1 upper)
#
# Translation of lite's span to gs-quant's window (helper.py:197 normalize_window), as the printer writes it (and the
# hand calls left):
#   n (observations)   -> n                  gs-quant's Window(n, n): rolled over n, its first n points dropped (O1)
#   Nd Nw Nmo Ny        -> 'Nd' 'Nw' 'Nm' 'Ny' a pandas DateOffset, (date - N unit, date]
#   all                -> Window(None, 0)     every observation to date (gs-quant's default for every window)
#   whole              -> the word's whole-series form in gs-quant (zscores' and winsorize's default)
# EVERY gs-quant window defaults to Window(None, 0), to date. Where lite's default is a count (14, 20, 22, 63, 252),
# the `default` case passes lite's default to gs-quant explicitly (`defaults` names it): the oracle never judges one
# default against another.
#
# known: a docs/SEMANTICS_REGISTER.md row that predicts a DIFF on the cases it names (a ruled departure): the ledger
# cites it, and the parity test holds the row to it.
#
# THE WORD COUNT: 87 on aad8e762a. PR #86 (merged 2026-11-02, head 69796cc5) shipped 81; six came after it,
# each marked `since:` so this table audits against docs/timeseries/WORDS.md: rank (5a4904a54, 2026-11-03), round_down
# and round_up (0cfd500fb, A4, 2026-11-06), floor and ceil (gs-quant's clamps, S161, 2026-11-08) and cash_index (the
# risk-free data model, 23a007a3f, 2026-11-08). Two rows more are no word yet: wavg and wsum, ruled by R15
# (docs/TS_ONE_TREE_PLAN_2026_10_31.md §11) and not in WORDS.md nor the library, SKIP with `ruled:` -- 89 rows.
#
# THE LIBRARY'S OWN TAGS: each word's function in projects/timeseries/model.pure carries `timeseries::Words.gsQuant`,
# the module.function it names as its gs-quant twin, or `DataCube (...)` / `none (...)` where it has none. Every MAPPED
# word's `gs` is its tag's function, and every SKIP word's tag is DataCube's or none, but for the words marked `tag:`
# (snap.py reports TAG on any other disagreement).

format: 1
gs_quant: pins.env (GS_QUANT_VERSION)

words:
