    src: datetime.py:150
    note: "CPI (monthly) onto SPX's dates. method=zero passes y's dates as a list: gs-quant's ZERO branch reads a Series' VALUES as the dates (datetime.py:212, pd.Series(0.0, dates)), against its own docstring (a series' index), so its answer is indexed by SPX's closes, every one read as a date 1970-01-01 -- a gs-quant defect, an Open finding; the list is its other documented form; method=zero,dates=series asks the defective form itself, so the ledger records gs-quant's answer there. S145 (step's backfill before x's first value) cannot show here: CPI starts in 2015, before every date of SPX"
    cases:
      - [default, "WITH macro AS (SELECT * FROM local::DB.macro), px AS (SELECT * FROM local::DB.prices) SELECT interpolate(macro.value[series = 'CPI'], px.close[symbol = 'SPX']) AS ts_value FROM macro ON date, px ON date", "ts.interpolate(cpi, y)"]
      - [method=nan, "WITH macro AS (SELECT * FROM local::DB.macro), px AS (SELECT * FROM local::DB.prices) SELECT interpolate(macro.value[series = 'CPI'], px.close[symbol = 'SPX'], method => 'nan') AS ts_value FROM macro ON date, px ON date", "ts.interpolate(cpi, y, Interpolate.NAN)"]
