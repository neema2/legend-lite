      - ["method=zero,dates=series", "WITH macro AS (SELECT * FROM local::DB.macro), px AS (SELECT * FROM local::DB.prices) SELECT interpolate(macro.value[series = 'CPI'], px.close[symbol = 'SPX'], method => 'zero') AS ts_value FROM macro ON date, px ON date", "ts.interpolate(cpi, y, Interpolate.ZERO)"]
      - [method=step, "WITH macro AS (SELECT * FROM local::DB.macro), px AS (SELECT * FROM local::DB.prices) SELECT interpolate(macro.value[series = 'CPI'], px.close[symbol = 'SPX'], method => 'step') AS ts_value FROM macro ON date, px ON date", "ts.interpolate(cpi, y, Interpolate.STEP)"]
