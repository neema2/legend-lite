# BAZEL'S DOWNLOADER IN CI (--downloader_config, .bazelrc's `common:ci`; 2026-11-19): every fetch from Maven Central --
# tools/deps/jars.bzl's http_jar repositories and rules_jvm_external's pools alike, both of which name
# repo1.maven.org -- is tried at Maven Central first and then at Google's mirror of it, the mirror rules_jvm_external
# used by default. Maven Central answered GitHub's runners 404 and 429 for jars it serves (h2-2.1.214.jar,
# httpcore-4.4.13.jar), and CI's download cache holds the product's downloads alone (gates-run.yml), so every lane
# fetches the test pools' jars afresh. The same files from either host: Bazel checks each download against the sha256
# its pin records and refuses a mismatch, so nothing is trusted that the build does not already trust.
#
# Each rule matches a URL with its scheme left out; every rule that matches gives a URL, tried in order.
rewrite repo1.maven.org/maven2/(.*) repo1.maven.org/maven2/$1
rewrite repo1.maven.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
