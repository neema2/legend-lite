<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCube on Deephaven</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="grid.css">
<link rel="stylesheet" href="app.css">
<style>
  :root { color-scheme: light; --muted: #6b6b66; --ok: #127a3a; --warn: #9a6200; --bad: #b3261e; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 12px/16px Roboto, ui-sans-serif, system-ui, sans-serif;
    background: #fff;
    color: #000;
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid #e3e2de; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; color: var(--warn); }
  #status.ok { color: var(--ok); }
  #status.error { color: var(--bad); }
  #counts { color: var(--muted); }
  /* ONE CUBE, the rest of the page */
  #cube { position: relative; flex: 1; min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>DataCube on Deephaven</h1>
  <span id="status">starting</span>
  <span id="counts"></span>
</header>
<div id="cube"></div>
<script type="module" src="./cube.js"></script>
</body>
</html>
