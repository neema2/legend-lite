<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCube demo</title>
<!-- Roboto first, because their font stack names it first and the
     metrics are part of the look: without it nothing lines up the
     same way, however exact the pixel values are. -->
<!-- Served with the site (fonts.css, vendor/fonts): no request leaves for a font CDN. -->
<link rel="stylesheet" href="fonts.css">
<!-- Start the in-tab planner's 4.2 MB module downloading with the HTML parse -- WHEN IT IS THE
     PLANNER (no ?planner=, or ?planner=local; boot.ts chosenPlane makes the choice, this only
     starts the download early). Without the hint the fetch waits behind bundle.js. -->
<script>
  if ((new URLSearchParams(location.search).get('planner') ?? 'local') === 'local') {
    const hint = document.createElement('link');
    Object.assign(hint, { rel: 'preload', as: 'fetch', type: 'application/wasm', href: './vendor/classes.wasm', crossOrigin: 'anonymous' });
    document.head.append(hint);
  }
</script>
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="../src/grid/grid.css">
<link rel="stylesheet" href="../src/app.css">
<style>
  :root { color-scheme: light dark; }
  :root {
    /* The page paints its own white ground and black text below, so
       say so. Without this a browser running auto-dark inverts the
       ground and leaves the hardcoded greys unreadable -- reported
       as "almost black on black". */
    color-scheme: light;
  }
  /* THE PAGE IS THE VIEWPORT. No padding, no page scroll: the cube
     fills it and does its own scrolling inside. */
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    /* Their .data-cube base: 12px Roboto. */
    font: 12px/16px Roboto, ui-sans-serif, system-ui, sans-serif;
    background: #fff;
    color: #000;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; margin: 0 0 16px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-bottom: 12px;
  }
  label { display: inline-flex; gap: 6px; align-items: center; }
  button {
    font: inherit; padding: 5px 12px; border-radius: 5px;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: Canvas; color: CanvasText; cursor: pointer;
  }
  button:hover { background: color-mix(in srgb, currentColor 8%, Canvas); }
  /* NO FIXED HEIGHT. This pinned the grid to 420px, which was right
     when the page was a document with text above and below it. The
     page is the viewport now, so the grid takes whatever the title
     bar and the zones leave. */
  #busy {
    font-size: 12px; padding: 2px 8px; border-radius: 4px;
    background: color-mix(in srgb, currentColor 10%, transparent);
  }
  details { margin-top: 12px; }
  pre {
    margin: 6px 0 0; padding: 10px; overflow-x: auto; font-size: 12px;
    border-radius: 6px;
    background: color-mix(in srgb, currentColor 7%, Canvas);
  }
  .warn {
    margin: 0 0 12px; padding: 8px 12px; border-radius: 6px; font-size: 13px;
    background: color-mix(in srgb, orange 14%, Canvas);
    border: 1px solid color-mix(in srgb, orange 40%, transparent);
  }
</style>
<style>
  #app { height: 100vh; }

  /* In the cube's STATUS bar now, so it has to be small and quiet.
     Scoped to the bar: the same element is offstage until `boot`
     moves it, and an offstage width cap would be nonsense. */

</style>
</head>
<body>
  <!-- NOTHING BUT THE GRID. Every banner, pane and control strip that
       used to sit around it is reachable from the cube's own title bar
       now: the status text sits in its status bar, the plane is the
       Live/Snapped toggle in its title bar, and the data and query
       panels open as floating windows from the hamburger. The cube
       fills the viewport. -->
  <div id="app"></div>

  <!-- OFFSTAGE. These carry state the demo still needs; `boot` moves
       the one it shows into the cube's status bar. Kept in the markup
       rather than built in script so the page remains readable as a
       page. -->
  <div id="offstage" hidden>
    <span id="status">loading&hellip;</span>
    <span id="busy"></span>
  </div>

  <!-- THE REFUSAL, which has to be able to show itself: the chosen planner (?planner=) did not
       answer, and the page has no other to fall back to. Outside the offstage box -- a hidden
       parent hides its children however unhidden they are. Filled by `refusePlanner`. -->
  <p class="warn" id="plannermissing" hidden
     style="position: fixed; z-index: 30; inset: 12px 12px auto;
            background: color-mix(in srgb, crimson 10%, #fff);
            border-color: color-mix(in srgb, crimson 45%, transparent);"></p>

  <!-- A START THAT DID NOT DOWNLOAD (seen on the published site, 2026-10-23): a part of the bundle not found -- a deploy
       landing while the page loads, a browser's cached bundle naming parts the deploy replaced -- fails the module
       before any of DataCube's code runs, so main.ts cannot say it, and the status above is offstage. Said here, on the
       page, by the script's own error event: never a blank page. -->
  <p class="warn" id="startfailed" hidden
     style="position: fixed; z-index: 30; inset: 12px 12px auto;
            background: color-mix(in srgb, crimson 10%, #fff);
            border-color: color-mix(in srgb, crimson 45%, transparent);"></p>

  <!-- The app's windows (Open…, Share, the Generated Pure & SQL) are the app's own: src/app/datacube-app.ts builds
       them. -->

  <script type="module" src="./bundle.js" onerror="
    var said = 'DataCube did not finish downloading: a part of it was not found (the site may have just been updated). Reload the page.';
    var box = document.getElementById('startfailed');
    box.textContent = said;
    box.hidden = false;
    var status = document.getElementById('status');
    status.textContent = 'failed to start: ' + said;
    status.classList.add('bad');
  "></script>
</body>
</html>
