          - {path: "bodies/MSG-0005.txt", charStart: 169, charEnd: 216, sha256: 17d349212b20333170d0b1c037ecdedbc1381e73a4069e7e0f412d416db44195, snippet: "Please replace our earlier order with this one."}
      structured:
        - query: "sales::AllocationRequest.all()->filter(r|$r.client.clientId == 'C-01' && $r.deal.dealId == 'D-01')->project(~[requested:x|$x.requestedQtyUsd, limitPrice:x|$x.limitPrice, sensitivity:x|$x.priceSensitivity])"
          rows: [[20000000, 99.75, "Hard"]]
    superseded:
