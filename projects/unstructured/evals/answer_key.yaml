# The unstructured study's answer key: 50 cases, written from the source files before any tuning.
# Not frozen. Every case is unresolved until it is marked resolved; an unresolved case is never counted.
# resolved by ABS, 2026-11-09, each case read against its question
#
# Ids are those of CANDIDATES.md, kept for traceability; the gaps are the cases that were cut.
#
# A text pointer is relative to its corpus's directory under projects/unstructured/corpus: edgar for EDGAR, emails for
# SALES, loans for LENDING. charStart and charEnd are Unicode code points of the file; sha256 is of exactly that span
# as UTF-8; snippet is at most 25 words of it, for the reader. A pointer never copies the passage.
#
# route: text is passage retrieval. structured is a Pure query answered by the semantic layer, over any class the model
# maps. both means each route is judged against its own expected, on its own part of the case.
# A structured query names its filing or agreement. Its rows are compared as a set, numbers by value.
#
# The hit rule: before any cut, results are deduped by sha256 into one row per hash, and that row carries every
# (path, charStart) holding the hash. A hit is credited when any accepted (path, charStart) is among the row's
# locations. Each result shows its own agreement, with source, section, date and sha256.
#
# match is required on every text list, with no default. all: the case needs every accepted pointer credited. any: one
# credited pointer answers it, and the others are equally good. On an empty list it has nothing to test.
#
# superseded, on every time-aware case, lists the earlier pointers that must not be credited. A hit on one is reported
# as its own verdict, STALE_HIT, never as a pass. On the structured route a superseded row is matched by value, against
# its rows; the csv line is provenance.
#
# A negative case expects the empty set: nothing in the corpus. An error is not an empty result.

